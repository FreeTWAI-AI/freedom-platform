name: Credential ingest diagnostic
# Diagnostic evidence for the reviewed PR415 candidate only. This workflow
# cannot replace the installed App-bound gate or its five fixed browser passes.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/credential-ingest-diagnostic.yml'
      - 'tests/runtime/credential-ingest-rate-budget.test.ts'
      - 'tests/runtime/credential-ingest-helpers.ts'
      - 'tests/runtime/credential-ingest-fixtures/**'
permissions:
  contents: read
concurrency:
  group: credential-ingest-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ingest-fixture:
    if: ${{ github.event.pull_request.number == 415 && github.event.pull_request.head.repo.full_name == 'FreeTWAI-AI/freedom-platform' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Immutable reviewed application candidate, not a moving branch.
          ref: 1bde2a4d5be84d78a36a7819dbda587e54e9d967
          persist-credentials: false
      - name: Record and confirm application identity
        run: test "$(git rev-parse HEAD)" = 1bde2a4d5be84d78a36a7819dbda587e54e9d967
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      # Synthetic fixture generates its own identities, keys, TLS certificates
      # and local provider. No repository/environment secrets are passed.
      # Ordinary reporter keeps the original failure visible for this diagnosis;
      # it does not replace required pinned-runner evidence.
      - name: Run unchanged six-case credential ingest fixture with original diagnostics
        run: node --import tsx --test --test-reporter=spec --test-concurrency=1 tests/runtime/credential-ingest-rate-budget.test.ts
