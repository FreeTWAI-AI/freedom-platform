name: Notification preferences supplemental
# Diagnostic evidence for the reviewed PR412 candidate only. This workflow
# cannot replace the installed App-bound gate or its five fixed browser passes.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/notification-preferences-supplemental.yml'
      - '**/*notification-preferences*'
      - 'apps/portal-web/src/App.tsx'
      - 'apps/portal-web/src/GameConsole.tsx'
      - 'scripts/e2e-server.ts'
      - 'playwright.config.ts'
permissions:
  contents: read
concurrency:
  group: notification-preferences-supplemental-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preferences-on:
    if: ${{ github.event.pull_request.number == 412 && github.event.pull_request.head.repo.full_name == 'FreeTWAI-AI/freedom-platform' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Immutable reviewed application candidate, not a moving branch.
          ref: 7ff3bbb535aff3157125cfbe4a8aba8f39cf8a2d
          persist-credentials: false
      - name: Record and confirm application identity
        run: test "$(git rev-parse HEAD)" = 7ff3bbb535aff3157125cfbe4a8aba8f39cf8a2d
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - name: Notification preference database regressions
        run: node --import tsx --test --test-concurrency=1 tests/runtime/notification-preferences.test.ts
      - name: Notification preferences enabled browser regression
        env:
          FREEDOM_E2E_NOTIFICATION_PREFERENCES: '1'
        run: npm run test:e2e -- tests/e2e/notification-preferences.spec.ts
