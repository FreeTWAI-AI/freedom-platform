name: Verify local milestone
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
# Candidate CI is diagnostic; it cannot publish the operator's App-bound gate.
# Only superseded PR runs are cancelled; queued merge candidates run independently.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # This required check summarizes ALL parallel diagnostic jobs. A cancelled or
  # skipped dependency is a failure here, never an implicit green aggregate.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [runtime-full, runtime-aggregate, ui-e2e, static-worker, governance-consumers]
    if: ${{ always() }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require every verification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const required = ['runtime-full', 'runtime-aggregate', 'ui-e2e', 'static-worker', 'governance-consumers'];
          if (Object.keys(needs).length !== required.length || required.some(id => needs[id]?.result !== 'success')) {
            console.error('A required verification job failed, was cancelled, skipped, or is missing.');
            process.exit(1);
          }
          NODE
  runtime-full:
    name: runtime-full (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Independent runners and PostgreSQL services: one sequential test process
    # per 50-file partition (200 current runtime files), rather than four
    # competing on the same host. Selection and aggregation remain dynamic.
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Ephemeral test cluster: retain fsync/full_page_writes, avoid paced
          # checkpoints blocking fixture DROP DATABASE behind a disk backlog.
          POSTGRES_INITDB_ARGS: '-c checkpoint_completion_target=0 -c max_locks_per_transaction=256'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=4294967296
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify disposable PostgreSQL storage and checkpoint settings
        run: bash scripts/ci/verify-runtime-postgres.sh '${{ job.services.postgres.id }}'
      - name: Record actual runner CPU capacity
        run: |
          nproc
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            cat /sys/fs/cgroup/cpu.max
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us
          elif [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us
          else
            echo 'cpu_quota_not_exposed; nproc_only_readback'
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Retain the former sequential job's generated/browser build prerequisites.
      - run: npm run contracts:build
      - run: npm run build
      - name: Install and verify native CLI isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap gcc apparmor apparmor-profiles
          # Verify the exact stock profile and render only the reviewed deleted-inode
          # mediation flag; retain AppArmor/userns restrictions and prove isolation.
          bash scripts/ci/verify-native-cli-prerequisites.sh
      - name: Complete this runtime partition in its owned database
        run: |
          node --test --test-concurrency=1 tests/contribution-tools/runtime-sharding.integration.test.mjs
          node scripts/runtime-full.mjs --partition-count 4 --partition-index ${{ matrix.partition }} --output .freedom/reports/runtime-partition-${{ matrix.partition }}.json
        env:
          # This job's synthetic PostgreSQL service uses loopback trust only.
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - name: Preserve complete or failed runtime partition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-partition-${{ matrix.partition }}
          path: .freedom/reports/runtime-partition-${{ matrix.partition }}.json
          if-no-files-found: warn
  runtime-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: runtime-full
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download only this run's four partition artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-partition-*
          path: .freedom/reports/runtime-partitions
          merge-multiple: true
      - name: Require exact complete union and original overall runtime deadline
        run: node scripts/runtime-aggregate.mjs --input-dir .freedom/reports/runtime-partitions --output .freedom/reports/runtime-full-matrix.json
      - name: Preserve aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-full-matrix
          path: .freedom/reports/runtime-full-matrix.json
          if-no-files-found: warn
  ui-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - run: npm run test:e2e
  static-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run check:common-contracts
      - run: npm run check:runtime-registration
      - run: npm run check:bootstrap
      - run: npm run check:device-pairing
      - run: npm run check:bootstrap-session
      - run: npm run check:bootstrap-http
      - run: npm run check:model-broker-bridge
      - run: npm run check:model-credential-ingest
      - run: npm run check:member-model-settings
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run typecheck
      - run: npm run build
      - run: npm run worker:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:admin-sync
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:maintainer
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run check:broker-worker-candidate
      - run: npm run worker:dry-run:broker
      - run: npm run worker:dry-run:media-operator
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test:worker
      - run: npm run test:media-restore
  governance-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r docs/platform-plan/contracts/tests/requirements-static.txt
      - run: npm run contracts:build
      - run: npm run test:skill-client
      # This integration launches every synthetic baseline file in the fixed
      # runtime runner. Keep it required, outside the 60-second unit adapter.
      - name: Verify complete runtime selection union
        run: node --test --test-concurrency=1 tests/contribution-tools/runtime-union.integration.test.mjs
      - run: npm run test:governance
      - run: node scripts/checkout-repositories.mjs
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      - run: npm run test:repos
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      - run: npm run test:contracts
      - run: npm run verify:inventory
  # Separate diagnostic; enforcement depends on actual branch/ruleset settings.
  deploy-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test deploy/cloudflare/test/*.test.mjs
