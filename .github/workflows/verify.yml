name: Verify local milestone
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: freedom_local
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U freedom_local -d freedom_local"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/freedom_local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r docs/platform-plan/contracts/tests/requirements-static.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/checkout-repositories.mjs
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      - run: npm run test:repos
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      - run: npm run test:e2e
      - run: npm run test:contracts
      - run: npm run verify:inventory
