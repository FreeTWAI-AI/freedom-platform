name: Verify local milestone
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
# GitHub Free ruleset 25011111 requires App-bound verify/CodeQL checks and review.
# CI controls require approval under the base branch's CODEOWNERS.
# This does not enforce an external fixed workflow SHA.
# Only superseded PR runs are cancelled; queued merge candidates run independently.
# verify always runs. source-integrity preserves canonical contracts, runtime
# text, immutable migrations, Git source identity, links and trusted unit tests.
# Complete byte inventories and restored source trees are produced on main.
# A pull request skips all heavy jobs only when the pinned selector proves a
# docs-only change. Fixed frontend leaf profiles retain every runtime, browser
# and static job, skipping only unrelated consumer/deployment checks. Unknown
# paths or descriptor/owner/dependency drift retain full selection. The two
# reviewed guild leaves use their complete presentation lane plus static-worker,
# only after proving the exact clean integration tree and dependency closure.
# The exact generated manifest
# docs/platform-plan/verification/2026-09-20-file-inventory.json may accompany
# qualifying edits and is not itself allowlisted. No other docs/platform-plan path is exempt.
# Push, merge queue, rename, delete, unknown, governance, security, and
# shared-runtime changes keep the full set.
# The selector, the verify aggregate, the runtime partition runner, the runtime aggregate and every node:test, pytest and browser suite runner come from job.workflow_sha, checked out at .freedom/trusted.
# The pinned runner derives each file set from the candidate tree and requires complete per-file and per-case evidence.
# Candidate package scripts, globs and runner files do not define a required test suite.
# The build, typecheck, dry-run and check scripts stay candidate-defined.
# Candidate code still executes on the same runner, so this is not a sandbox against a hostile candidate.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      reason: ${{ steps.decision.outputs.reason }}
      runtime_full: ${{ steps.decision.outputs.runtime_full }}
      runtime_aggregate: ${{ steps.decision.outputs.runtime_aggregate }}
      ui_e2e: ${{ steps.decision.outputs.ui_e2e }}
      static_worker: ${{ steps.decision.outputs.static_worker }}
      governance_consumers: ${{ steps.decision.outputs.governance_consumers }}
      deploy_preflight: ${{ steps.decision.outputs.deploy_preflight }}
      guild_presentation: ${{ steps.decision.outputs.guild_presentation }}
    steps:
      - name: Checkout the pinned selector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-selector
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the candidate tree for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Select affected jobs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node trusted-selector/scripts/ci/select-affected-jobs.mjs \
            --allow-fetch \
            --event "$EVENT_NAME" \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --candidate "$CANDIDATE_SHA" \
            --pull-request "$PR_NUMBER" \
            --github-output "$GITHUB_OUTPUT"
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set the run-specific source archive path
        run: printf 'SOURCE_ARCHIVE_ROOT=%s/freedom-source-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install fixed host manifest validator dependency
        run: python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple jsonschema==4.26.0
      - run: npm ci
      - run: npm run contracts:build
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run check:runtime-text
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Verify source identity, immutable migrations and local links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          mkdir -p .freedom/reports
          python .freedom/trusted/scripts/ci/verify-source-boundaries.py \
            --repository "$GITHUB_WORKSPACE" --base "$BASE_SHA" \
            --candidate "$CANDIDATE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME" \
            > .freedom/reports/source-boundaries.json
      - run: python .freedom/trusted/scripts/ci/test_source_boundaries.py
      - name: Archive and restore the complete main source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          mkdir -m 700 "$SOURCE_ARCHIVE_ROOT"
          trap 'rm -rf "$SOURCE_ARCHIVE_ROOT/restored"' EXIT
          SOURCE_TREE=$(git rev-parse "$CANDIDATE_SHA^{tree}")
          python .freedom/trusted/scripts/release-source-archive.py build \
            --repository "$GITHUB_WORKSPACE" --source "$CANDIDATE_SHA" \
            --expected-tree "$SOURCE_TREE" --output "$SOURCE_ARCHIVE_ROOT/source" \
            > .freedom/reports/source-archive-build.json
          SOURCE_INVENTORY=$(python -c 'import json; print(json.load(open(".freedom/reports/source-archive-build.json"))["inventory_sha256"])')
          python .freedom/trusted/scripts/release-source-archive.py verify \
            --archive "$SOURCE_ARCHIVE_ROOT/source/source.tar" \
            --inventory "$SOURCE_ARCHIVE_ROOT/source/inventory.json" \
            --source "$CANDIDATE_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-inventory "$SOURCE_INVENTORY" --restore-to "$SOURCE_ARCHIVE_ROOT/restored" \
            > .freedom/reports/source-archive-restore.json
      - name: Preserve the source verification and release archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-integrity-${{ github.sha }}
          path: |
            .freedom/reports/source-*.json
            ${{ env.SOURCE_ARCHIVE_ROOT }}/source/
          if-no-files-found: warn
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.selector-unit
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.governance-unit
  # This required check always runs. source-integrity must succeed. A selected
  # job must succeed. An unselected heavy job may be skipped or may succeed.
  # Failure, cancellation, and a skip of a selected job do not pass.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [select, source-integrity, runtime-full, runtime-aggregate, ui-e2e, static-worker, governance-consumers, deploy-preflight, guild-presentation]
    if: ${{ always() }}
    steps:
      - name: Checkout the pinned aggregate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-selector
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require integrity and every selected job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node trusted-selector/scripts/ci/select-affected-jobs.mjs --check-aggregate
  runtime-full:
    name: runtime-full (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.runtime_full == 'true') }}
    # Independent runners and PostgreSQL services: eight partitions, each one
    # serial test process. Measured weights balance the partitions; the pinned
    # suite runner owns their execution budgets. Selection and aggregation stay dynamic.
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Ephemeral test cluster: retain fsync/full_page_writes, avoid paced
          # checkpoints blocking fixture DROP DATABASE behind a disk backlog.
          POSTGRES_INITDB_ARGS: '-c checkpoint_completion_target=0 -c max_locks_per_transaction=256 -c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --memory 4g
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify disposable PostgreSQL storage and checkpoint settings
        run: bash scripts/ci/verify-runtime-postgres.sh '${{ job.services.postgres.id }}'
      - name: Record actual runner CPU capacity
        run: |
          nproc
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            cat /sys/fs/cgroup/cpu.max
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us
          elif [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us
          else
            echo 'cpu_quota_not_exposed; nproc_only_readback'
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Retain the former sequential job's generated/browser build prerequisites.
      - run: npm run contracts:build
      - run: npm run build
      - name: Install and verify native CLI isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap gcc apparmor apparmor-profiles
          # Verify the exact stock profile and render only the reviewed deleted-inode
          # mediation flag; retain AppArmor/userns restrictions and prove isolation.
          bash scripts/ci/verify-native-cli-prerequisites.sh
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Verify the shared runtime partition runner once
        if: ${{ matrix.partition == 0 }}
        run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.runtime-sharding-integration
        env:
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - name: Complete this runtime partition in its owned database
        run: |
          node .freedom/trusted/scripts/runtime-full.mjs --partition-count 8 --partition-index ${{ matrix.partition }} --output .freedom/reports/runtime-partition-${{ matrix.partition }}.json
        env:
          # This job's synthetic PostgreSQL service uses loopback trust only.
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - name: Preserve complete or failed runtime partition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-partition-${{ github.run_attempt }}-${{ matrix.partition }}
          path: .freedom/reports/runtime-partition-${{ matrix.partition }}.json
          if-no-files-found: warn
  runtime-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [select, runtime-full]
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.runtime_aggregate == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      # A failed-only rerun must not borrow passes from an earlier attempt.
      # download-artifact defaults to this workflow run; names bind its attempt.
      - name: Download only this attempt's eight partition artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-partition-${{ github.run_attempt }}-*
          path: .freedom/reports/runtime-partitions
          merge-multiple: true
      - name: Require exact complete union, per-partition deadlines and bounded queue span
        run: node .freedom/trusted/scripts/runtime-aggregate.mjs --partition-count 8 --input-dir .freedom/reports/runtime-partitions --output .freedom/reports/runtime-full-matrix.json
      - name: Preserve aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-full-matrix-${{ github.run_attempt }}
          path: .freedom/reports/runtime-full-matrix.json
          if-no-files-found: warn
  ui-e2e:
    runs-on: ubuntu-24.04
    # Setup + the measured full default pass + five fixture passes + cleanup.
    # This remains a total bound, not the sum of all individual worst-case caps.
    timeout-minutes: 75
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.ui_e2e == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Full-schema migrations and prior-pass schema cleanup share the lock table.
          POSTGRES_INITDB_ARGS: '-c max_locks_per_transaction=256 -c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify browser PostgreSQL lock capacity
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          [[ "$POSTGRES_SERVICE_ID" =~ ^[a-f0-9]{64}$ ]]
          settings=$(docker exec "$POSTGRES_SERVICE_ID" psql -U freedom_local -d fp_foundation_ci -v ON_ERROR_STOP=1 -tA -c "SELECT json_build_object('database',current_database(),'server_version_num',current_setting('server_version_num'),'max_locks_per_transaction',setting,'pending_restart',pending_restart,'dynamic_shared_memory_type',current_setting('dynamic_shared_memory_type'),'fsync',current_setting('fsync'),'full_page_writes',current_setting('full_page_writes')) FROM pg_settings WHERE name='max_locks_per_transaction'")
          python3 - "$settings" <<'PYREADBACK'
          import json,sys
          s=json.loads(sys.argv[1])
          assert s['database']=='fp_foundation_ci'
          assert 180000 <= int(s['server_version_num']) < 190000
          assert int(s['max_locks_per_transaction'])==256 and s['pending_restart'] is False
          assert s['dynamic_shared_memory_type']=='mmap'
          assert s['fsync']=='on' and s['full_page_writes']=='on'
          print(json.dumps(s,sort_keys=True))
          PYREADBACK
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Run the pinned browser plan for the exact integration tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node .freedom/trusted/scripts/ci/run-pinned-e2e.mjs --root . --allow-fetch \
              --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" \
              --candidate "$CANDIDATE_SHA" --pull-request "$PR_NUMBER"
          else
            node .freedom/trusted/scripts/ci/run-pinned-e2e.mjs --root . --event "$EVENT_NAME" --candidate "$CANDIDATE_SHA"
          fi
      - name: Preserve browser evidence and synthetic failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-selection-${{ github.sha }}
          path: |
            .freedom/reports/pinned-e2e.json
            .freedom/reports/pinned-e2e.json.failure-artifacts/
          retention-days: 7
          if-no-files-found: warn
  guild-presentation:
    runs-on: ubuntu-24.04
    # Full candidates already require static-worker for this same immutable
    # candidate. Reuse its typecheck; fixed runtime/browser lanes still protect
    # guild files that are not all in the full runners' deletion baselines.
    timeout-minutes: 25
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.guild_presentation == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Typecheck when the full static lane is not selected
        if: ${{ needs.select.result != 'success' || needs.select.outputs.mode != 'full' || needs.select.outputs.static_worker != 'true' }}
        run: npm run typecheck
      - name: Check registration and build the isolated preview
        run: |
          node scripts/generate-guild-blocks.mjs --check
          node node_modules/vite/bin/vite.js build --config apps/portal-web/guild-preview/vite.config.ts
      - name: Run the fixed guild runtime cases
        env:
          # This job's synthetic PostgreSQL service uses loopback trust only.
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
        run: node .freedom/trusted/scripts/ci/run-guild-runtime.mjs
      - name: Run the fixed guild integration cases
        env:
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
        run: node .freedom/trusted/scripts/ci/run-pinned-e2e.mjs --root . --guild-presentation --output .freedom/reports/guild-integration.json
      - name: Run the unique guild preview cases
        run: node .freedom/trusted/scripts/ci/run-pinned-e2e.mjs --root . --guild-preview --output .freedom/reports/guild-preview.json
      - name: Preserve the guild comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guild-presentation-${{ github.sha }}
          path: |
            .freedom/reports/guild-*.json
            .freedom/reports/guild-*.json.failure-artifacts/
          retention-days: 7
          if-no-files-found: warn
  static-worker:
    permissions:
      contents: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.static_worker == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the pinned worker status guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/worker-status
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require CircleCI worker success for an identical same-repository PR tree
        id: worker-provider
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: node .freedom/worker-status/packages/contribution-tools/circleci-worker-status.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run check:common-contracts
      - run: npm run check:runtime-registration
      - run: npm run check:bootstrap
      - run: npm run check:device-pairing
      - run: npm run check:bootstrap-session
      - run: npm run check:bootstrap-http
      - run: npm run check:model-broker-bridge
      - run: npm run check:model-credential-ingest
      - run: npm run check:member-model-settings
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run typecheck
      - run: npm run build
      - run: npm run worker:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:admin-sync
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:maintainer
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run check:broker-worker-candidate
      - run: npm run worker:dry-run:broker
      - run: npm run worker:dry-run:media-operator
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.worker-unit
        if: steps.worker-provider.outputs.run_github == 'true'
        env:
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - run: npm run test:media-restore
      - run: npm run test:media-restore -- --archive-only
  governance-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.governance_consumers == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r docs/platform-plan/contracts/tests/requirements-static.txt
      - run: npm run contracts:build
      - run: node scripts/checkout-repositories.mjs
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.skill-client-unit
      # This integration launches every synthetic baseline file in the fixed
      # runtime runner. Keep it required, outside the 60-second unit adapter.
      - name: Verify complete runtime selection union
        run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.runtime-union-integration
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.pinned-pytest-integration
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.consumer-repositories
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
          FREEDOM_CONSUMER_SOURCE_COMMIT: 91b943ac61e132fbbce72ea066cb2301aa065600
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.contracts-pytest
      # Source identity/SQL/link checks belong to the always-required
      # source-integrity job; main also archives and restores the complete tree.
  # Selected preflight must succeed for verify. Enforcing this revision through
  # an installed workflow pin still requires its reviewed ruleset upgrade.
  deploy-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.deploy_preflight == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.deploy-preflight
      - name: Fetch the immutable isolated migration database image
        run: docker pull mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
      - name: Verify both migration entrypoints against isolated PostgreSQL
        run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.migration-postgres
