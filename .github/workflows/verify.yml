name: Verify local milestone
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
# Candidate CI is diagnostic; it cannot publish the operator's App-bound gate.
# Only superseded PR runs are cancelled; queued merge candidates run independently.
# verify always runs. source-integrity always runs inventory, the canonical preview
# rebuild and diff, runtime-text drift, and the governance/publisher unit tests.
# A pull request skips all heavy jobs only when the pinned selector proves a
# docs-only change. Fixed frontend leaf profiles retain every runtime, browser
# and static job, skipping only unrelated consumer/deployment checks. Unknown
# paths or descriptor/owner/dependency drift retain full selection.
# The exact generated manifest
# docs/platform-plan/verification/2026-09-20-file-inventory.json may accompany
# qualifying edits and is not itself allowlisted. No other docs/platform-plan path is exempt.
# Push, merge queue, rename, delete, unknown, governance, security, and
# shared-runtime changes keep the full set.
# The selector, the verify aggregate, the runtime partition runner, the runtime aggregate and every node:test, pytest and browser suite runner come from job.workflow_sha, checked out at .freedom/trusted.
# The pinned runner derives each file set from the candidate tree and requires complete per-file and per-case evidence.
# Candidate package scripts, globs and runner files do not define a required test suite.
# The build, typecheck, dry-run and check scripts stay candidate-defined.
# Candidate code still executes on the same runner, so this is not a sandbox against a hostile candidate.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      reason: ${{ steps.decision.outputs.reason }}
      runtime_full: ${{ steps.decision.outputs.runtime_full }}
      runtime_aggregate: ${{ steps.decision.outputs.runtime_aggregate }}
      ui_e2e: ${{ steps.decision.outputs.ui_e2e }}
      static_worker: ${{ steps.decision.outputs.static_worker }}
      governance_consumers: ${{ steps.decision.outputs.governance_consumers }}
      deploy_preflight: ${{ steps.decision.outputs.deploy_preflight }}
    steps:
      - name: Checkout the pinned selector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-selector
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the candidate tree for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test the pinned selector
        run: node --test --test-concurrency=1 trusted-selector/scripts/ci/select-affected-jobs.test.mjs
      - name: Select affected jobs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node trusted-selector/scripts/ci/select-affected-jobs.mjs \
            --allow-fetch \
            --event "$EVENT_NAME" \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pull-request "$PR_NUMBER" \
            --github-output "$GITHUB_OUTPUT"
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install fixed host manifest validator dependency
        run: python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple jsonschema==4.26.0
      - run: npm ci
      - run: npm run contracts:build
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run check:runtime-text
      - run: npm run verify:inventory
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.selector-unit
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.governance-unit
  # This required check always runs. source-integrity must succeed. A selected
  # job must succeed. An unselected heavy job may be skipped or may succeed.
  # Failure, cancellation, and a skip of a selected job do not pass.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [select, source-integrity, runtime-full, runtime-aggregate, ui-e2e, static-worker, governance-consumers, deploy-preflight]
    if: ${{ always() }}
    steps:
      - name: Checkout the pinned aggregate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-selector
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require integrity and every selected job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node trusted-selector/scripts/ci/select-affected-jobs.mjs --check-aggregate
  runtime-full:
    name: runtime-full (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.runtime_full == 'true') }}
    # Independent runners and PostgreSQL services: six partitions, each one
    # serial test process. Measured weights balance the partitions, and each
    # keeps its own 900-second budget. Selection and aggregation stay dynamic.
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Ephemeral test cluster: retain fsync/full_page_writes, avoid paced
          # checkpoints blocking fixture DROP DATABASE behind a disk backlog.
          POSTGRES_INITDB_ARGS: '-c checkpoint_completion_target=0 -c max_locks_per_transaction=256 -c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --memory 4g
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify disposable PostgreSQL storage and checkpoint settings
        run: bash scripts/ci/verify-runtime-postgres.sh '${{ job.services.postgres.id }}'
      - name: Record actual runner CPU capacity
        run: |
          nproc
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            cat /sys/fs/cgroup/cpu.max
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us
          elif [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us ]; then
            cat /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us
          else
            echo 'cpu_quota_not_exposed; nproc_only_readback'
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Retain the former sequential job's generated/browser build prerequisites.
      - run: npm run contracts:build
      - run: npm run build
      - name: Install and verify native CLI isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap gcc apparmor apparmor-profiles
          # Verify the exact stock profile and render only the reviewed deleted-inode
          # mediation flag; retain AppArmor/userns restrictions and prove isolation.
          bash scripts/ci/verify-native-cli-prerequisites.sh
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Complete this runtime partition in its owned database
        run: |
          node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.runtime-sharding-integration
          node .freedom/trusted/scripts/runtime-full.mjs --partition-count 6 --partition-index ${{ matrix.partition }} --output .freedom/reports/runtime-partition-${{ matrix.partition }}.json
        env:
          # This job's synthetic PostgreSQL service uses loopback trust only.
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - name: Preserve complete or failed runtime partition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-partition-${{ matrix.partition }}
          path: .freedom/reports/runtime-partition-${{ matrix.partition }}.json
          if-no-files-found: warn
  runtime-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [select, runtime-full]
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.runtime_aggregate == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - name: Download only this run's six partition artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-partition-*
          path: .freedom/reports/runtime-partitions
          merge-multiple: true
      - name: Require exact complete union, per-partition deadlines and one run window
        run: node .freedom/trusted/scripts/runtime-aggregate.mjs --partition-count 6 --input-dir .freedom/reports/runtime-partitions --output .freedom/reports/runtime-full-matrix.json
      - name: Preserve aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-full-matrix
          path: .freedom/reports/runtime-full-matrix.json
          if-no-files-found: warn
  ui-e2e:
    runs-on: ubuntu-24.04
    # Setup + the measured full default pass + both fixture passes + cleanup.
    # This remains a total bound, not the sum of all individual worst-case caps.
    timeout-minutes: 50
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.ui_e2e == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-e2e.mjs --root .
  static-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.static_worker == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run check:common-contracts
      - run: npm run check:runtime-registration
      - run: npm run check:bootstrap
      - run: npm run check:device-pairing
      - run: npm run check:bootstrap-session
      - run: npm run check:bootstrap-http
      - run: npm run check:model-broker-bridge
      - run: npm run check:model-credential-ingest
      - run: npm run check:member-model-settings
      - run: git diff --exit-code -- contracts/preview/v1 packages/sdk
      - run: npm run typecheck
      - run: npm run build
      - run: npm run worker:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:admin-sync
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run worker:dry-run:maintainer
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run check:broker-worker-candidate
      - run: npm run worker:dry-run:broker
      - run: npm run worker:dry-run:media-operator
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.worker-unit
        env:
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - run: npm run test:media-restore
      - run: npm run test:media-restore -- --archive-only
  governance-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.governance_consumers == 'true') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
          # Disposable runner-only synthetic DB: low-privilege fixture LOGIN roles
          # have no passwords. Never use this authentication mode outside CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: '-c dynamic_shared_memory_type=mmap'
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same immutable PR integration / merge-group candidate in every job.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r docs/platform-plan/contracts/tests/requirements-static.txt
      - run: npm run contracts:build
      - run: node scripts/checkout-repositories.mjs
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
      # The merged consumers retain these exact reviewed library bytes. Fetch
      # their source object even when the candidate checkout is shallow.
      - name: Fetch the immutable adopted library source
        run: git fetch --no-tags --depth=1 origin 91b943ac61e132fbbce72ea066cb2301aa065600
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.skill-client-unit
      # This integration launches every synthetic baseline file in the fixed
      # runtime runner. Keep it required, outside the 60-second unit adapter.
      - name: Verify complete runtime selection union
        run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.runtime-union-integration
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.governance-unit
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.pinned-pytest-integration
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.consumer-repositories
        env:
          FREEDOM_REPOSITORIES_ROOT: ${{ runner.temp }}/freedom-consumers
          FREEDOM_CONSUMER_SOURCE_COMMIT: 91b943ac61e132fbbce72ea066cb2301aa065600
          TEST_DATABASE_URL: postgresql://freedom_local@127.0.0.1:5432/fp_foundation_ci
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.contracts-pytest
      - run: npm run verify:inventory
  # Selected preflight must succeed for verify. Enforcing this revision through
  # an installed workflow pin still requires its reviewed ruleset upgrade.
  deploy-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.deploy_preflight == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Checkout the pinned runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .freedom/trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm the pinned runner checkout
        env:
          PINNED_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .freedom/trusted rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C .freedom/trusted status --porcelain)"
      - run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.deploy-preflight
      - name: Fetch the immutable isolated migration database image
        run: docker pull mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
      - name: Verify both migration entrypoints against isolated PostgreSQL
        run: node .freedom/trusted/scripts/ci/run-pinned-suite.mjs --root . --suite ci.migration-postgres
