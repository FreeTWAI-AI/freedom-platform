name: Trusted consumer source
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  consumer-library-source:
    # This central workflow is installed as a native required workflow for the
    # nine approved consumers. It is not the central platform verification job.
    if: ${{ github.repository != 'FreeTWAI-AI/freedom-platform' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The reviewed host owns per-repository source/profile tuples. Installation
    # still follows publication and hosted positive/negative probes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FreeTWAI-AI/freedom-platform
          ref: ${{ job.workflow_sha }}
          path: trusted-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !contains(fromJSON('["FreeTWAI-AI/freedom-agent-kit","FreeTWAI-AI/freedom-storefront","FreeTWAI-AI/freedom-supplier-client"]'), github.repository) }}
        with:
          python-version: '3.13'
      - name: Install fixed host manifest validator dependency
        if: ${{ !contains(fromJSON('["FreeTWAI-AI/freedom-agent-kit","FreeTWAI-AI/freedom-storefront","FreeTWAI-AI/freedom-supplier-client"]'), github.repository) }}
        run: python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple jsonschema==4.26.0
      # No npm install/build/test/import from the candidate. Native workflow
      # conclusion proves source integrity only; runtime adoption is NOT_CHECKED.
      - name: Verify immutable candidate source against approved baseline and library SHA
        env:
          FREEDOM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FREEDOM_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          FREEDOM_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: node "$GITHUB_WORKSPACE/trusted-source/packages/contribution-tools/github-consumer-host.mjs" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/trusted-source"
