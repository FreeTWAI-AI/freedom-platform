name: Directory runtime profile tests
on:
  pull_request:
    paths:
      - 'packages/contribution-tools/**'
      - 'tests/integration/directory-*.test.mjs'
      - '.github/workflows/directory-runtime-profile.yml'
      - '.github/workflows/trusted-consumer-runtime.yml'
      - 'repositories.lock.json'
  push:
    branches: [main]
    paths:
      - 'packages/contribution-tools/**'
      - 'tests/integration/directory-*.test.mjs'
      - '.github/workflows/directory-runtime-profile.yml'
      - '.github/workflows/trusted-consumer-runtime.yml'
      - 'repositories.lock.json'
permissions:
  contents: read
jobs:
  directory-runtime-profile:
    # Candidate diagnostic, not an installed consumer gate or release authority.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FreeTWAI-AI/FreeTWAI-AI.github.io
          ref: 01b18397f9c5356a14e4cc66fa46f57216f11154
          path: directory
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          check-latest: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install fixed source manifest dependency
        run: python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple jsonschema==4.26.0
      - name: Install host-only HTML parser and test semantic profile
        working-directory: source
        run: |
          empty_npm_config=$(mktemp)
          npm ci --prefix packages/contribution-tools/directory-html-host --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org --userconfig /dev/null --globalconfig "$empty_npm_config"
          rm "$empty_npm_config"
          node --test tests/integration/directory-html-semantics.test.mjs
      - name: Prepare and verify fixed runtime
        working-directory: source
        run: |
          node packages/contribution-tools/consumer-runtime-recipe.mjs prepare
          node packages/contribution-tools/consumer-runtime-recipe.mjs verify-hosted
      - name: Test actual builds and source-valid counterexamples
        working-directory: source
        env:
          FREEDOM_RUN_DIRECTORY_RUNTIME: '1'
          FREEDOM_DIRECTORY_ROOT: ${{ github.workspace }}/directory
          FREEDOM_CONSUMER_SOURCE_ROOT: ${{ github.workspace }}/source
          FREEDOM_CONSUMER_WORKFLOW_SHA: ${{ github.sha }}
        run: node --test --test-concurrency=1 tests/integration/directory-runtime.test.mjs
