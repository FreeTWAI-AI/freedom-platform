# FAKE PLANNING FIXTURE ONLY. This models an adopted public fork owned by a
# contributor's personal GitHub account. It is always community_fork/not-official.
schema_version: freedom.project/v1
kind: Project
project_id: project:fake-community-fork
slug: fake-community-fork
name: Fake Community Fork
summary: Example of a separately published community fork with a personal owner and immutable upstream lineage.
project_type: application
lifecycle: incubating

description:
  problem: Demonstrate the external-owner fork contract without inventing a GitHub organization team.
  audiences:
    - community contributors
  capabilities:
    - publish a fork-branded project introduction page
  limitations:
    - is not an official Freedom release
    - is not governed by Freedom organization rulesets

ownership:
  ownership_mode: external_owner
  accountable_team: null
  external_owner:
    type: User
    account_id: "987654321"
    login: example-contributor
    html_url: https://github.com/example-contributor
  accountable_party_ref: user:fake-community-maintainer
  module_stewardship_ref: null
  vertical: community-projects
  maintainer_teams: []
  maintainer_accounts:
    - type: User
      account_id: "987654321"
      login: example-contributor
      html_url: https://github.com/example-contributor
  security_contact: https://github.com/example-contributor/freedom-platform-fork/security

repository:
  full_name: example-contributor/freedom-platform-fork
  html_url: https://github.com/example-contributor/freedom-platform-fork
  repository_id: "987654322"
  default_branch: main
  visibility: public
  is_fork: true
  upstream:
    project_id: project:freedom-platform
    full_name: freedom-example/freedom-platform
    html_url: https://github.com/freedom-example/freedom-platform
    based_on_commit: "1111111111111111111111111111111111111111"
  creation_method: github_fork
  source_lineage:
    - relation: github_fork_parent
      source_project_id: project:freedom-platform
      source_repository_id: "123456789"
      full_name: freedom-example/freedom-platform
      html_url: https://github.com/freedom-example/freedom-platform
      based_on_commit: "1111111111111111111111111111111111111111"
      license_spdx_expression: Apache-2.0
      license_notice_preserved: true

modules:
  module:community-distribution:
    path: src
    owner_type: external_account
    owner_team: null
    owner_account:
      type: User
      account_id: "987654321"
      login: example-contributor
      html_url: https://github.com/example-contributor

page:
  publication: github_pages
  requested_trust_label: community_fork
  source: generated
  canonical_platform_url: https://freedom.example/projects/fake-community-fork
  github_pages_url: https://example-contributor.github.io/freedom-platform-fork/
  exception_reason: null
  required_sections:
    - identity_and_status
    - problem_and_audience
    - capabilities_and_limitations
    - links
    - release
    - ownership_and_security
    - license_and_data_boundary
    - fork_lineage
    - build_provenance
    - canonical_platform_link

fork_policy:
  mode: allowed
  allowed_purposes:
    - contribution
    - distribution
  allow_private_forks: false
  new_independent_project_method: template
  official_status_inherited: false
  fork_badge: "Community fork — not an official Freedom release"

release:
  policy: freedom.semver-immutable/v1
  tag_format: vMAJOR.MINOR.PATCH[-PRERELEASE]
  source_branch: main
  immutable: true
  page_from: published_release

toolchain:
  profile: freedom.static-project-page/v1
  runtime_version_file: .tool-versions
  package_manager: pnpm
  lockfile: pnpm-lock.yaml
  commands_source: trusted_build_profile

licensing:
  spdx_expression: Apache-2.0
  license_file: LICENSE
  source_distribution: open_source
  commercial_terms_url: null

deployment:
  runtime: static_github_pages
  environments:
    preview:
      provider: actions_artifact
      trigger: pull_request
      url: null
      requires_human_approval: false
      external_fork_policy: artifact_only
      external_fork_preview_exception: trusted_manual_two_stage_static_only
    staging:
      provider: none
      trigger: none
      url: null
      requires_human_approval: false
    production:
      provider: github_pages
      trigger: published_release
      url: https://example-contributor.github.io/freedom-platform-fork/
      requires_human_approval: true
  database_migration_strategy: none

data_boundary:
  classification: public
  platform_record_types: []
  customer_data_mode: none
  credential_reference_metadata_in_postgres: false
  dynamic_credential_storage:
    - none
  credential_root_key_storage: none
  stores_payment_instrument_data: false
  stores_plaintext_credentials: false
  external_systems_of_record:
    - github

quality:
  required_checks:
    - manifest/schema
    - manifest/github-consistency
    - test
    - page/build
    - security
    - release-policy
  minimum_human_reviews: 1
  production_human_approval: true
  sensitive_paths:
    - freedom.project.yaml
    - .github/**
    - SECURITY.md
    - LICENSE
    - site/assets/brand/**

links:
  documentation: null
  demo: null
  support: null
  issues: https://github.com/example-contributor/freedom-platform-fork/issues
