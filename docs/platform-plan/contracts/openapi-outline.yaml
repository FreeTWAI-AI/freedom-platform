        target_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 500}
        coordinator_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
    ServiceEngagementSummary:
      type: object
      additionalProperties: false
      required: [engagement_id, customer_party_ref, provider_party_ref, engagement_types, state, current_sow_state, current_allocation_state, aggregate_version]
      properties:
        engagement_id: {$ref: "#/components/schemas/OpaqueId"}
        customer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        provider_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        squad_ref: {$ref: "#/components/schemas/OpaqueId"}
        engagement_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [funded_testing, funded_review, funded_development, implementation, customization, deployment, managed_service, support]}
        state: {enum: [draft, proposed, squad_forming, active, milestone_review, support_period, completed, cancelled]}
        current_sow_state: {enum: [not_created, draft, collecting_signatures, signed, superseded, withdrawn]}
        current_allocation_state: {enum: [not_created, draft, collecting_acceptances, signed, superseded, withdrawn]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    CreateSowVersionRequest:
      type: object
      additionalProperties: false
      required: [title, scope, exclusions, deliverables, milestones, support_terms, change_rule, required_signer_parties]
