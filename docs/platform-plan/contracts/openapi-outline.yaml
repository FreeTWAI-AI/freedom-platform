              deliverable_id: {$ref: "#/components/schemas/OpaqueId"}
              description: {type: string, minLength: 1, maxLength: 5000}
              acceptance_criteria:
                type: array
                minItems: 1
                maxItems: 100
                items: {type: string, minLength: 1, maxLength: 2000}
        milestones:
          type: array
