        - serviceOAuth: [activities.encounter.write]
          activitySessionProof: []
  /webhooks/{provider}/{routeKey}:
    servers:
      - url: https://hooks.freedom.example/api/v1
        description: Dedicated webhook-ingress Worker; this path is never served by platform-api
    post:
      tags: [Integrations]
      operationId: captureProviderWebhook
      description: >-
        Provider-specific ingress. The server resolves routeKey to candidate Connection/community/key versions,
        verifies the signature over the exact raw bytes before parsing, durably deduplicates the delivery,
        and never trusts community or owner fields from the payload.
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        - name: routeKey
          in: path
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
      requestBody:
        required: true
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "202":
          description: Raw delivery verified and durably captured for asynchronous normalization
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookAccepted"}
        "400": {description: "Malformed provider headers, timestamp or delivery identity"}
        "401": {description: Invalid signature or route/tenant/key mismatch; body not processed}
        "413": {description: Raw request exceeded the connector's configured maximum}
      security:
        - webhookSignature: []
  /public/projects/{projectId}/release-status:
    get:
      tags: [Quality]
      operationId: getPublicProjectReleaseStatus
      x-owner: platform-trust
      x-runtime-owner: platform-api
      description: >-
        Canonical public, credential-free live-status query for the generated GitHub
        Pages widget. The path and query form one exact subject: project ID, stable
        GitHub repository ID, immutable release tag and commit SHA. The server derives
        all trust roots, attestation location and approved Pages origin from protected
        registries; no manifest/widget-supplied endpoint, key or repository name is
        trusted. Every request rechecks cache-disabled canonical status/currentness.
        Only a 200 body with status=official and a current proof may render Official.
        Any other body/status, parse error, timeout or network failure is Unverified.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: repository_id
          in: query
          required: true
          schema: {$ref: "#/components/schemas/GitHubRepositoryId"}
        - name: release_tag
          in: query
          required: true
          schema: {$ref: "#/components/schemas/OfficialReleaseTag"}
        - name: commit_sha
          in: query
          required: true
          schema: {$ref: "#/components/schemas/GitCommitSha"}
        - name: Origin
          in: header
          required: false
          description: >-
            Optional browser origin. An exact protected-registry match for this
            project's canonical Pages origin is echoed in Access-Control-Allow-Origin;
            absent/unapproved origins still receive the public body but no browser CORS grant.
          schema: {type: string, format: uri}
      responses:
        "200":
          description: Exact current canonical decision; unverified is a successful fail-closed lookup, never a stale official fallback
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
            Vary:
              schema: {type: string, const: Origin}
            Access-Control-Allow-Origin:
              description: Present only as the exact approved canonical Pages origin for this project; wildcard and credentials are forbidden.
              schema: {type: string, format: uri}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProjectReleaseStatus"}
        "400":
          description: Malformed or noncanonical exact-subject parameter; widget remains Unverified
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Pragma: {schema: {type: string, const: no-cache}}
            Vary: {schema: {type: string, const: Origin}}
            Access-Control-Allow-Origin:
              description: Present only as the exact approved canonical Pages origin for this project.
              schema: {type: string, format: uri}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404":
          description: Exact project/repository/release subject is unknown; widget remains Unverified
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Pragma: {schema: {type: string, const: no-cache}}
            Vary: {schema: {type: string, const: Origin}}
            Access-Control-Allow-Origin:
              description: Present only as the exact approved canonical Pages origin for this project.
              schema: {type: string, format: uri}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "503":
          description: Canonical status/currentness registry cannot be verified; no cached official body may be served and widget remains Unverified
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Pragma: {schema: {type: string, const: no-cache}}
            Vary: {schema: {type: string, const: Origin}}
            Access-Control-Allow-Origin:
              description: Present only as the exact approved canonical Pages origin for this project.
              schema: {type: string, format: uri}
            Retry-After: {schema: {type: integer, minimum: 1, maximum: 300}}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      security: []
  /internal/jobs:claim:
    post:
      tags: [Integrations]
      operationId: claimInternalJob
      description: >-
        Claims only a GeneralProviderJobType. The server verifies the immutable
        job_registry_version and computes eligible types as the intersection of
        the request, the authenticated OAuth client's server-side allowlist and
        the canonical registry. The authenticated client, requested executor_group,
        registry mapping and source queue must all identify the same integration,
        growth or media executor group. requested_job_id, queue_delivery_id and the
        one-time/current opaque queue_delivery_handle bind the claim to one DB-backed
        dispatcher delivery and one canonical row; this endpoint
        never performs an unbounded/group-drain claim. A requested type outside that
        intersection is forbidden; release-status job types cannot be represented.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobClaimRequest"}
      responses:
        "200":
          description: General/provider job lease, monotonic fencing token and immutable input references returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobLease"}
        "204": {description: Exact authenticated delivery points to a terminal or superseded job and may be acknowledged; this never means an arbitrary group scan found no job}
        "400": {description: "Claim body is not schema-valid, including a job type/source Queue structurally incompatible with executor_group"}
        "403": {description: "Queue delivery handle, OAuth client, executor group, source queue or requested general/provider type is invalid/not allowlisted, or caller attempted to access another job family; no job row is mutated"}
        "409": {description: job_registry_version is not active or the exact requested job cannot currently be leased; consumer retries and does not treat this as an arbitrary no-work response}
      security:
        - serviceOAuth: [jobs.claim]
  /internal/jobs/{jobId}:begin-provider-operation:
    post:
      tags: [Integrations]
      operationId: beginInternalJobProviderOperation
      description: >-
        Canonical leased-to-running fence. In one DB transaction the server verifies the current lease/fencing token,
        verifies the stable provider_operation_key returned by claim, and persists running before any provider
        capability can be issued. A running lease expiry enters result_unknown, never queued. Before reading or
        mutating the lease, the server verifies that canonical job family is general/provider and that the OAuth
        client remains allowlisted for its GeneralProviderJobType; a release-status job ID is always forbidden.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobBeginProviderOperationRequest"}
      responses:
        "200":
          description: Provider operation fence durably entered; worker may now exchange a credential and call the provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobProviderOperationStarted"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the general/provider job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [jobs.execute]
  /internal/jobs/{jobId}:complete:
    post:
      tags: [Integrations]
      operationId: completeInternalJob
      description: >-
        Completes only a canonical general/provider job for a client still present
        in that exact GeneralProviderJobType allowlist. A release-status job ID is
        rejected before lease or result mutation.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobCompleteRequest"}
      responses:
        "200":
          description: Output, usage and provider references committed once for the current running lease and fencing token; leased jobs must first complete the atomic begin-provider-operation transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobCompletion"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the general/provider job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [jobs.complete]
  /internal/jobs/{jobId}:heartbeat:
    post:
      tags: [Integrations]
      operationId: heartbeatInternalJob
      description: >-
        Extends only a canonical general/provider lease whose exact type remains
        allowlisted for the authenticated OAuth client; release-status jobs are forbidden.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobHeartbeatRequest"}
      responses:
        "200":
          description: Current lease extended for the matching fencing token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobHeartbeat"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the general/provider job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [jobs.complete]
  /internal/jobs/{jobId}:fail:
    post:
      tags: [Integrations]
      operationId: failInternalJobAttempt
      description: >-
        Records failure only for a canonical general/provider job whose exact type
        remains allowlisted for the authenticated OAuth client; release-status jobs are forbidden.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobFailRequest"}
      responses:
        "200":
          description: Attempt failure, retry classification and checkpoint accepted; needs_input maps to manual_unknown only when no unreconciled external side effect exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobFailureAccepted"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the general/provider job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [jobs.complete]
  /internal/release-status-jobs:claim:
    post:
      tags: [Integrations]
      operationId: claimReleaseStatusJob
      description: >-
        Dedicated claim surface for release-status-worker. The server verifies the
        immutable job_registry_version and computes eligible types as the intersection
        of the request, the authenticated OAuth client's server-side release-status
        allowlist and the canonical registry. GeneralProviderJobType values cannot be
        represented by this schema. requested_job_id, queue_delivery_id and the
        one-time/current opaque queue_delivery_handle bind the claim to the exact
        DB-backed dispatcher delivery and canonical status row; no
        group scan, provider connection, operation or credential material is permitted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseStatusJobClaimRequest"}
      responses:
        "200":
          description: Release-status lease, monotonic fencing token and immutable verification references returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseStatusJobLease"}
        "204": {description: Exact authenticated delivery points to a terminal or superseded release-status job and may be acknowledged; this never means a queue scan found no job}
        "400": {description: "Claim body is not schema-valid, including any general/provider job type or non-release-status source Queue"}
        "403": {description: "Queue delivery handle is invalid, OAuth client is not the dedicated release-status worker, or exact type/queue is not allowlisted; no status job row is mutated"}
        "409": {description: job_registry_version is not active or the exact requested status job cannot currently be leased; consumer retries}
      security:
        - serviceOAuth: [release-status-jobs.claim]
  /internal/release-status-jobs/{jobId}:begin-verification:
    post:
      tags: [Integrations]
      operationId: beginReleaseStatusJobVerification
      description: >-
        Atomically fences a release-status lease into verifying after rechecking the
        dedicated OAuth client, canonical release-status job family/type and current
        lease. It neither begins a provider operation nor authorizes Credential Broker use.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
      responses:
        "200":
          description: Verification fence durably entered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseStatusVerificationStarted"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the release-status job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [release-status-jobs.execute]
  /internal/release-status-jobs/{jobId}:heartbeat:
    post:
      tags: [Integrations]
      operationId: heartbeatReleaseStatusJob
      description: Extends only a current release-status lease for the dedicated allowlisted worker.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseStatusJobHeartbeatRequest"}
      responses:
        "200":
          description: Current release-status lease extended for the matching fencing token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseStatusJobHeartbeat"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the release-status job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [release-status-jobs.execute]
  /internal/release-status-jobs/{jobId}:complete:
    post:
      tags: [Integrations]
      operationId: completeReleaseStatusJob
      description: >-
        Commits the exact verified official-status decision and immutable evidence
        references once for the current verifying lease. The attested_official outcome
        requires a signed attestation reference; all other decisions forbid one.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseStatusJobCompleteRequest"}
      responses:
        "200":
          description: Release-status decision committed once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseStatusJobCompletion"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the release-status job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [release-status-jobs.execute]
  /internal/release-status-jobs/{jobId}:fail:
    post:
      tags: [Integrations]
      operationId: failReleaseStatusJobAttempt
      description: >-
        Records a release verification failure without provider operation fields.
        Retry is accepted only after canonical status/signing effects are proven absent
        or reconciled under the same immutable status intent.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseStatusJobFailRequest"}
      responses:
        "200":
          description: Release-status attempt failure and retry/manual-review classification accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseStatusJobFailureAccepted"}
        "403": {description: OAuth client or canonical job family/type is not authorized for the release-status job surface}
        "409": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - serviceOAuth: [release-status-jobs.execute]
  /internal/connections/{connectionId}:handoff-owner:
    post:
      tags: [Integrations]
      operationId: handoffSharedConnectionOwner
      description: >-
        Audited owner handoff for a Connection explicitly marked shared. The server
        verifies the current owner, recipient scope and expected version, emits an
        immutable audit record, and never returns or rotates the underlying secret.
        User-owned non-shared Connections must be revoked during deactivation instead.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SharedConnectionOwnerHandoffRequest"}
      responses:
        "200":
          description: Shared Connection ownership changed and audited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SharedConnectionOwnerHandoff"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
      security:
        - serviceOAuth: [connections.owner-handoff]
  /work-items/{workItemId}/participation-terms:
    get:
      tags:
      - Work
      operationId: getWorkParticipationTerms
      description: Read current immutable terms snapshot under normal WorkItem visibility. Redact private party and
        capacity refs from public/unauthorized views; public users receive existing redacted feed, not this full snapshot.
      parameters:
      - &id001
        $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Current terms snapshot for an authorized participant/publisher
          content:
            application/json:
              schema:
                $ref: ./work-participation.schema.json#/$defs/ParticipationTermsSnapshot
        '404':
          description: No declared terms or no visible item
      security:
      - userSession: []
    put:
      tags:
      - Work
      operationId: reviseWorkParticipationTerms
      description: Publisher or scoped owner creates a new immutable revision using current WorkItem If-Match, server
        digest and idempotency. Server verifies real beneficiary, capacity consent/reservation, rights and funding;
        schema validity alone is not authority. Revisions affect new claims only. Does not open work, sign A4, commence
        funded work, allocate money or rewrite existing commitments. Agent drafting uses existing draft-artifact path,
        not this confirmation endpoint.
      parameters: &id002
      - *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./work-participation.schema.json#/$defs/ParticipationTerms
      responses:
        '201':
          description: New immutable terms revision; old claims retain their pinned version
          content:
            application/json:
              schema:
                $ref: ./work-participation.schema.json#/$defs/ParticipationTermsSnapshot
        '401': &id003
          description: Authenticated user required
        '403': &id004
          description: Current ownership, participant relation or scope is missing; agent tokens cannot confirm first-person
            benefits
        '409': &id005
          $ref: '#/components/responses/StateConflict'
        '412': &id006
          $ref: '#/components/responses/VersionConflict'
        '422': &id007
          $ref: '#/components/responses/ValidationFailed'
      security: &id008
      - userSession: []
        csrfHeader: []
  /work-items/{workItemId}/benefit-observations:
    post:
      tags:
      - Work
      operationId: recordWorkBenefitObservation
      description: Optional first-person report by actual beneficiary/contributor or authorized organization
        representative; server derives reporter and validates work/claim relation. Agent tokens, external chat
        and arbitrary reporter IDs are rejected. Idempotent replay returns original; revision requires the latest
        own observation supersedes ref checked atomically for that reporter/role/claim lineage, plus current
        WorkItem If-Match; stale lineage returns 409. Append-only report updates only benefit read models, never
        acceptance, QC, ContributionRecord, rank, entitlement, payable or payment facts. No response remains
        unknown; details private by default.
      parameters:
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./work-participation.schema.json#/$defs/BenefitObservationRequest
      responses:
        '201':
          description: First-person observation recorded; not an independently verified success or payment receipt
          content:
            application/json:
              schema:
                $ref: ./work-participation.schema.json#/$defs/BenefitObservationReceipt
        '401':
          description: Authenticated user required
        '403':
          description: Current ownership, participant relation or scope is missing; agent tokens cannot confirm
            first-person benefits
        '409':
          $ref: '#/components/responses/StateConflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - userSession: []
        csrfHeader: []

components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-freedom_session
      description: Secure HttpOnly platform browser session; state changes also require CSRF header.
    guestRun:
      type: http
      scheme: bearer
      bearerFormat: purpose-scoped-assessment-run-token
    guestSession:
      type: apiKey
      in: cookie
      name: __Host-freedom_guest
      description: Purpose-limited guest bootstrap identity for guest-capable assessment or activity intents; used with csrfHeader and never derived from IP or fingerprint.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        CSRF proof only, never standalone authentication. When listed beside a cookie
        scheme in one Security Requirement Object, the server binds it to that session
        and also verifies Origin. A request carrying both guest and user identity
        credentials is rejected rather than selecting one implicitly.
    storefrontPurposeToken:
      type: http
      scheme: bearer
      bearerFormat: signed-storefront-purpose-token
      description: >-
        Short-lived signed bearer with an exact checkout or order_view purpose, store,
        target resource, allowed origin, immutable OfferVersion/SellerListingRevision/
        DistributionAcceptance set, expiry and nonce.
        It is never a general platform session or permission to alter server pricing.
    serviceOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.freedom.example/oauth/token
          scopes:
            integrations.write: Send scoped integration commands
            intake.drafts.create: Create only a server-owner-derived SubmissionDraft from a verified LINE or Discord Inbox receipt
            jobs.claim: Claim only server-allowlisted general/provider work with a lease; never release-status work
            jobs.execute: Atomically fence only an allowlisted general/provider job as running before an external provider operation
            jobs.complete: Heartbeat, complete or fail only an allowlisted general/provider job
            release-status-jobs.claim: Dedicated release-status-worker claim of server-allowlisted release-status work; never general/provider work
            release-status-jobs.execute: Dedicated release-status-worker begin, heartbeat, complete or fail operations; grants no provider credential access
            orders.create: Create canonical orders from a trusted Storefront backend
            coaching.write: Apply a bound coaching action from a verified integration
            community.attendance.write: Record bound attendance through Community Events
            activities.exchange: Exchange a one-time Portal code for an activity-scoped Lounge session
            activities.participation.write: Apply an actor-bound Lounge participation action
            activities.encounter.write: Apply an actor-bound Lounge encounter report or decline
            activities.round.write: Complete a server-timed activity round
            refunds.resolve: Record an evidence-backed exceptional refund outcome
            connections.owner-handoff: Transfer one shared Connection owner with an immutable audit record
            actions.execute: Execute an already-authorized system-mandate ActionIntent with its current immutable authorization basis
            agent.context.read: Read a principal-authorized WorkContextBundle
            agent.work.execute: Start AgentRuns and create ActionIntents within a current ExecutionGrant
    agentExecutionToken:
      type: http
      scheme: bearer
      bearerFormat: purpose-scoped-agent-execution-token
      description: >-
        Short-lived token bound to community, human or organization principal,
        agent connection, acting profession membership, ExecutionGrant and allowed
        resource/action scopes. It never grants A4 signing authority.
    agentConnectionToken:
      type: http
      scheme: bearer
      bearerFormat: registered-agent-connection-token
      description: >-
        Short-lived token obtained from approved device/browser authorization. It binds
        the principal and AgentConnection and carries only agent.bootstrap.read for the
        principal's minimized status/feed. It may mint an execution token only for an active
        ExecutionGrant bound to that connection. It carries no acting profession, A1–A3
        domain action authority or A4 signing power.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Planning alias only; each connector contract replaces this with the provider's exact signature/timestamp headers and raw-body algorithm.
    activitySessionProof:
      type: apiKey
      in: header
      name: X-Activity-Session
      description: Opaque activity-scoped proof returned only to the Lounge backend; structured logging must redact this header.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 256}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    ActionIntentId:
      name: actionIntentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    RoundId:
      name: roundId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    PublicStoreId:
      name: publicId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    StorefrontIntentId:
      name: intentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/OpaqueId"}
    PublicOrderNumber:
      name: publicNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 6
        maxLength: 100
    PublicStoreClientId:
      name: X-Store-Client
      in: header
      required: true
      description: Public deployment identifier used for routing, origin and rate controls; not an authentication credential.
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    OpaqueId:
      type: string
      minLength: 4
      maxLength: 100
    AggregateVersion:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Monotonic DB bigint constrained to a JSON safe integer on the wire; If-Match carries its quoted ETag representation.
    StableKey:
      type: string
      pattern: "^[a-z][a-z0-9_.-]{1,99}$"
    Enforcement:
      enum: [navigation, action_gate]
    NavigationStatus:
      type: object
      additionalProperties: false
      required: [state, enforcement]
      properties:
        state: {enum: [not_started, ready, in_progress, satisfied, skipped, stuck, unavailable, missing, unknown, not_applicable]}
        enforcement: {type: string, const: navigation}
        reason_code: {$ref: "#/components/schemas/StableKey"}
      description: A navigation status never blocks the member, lowers discoverability or revokes authority.
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [state, enforcement]
      properties:
        state: {enum: [satisfied, missing, in_progress, not_applicable, unknown]}
        enforcement: {$ref: "#/components/schemas/Enforcement"}
        reason_code: {$ref: "#/components/schemas/StableKey"}
    PlaybookEntityKind:
      enum: [guild, profession_starter, coaching_program, seller_store, skill_package]
    PlaybookItem:
      type: object
      additionalProperties: false
      required: [item_id, title, enforcement, resolver_ref, missing_work_item_template_key]
      properties:
        item_id: {$ref: "#/components/schemas/StableKey"}
        title: {type: string, minLength: 1, maxLength: 200}
        enforcement: {$ref: "#/components/schemas/Enforcement"}
        gate_class: {enum: [engineering_safety, money_integrity, product_version_qc, a4_exact_artifact_signature]}
        target_action: {$ref: "#/components/schemas/StableKey"}
        resolver_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        missing_work_item_template_key: {$ref: "#/components/schemas/StableKey"}
        skippable: {type: boolean}
        alternative_evidence_allowed: {type: boolean}
      allOf:
        - if:
            properties:
              enforcement: {const: action_gate}
            required: [enforcement]
          then:
            required: [gate_class, target_action]
          else:
            not:
              anyOf:
                - {required: [gate_class]}
                - {required: [target_action]}
      description: action_gate items require one of the four allowlisted gate classes; navigation is the default and cannot carry gate fields.
    EntityPlaybookVersion:
      type: object
      additionalProperties: false
      required: [playbook_id, entity_kind, version, hash, lifecycle, items]
      properties:
        playbook_id: {$ref: "#/components/schemas/StableKey"}
        entity_kind: {$ref: "#/components/schemas/PlaybookEntityKind"}
        version: {type: string, minLength: 1, maxLength: 50}
        hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        lifecycle: {enum: [draft, published, retired]}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/PlaybookItem"}
    EntityReadinessItem:
      type: object
      additionalProperties: false
      required: [item_id, readiness]
      properties:
        item_id: {$ref: "#/components/schemas/StableKey"}
        readiness: {$ref: "#/components/schemas/ReadinessStatus"}
        evidence_refs:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        materialized_work_item_ref: {$ref: "#/components/schemas/OpaqueId"}
    EntityReadinessProjection:
      type: object
      additionalProperties: false
      required: [projection_id, entity_kind, entity_ref, playbook_ref, overall_readiness, items, calculated_at, aggregate_version]
      properties:
        projection_id: {$ref: "#/components/schemas/OpaqueId"}
        entity_kind: {$ref: "#/components/schemas/PlaybookEntityKind"}
        entity_ref: {$ref: "#/components/schemas/OpaqueId"}
        playbook_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        overall_readiness: {$ref: "#/components/schemas/NavigationStatus"}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/EntityReadinessItem"}
        calculated_at: {type: string, format: date-time}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    MaterializedReadinessWorkItem:
      type: object
      additionalProperties: false
      required: [work_item_id, entity_ref, playbook_ref, item_id, enforcement]
      properties:
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        entity_ref: {$ref: "#/components/schemas/OpaqueId"}
        playbook_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        item_id: {$ref: "#/components/schemas/StableKey"}
        enforcement: {type: string, const: navigation}
    CreateGuildRequest:
      type: object
      additionalProperties: false
      required: [profession_key, name, purpose, playbook_key, expected_catalog_version]
      properties:
        profession_key: {$ref: "#/components/schemas/StableKey"}
        name: {type: string, minLength: 1, maxLength: 160}
        purpose: {type: string, minLength: 1, maxLength: 1000}
        playbook_key: {$ref: "#/components/schemas/StableKey"}
        expected_catalog_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: The five required properties are the complete client-supplied create set. Server-generated identity/lifecycle/version and the resolved pinned playbook complete the aggregate; guild.launch-readiness slots are navigation-only and never create guards.
    UpdateGuildRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        purpose: {type: string, minLength: 1, maxLength: 1000}
        public_entry_point: {type: string, format: uri}
        training_route_ref: {$ref: "#/components/schemas/OpaqueId"}
        playbook_key: {$ref: "#/components/schemas/StableKey"}
    ChangeGuildStateRequest:
      type: object
      additionalProperties: false
      required: [target_state, reason]
      properties:
        target_state: {enum: [draft, active, degraded, archived]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    GuildSummary:
      type: object
      additionalProperties: false
      required: [guild_id, profession_key, name, purpose, lifecycle, readiness, aggregate_version]
      properties:
        guild_id: {$ref: "#/components/schemas/OpaqueId"}
        profession_key: {$ref: "#/components/schemas/StableKey"}
        name: {type: string, minLength: 1, maxLength: 160}
        purpose: {type: string, minLength: 1, maxLength: 1000}
        lifecycle: {enum: [draft, active, degraded, archived]}
        public_entry_point: {type: string, format: uri}
        new_profession_line_work_item_template_key: {$ref: "#/components/schemas/StableKey"}
        readiness: {$ref: "#/components/schemas/NavigationStatus"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    CreateMyProfessionMembershipRequest:
      type: object
      additionalProperties: false
      required: [profession_key, expected_current_membership_version]
      properties:
        profession_key: {$ref: "#/components/schemas/StableKey"}
        expected_current_membership_version:
          allOf:
            - {$ref: "#/components/schemas/AggregateVersion"}
          description: Zero means the member expects no current membership for this stable profession key.
        source_recommendation_ref: {$ref: "#/components/schemas/OpaqueId"}
    ProfessionMembershipSummary:
      type: object
      additionalProperties: false
      required: [membership_id, profession_key, guild_id, rank, state, aggregate_version, starter_track_ref]
      properties:
        membership_id: {$ref: "#/components/schemas/OpaqueId"}
        profession_key: {$ref: "#/components/schemas/StableKey"}
        guild_id: {$ref: "#/components/schemas/OpaqueId"}
        rank: {type: string, const: runner}
        state: {enum: [runner, strategist_review, strategist, master_review, master, left]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        starter_track_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
      description: Creation and self-confirmation always enter runner; no pending or Master-approval state exists.
    XpTrack:
      type: string
      enum: [training, maintenance, real_delivery]
    XpTrackRule:
      type: object
      additionalProperties: false
      required: [track, formula, eligible_contribution_kinds, dedupe_key]
      properties:
        track: {$ref: "#/components/schemas/XpTrack"}
        formula: {type: string, minLength: 1, maxLength: 1000}
        eligible_contribution_kinds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/StableKey"}
        dedupe_key: {type: string, const: canonical_contribution_record_id}
    XpPolicyVersion:
      type: object
      additionalProperties: false
      required: [policy_id, profession_key, policy_version, status, effective_from, formula_language, source_contract, tracks, rebuild_contract]
      properties:
        policy_id: {$ref: "#/components/schemas/OpaqueId"}
        profession_key: {$ref: "#/components/schemas/StableKey"}
        policy_version: {type: integer, minimum: 1}
        status: {enum: [draft, active, retired]}
        effective_from: {type: string, format: date-time}
        formula_language: {type: string, const: human_readable_deterministic_v1}
        source_contract:
          type: object
          additionalProperties: false
          required: [facts, review_filter]
          properties:
            facts:
              type: array
              const: [append_only_contribution_record, review_outcome]
            review_filter: {const: accepted_and_not_retracted}
        tracks:
          type: array
          minItems: 3
          maxItems: 3
          x-uniqueBy: [track]
          items: {$ref: "#/components/schemas/XpTrackRule"}
        rebuild_contract:
          type: object
          additionalProperties: false
          required: [full_delete_and_rebuild_allowed, cross_profession_total_forbidden, authorization_input_forbidden]
          properties:
            full_delete_and_rebuild_allowed: {const: true}
            cross_profession_total_forbidden: {const: true}
            authorization_input_forbidden:
              type: array
              const: [entitlement_snapshot, rank_decision, reviewer_appointment, a4_signature]
      description: >-
        Exactly one active version per profession. Formulas consume only append-only
        ContributionRecords whose current review outcome is accepted and not retracted.
    MemberProfessionXpProjection:
      type: object
      additionalProperties: false
      required: [member_ref, profession_key, track, xp, policy_version, rebuilt_from_event_seq, rebuilt_at]
      properties:
        member_ref: {$ref: "#/components/schemas/OpaqueId"}
        profession_key: {$ref: "#/components/schemas/StableKey"}
        track: {$ref: "#/components/schemas/XpTrack"}
        xp: {type: integer, minimum: 0}
        policy_version: {type: integer, minimum: 1}
        rebuilt_from_event_seq: {type: integer, minimum: 0, maximum: 9007199254740991}
        rebuilt_at: {type: string, format: date-time}
      description: Rebuildable member-by-profession-by-track row; never an authorization or rank input.
    MemberXpProjectionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/MemberProfessionXpProjection"}
      description: No total field exists; clients must not aggregate across professions.
    EquippedSkillSelection:
      type: object
      additionalProperties: false
      required: [acting_profession_key, skill_version_ref]
      properties:
        acting_profession_key: {$ref: "#/components/schemas/StableKey"}
        skill_version_ref: {$ref: "#/components/schemas/OpaqueId"}
    ReplaceMyEquippedSkillsRequest:
      type: object
      additionalProperties: false
      required: [selections, expected_current_revision]
      properties:
        selections:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/EquippedSkillSelection"}
        expected_current_revision: {$ref: "#/components/schemas/AggregateVersion"}
      description: SkillVersion refs are selected from typed catalog or onboarding responses and are never hand-entered opaque text.
    EquippedSkillsSummary:
      type: object
      additionalProperties: false
      required: [equip_set_id, selections, resolved_skills, revision]
      properties:
        equip_set_id: {$ref: "#/components/schemas/OpaqueId"}
        selections:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/EquippedSkillSelection"}
        resolved_skills:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/EquippedSkillRef"}
        revision: {$ref: "#/components/schemas/AggregateVersion"}
    OnboardingExpectedVersions:
      type: object
      additionalProperties: false
      required: [profession_membership, work_intent, equipped_skills]
      properties:
        profession_membership: {$ref: "#/components/schemas/AggregateVersion"}
        work_intent: {$ref: "#/components/schemas/AggregateVersion"}
        equipped_skills: {$ref: "#/components/schemas/AggregateVersion"}
    ConfirmMyOnboardingBundleRequest:
      type: object
      additionalProperties: false
      required: [profession_key, starter_route, availability, desired_work_types, expected_versions, acknowledgement]
      properties:
        profession_key: {$ref: "#/components/schemas/StableKey"}
        starter_route: {enum: [recommended_package, coaching, decide_later]}
        starter_package_key:
          $ref: "#/components/schemas/StableKey"
          description: Optional stable public catalog key; server selects the pinned recommended version. Never an opaque database ID.
        availability: {enum: [available, limited, unavailable]}
        desired_work_types:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/StableKey"}
        one_line_goal: {type: string, minLength: 1, maxLength: 300}
        expected_versions: {$ref: "#/components/schemas/OnboardingExpectedVersions"}
        acknowledgement: {type: string, const: confirm_my_profession_work_intent_and_optional_starter_equip}
      description: Positioning is intentionally absent as a prerequisite; self-declared profession confirmation is equally valid.
    OnboardingBundleSummary:
      type: object
      additionalProperties: false
      required: [profession_membership, work_intent, equipped_skills, onboarding_journey, starter_track]
      properties:
        profession_membership: {$ref: "#/components/schemas/ProfessionMembershipSummary"}
        work_intent: {$ref: "#/components/schemas/WorkIntentSummary"}
        equipped_skills: {$ref: "#/components/schemas/EquippedSkillsSummary"}
        onboarding_journey: {$ref: "#/components/schemas/OnboardingJourney"}
        starter_track: {$ref: "#/components/schemas/ProfessionStarterProgress"}
      description: One idempotent transaction returns every opaque ref needed by later calls; partial commits are forbidden.
    OnboardingJourneyStep:
      type: object
      additionalProperties: false
      required: [step_id, kind, enforcement, skippable, status]
      properties:
        step_id: {$ref: "#/components/schemas/StableKey"}
        kind: {enum: [identity, positioning, profession_confirmation, route_choice, skill_equip, installation_verify, welcome_ritual, first_work_item]}
        enforcement: {type: string, const: navigation}
        skippable: {type: boolean}
        status: {$ref: "#/components/schemas/NavigationStatus"}
        output_refs:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
    OnboardingJourney:
      type: object
      additionalProperties: false
      required: [journey_id, definition_ref, overall_readiness, steps, aggregate_version]
      properties:
        journey_id: {$ref: "#/components/schemas/OpaqueId"}
        definition_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        overall_readiness: {$ref: "#/components/schemas/NavigationStatus"}
        steps:
          type: array
          minItems: 8
          items: {$ref: "#/components/schemas/OnboardingJourneyStep"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    AnswerWelcomePromptRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: {enum: [answered, skipped]}
        one_line_goal: {type: string, minLength: 1, maxLength: 300}
      allOf:
        - if:
            properties:
              outcome: {const: answered}
            required: [outcome]
          then:
            required: [one_line_goal]
          else:
            not:
              required: [one_line_goal]
    StarterProgressItem:
      type: object
      additionalProperties: false
      required: [item_id, enforcement, status, skippable, alternative_evidence_allowed]
      properties:
        item_id: {$ref: "#/components/schemas/StableKey"}
        enforcement: {type: string, const: navigation}
        status: {$ref: "#/components/schemas/NavigationStatus"}
        skippable: {type: boolean}
        alternative_evidence_allowed: {type: boolean}
        evidence_refs:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        work_item_ref: {$ref: "#/components/schemas/OpaqueId"}
    ProfessionStarterProgress:
      type: object
      additionalProperties: false
      required: [membership_id, starter_track_ref, overall_readiness, items, aggregate_version]
      properties:
        membership_id: {$ref: "#/components/schemas/OpaqueId"}
        starter_track_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        overall_readiness: {$ref: "#/components/schemas/NavigationStatus"}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/StarterProgressItem"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: No completion percentage or score exists and progress never controls admission, rank or discoverability.
    ReportStarterItemRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: {enum: [satisfied, skipped, stuck, alternative_evidence]}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        note: {type: string, minLength: 1, maxLength: 1000}
      allOf:
        - if:
            properties:
              outcome: {enum: [satisfied, alternative_evidence]}
            required: [outcome]
          then:
            required: [evidence_refs]
    StartMemberSkillInstallationRequest:
      type: object
      additionalProperties: false
      required: [agent_connection_ref, package_version_ref]
      properties:
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        package_version_ref: {$ref: "#/components/schemas/OpaqueId"}
      description: Both refs are obtained from authenticated typed responses; clients must present selectors and never ask a member to paste them.
    MemberInstallationReceipt:
      type: object
      additionalProperties: false
      required: [validator_version, package_digest, platform_profile, checked_at, outcome, enforcement]
      properties:
        validator_version: {type: string, minLength: 1, maxLength: 50}
        package_digest: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        platform_profile: {$ref: "#/components/schemas/StableKey"}
        checked_at: {type: string, format: date-time}
        outcome: {enum: [pass, fail, degraded]}
        enforcement: {type: string, const: navigation}
        report_ref: {$ref: "#/components/schemas/OpaqueId"}
    MemberInstallationStatus:
      type: object
      additionalProperties: false
      required: [state, enforcement]
      properties:
        state: {enum: [recommended, equipped, installing, verified, failed, degraded, outdated, removed]}
        enforcement: {type: string, const: navigation}
        reason_code: {$ref: "#/components/schemas/StableKey"}
    MemberSkillInstallation:
      type: object
      additionalProperties: false
      required: [installation_id, member_ref, agent_connection_ref, package_version_ref, status, aggregate_version]
      properties:
        installation_id: {$ref: "#/components/schemas/OpaqueId"}
        member_ref: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        package_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        status: {$ref: "#/components/schemas/MemberInstallationStatus"}
        latest_receipt: {$ref: "#/components/schemas/MemberInstallationReceipt"}
        remediation_work_item_ref: {$ref: "#/components/schemas/OpaqueId"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Distinct from PackageVersion capability_readiness, equipped selection and AgentRun provenance.
    VerifyMemberSkillInstallationRequest:
      type: object
      additionalProperties: false
      required: [receipt, expected_package_version_ref]
      properties:
        receipt: {$ref: "#/components/schemas/MemberInstallationReceipt"}
        expected_package_version_ref: {$ref: "#/components/schemas/OpaqueId"}
    CreateDayOneExecutionGrantRequest:
      type: object
      additionalProperties: false
      required: [template_key, agent_connection_ref, onboarding_journey_ref, requested_duration_hours, acknowledgement, expected_journey_version]
      properties:
        template_key: {type: string, const: day1.learn-equip-and-claim}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        onboarding_journey_ref: {$ref: "#/components/schemas/OpaqueId"}
        requested_duration_hours: {type: integer, minimum: 1, maximum: 72}
        expected_journey_version: {$ref: "#/components/schemas/AggregateVersion"}
        acknowledgement: {type: string, const: authorize_reversible_day_one_a0_a1_a2_actions_only}
      description: Server resolves the exact membership, starter package and first low-risk WorkItem from the journey; the request cannot widen scope or authorize A3/A4.
    ProfessionMembershipRef:
      type: object
      additionalProperties: false
      required: [membership_id, profession_id, rank]
      properties:
        membership_id: {$ref: "#/components/schemas/OpaqueId"}
        profession_id: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        guild_id: {$ref: "#/components/schemas/OpaqueId"}
        rank: {enum: [runner, strategist, master]}
        office_assignment_refs:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
      description: Rank describes evidence-backed capability; office assignments separately convey scoped responsibility.
    EquippedSkillRef:
      type: object
      additionalProperties: false
      required: [skill_package_id, skill_version_id, source_commit, manifest_hash]
      properties:
        skill_package_id: {$ref: "#/components/schemas/OpaqueId"}
        skill_version_id: {$ref: "#/components/schemas/OpaqueId"}
        source_commit: {type: string, pattern: "^[a-fA-F0-9]{40}$"}
        manifest_hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
    WorkIntentSummary:
      type: object
      additionalProperties: false
      required: [work_intent_id, profession_membership_refs, availability, desired_work_types, revision]
      properties:
        work_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        profession_membership_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        availability: {enum: [available, limited, unavailable]}
        desired_work_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        revision: {$ref: "#/components/schemas/AggregateVersion"}
    BeginAgentDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [client_name, client_instance_id, client_instance_proof_challenge, requested_connection_scopes]
      properties:
        client_name: {type: string, minLength: 1, maxLength: 120}
        client_version: {type: string, minLength: 1, maxLength: 80}
        client_instance_id: {type: string, minLength: 16, maxLength: 200}
        client_instance_proof_challenge: {type: string, minLength: 43, maxLength: 128}
        requested_connection_scopes:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items: {type: string, const: agent.bootstrap.read}
    AgentDeviceAuthorization:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, verification_uri_complete, polling_interval_seconds, expires_at]
      properties:
        device_code: {type: string, minLength: 32, maxLength: 512}
        user_code: {type: string, minLength: 6, maxLength: 32}
        verification_uri: {type: string, format: uri}
        verification_uri_complete: {type: string, format: uri}
        polling_interval_seconds: {type: integer, minimum: 3, maximum: 60}
        expires_at: {type: string, format: date-time}
    ApproveAgentDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [principal_type, authorization_request_sha256, acknowledgement]
      properties:
        principal_type: {enum: [user, organization]}
        organization_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Required only when principal_type is organization and the signer may represent it.
        authorization_request_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: register_this_displayed_agent_connection_without_A4_authority}
      allOf:
        - if:
            properties:
              principal_type: {const: organization}
            required: [principal_type]
          then:
            required: [organization_ref]
          else:
            not:
              required: [organization_ref]
    ExchangeAgentDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [device_code, client_instance_id, client_instance_proof_verifier]
      properties:
        device_code: {type: string, minLength: 32, maxLength: 512}
        client_instance_id: {type: string, minLength: 16, maxLength: 200}
        client_instance_proof_verifier: {type: string, minLength: 43, maxLength: 128}
    RefreshAgentConnectionTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token, client_instance_id, client_instance_proof, proof_jti]
      properties:
        refresh_token: {type: string, minLength: 32, maxLength: 8192}
        client_instance_id: {type: string, minLength: 16, maxLength: 200}
        client_instance_proof:
          type: string
          minLength: 64
          maxLength: 8192
          description: Sender-constrained proof bound to this endpoint, HTTP method, proof_jti, issuance time and the registered client-instance key.
        proof_jti: {type: string, minLength: 16, maxLength: 512}
      description: Proof jti is single-use and short-lived under a replay cache; the exact sender-constraining profile is fixed in the 1A contract-freeze security contract.
    AgentConnectionSummary:
      type: object
      additionalProperties: false
      required: [agent_connection_id, principal_ref, client_name, client_instance_id, connection_scopes, state, created_at, aggregate_version]
      properties:
        agent_connection_id: {$ref: "#/components/schemas/OpaqueId"}
        principal_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        client_name: {type: string, minLength: 1, maxLength: 120}
        client_instance_id: {type: string, minLength: 16, maxLength: 200}
        connection_scopes:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items: {type: string, const: agent.bootstrap.read}
        state: {enum: [active, revoked, expired]}
        created_at: {type: string, format: date-time}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    AgentConnectionToken:
      type: object
      additionalProperties: false
      required: [agent_connection_id, access_token, token_type, expires_in, refresh_token, scope]
      properties:
        agent_connection_id: {$ref: "#/components/schemas/OpaqueId"}
        access_token: {type: string, minLength: 32, maxLength: 8192}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 60, maximum: 3600}
        refresh_token: {type: string, minLength: 32, maxLength: 8192}
        scope: {type: string, minLength: 1, maxLength: 300}
      description: access_token uses the agentConnectionToken scheme; the refresh credential is rotation-bound to the client-instance proof and must be stored in an OS credential vault.
    ConfirmMyWorkIntentRequest:
      type: object
      additionalProperties: false
      required: [profession_membership_refs, availability, desired_work_types, expected_current_revision]
      properties:
        profession_membership_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        availability: {enum: [available, limited, unavailable]}
        desired_work_types:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        focus_summary: {type: string, minLength: 1, maxLength: 1000}
        availability_note: {type: string, minLength: 1, maxLength: 500}
        expected_current_revision:
          allOf:
            - {$ref: "#/components/schemas/AggregateVersion"}
          description: Use zero when no prior WorkIntent revision exists.
    CreateExecutionGrantRequest:
      type: object
      additionalProperties: false
      required: [agent_connection_ref, acting_profession_membership_ref, authorization_level, action_types, resource_scopes, starts_at, expires_at]
      properties:
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        authorization_level: {enum: [A0, A1, A2, A3]}
        action_types:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        resource_scopes:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
        channel_refs:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
        max_action_count: {type: integer, minimum: 1, maximum: 100000}
        content_policy_ref:
          $ref: "#/components/schemas/ImmutableRuleRef"
          description: Exact template, locked-fact and prohibited-claim policy for A3 public/channel actions.
        cost_cap: {$ref: "#/components/schemas/NonNegativeMoney"}
        automatic_start: {type: boolean, default: false}
        starts_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              authorization_level: {const: A3}
            required: [authorization_level]
          then:
            required: [channel_refs, max_action_count, content_policy_ref]
      description: A3 structurally requires non-empty channel_refs, max_action_count and an immutable content policy; A4 is structurally impossible here.
    MintAgentExecutionTokenRequest:
      type: object
      additionalProperties: false
      required: [agent_connection_ref, requested_expires_at, expected_grant_version]
      properties:
        agent_connection_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Must equal both the connection-token audience and the AgentConnection bound to the grant.
        requested_expires_at: {type: string, format: date-time}
        expected_grant_version: {$ref: "#/components/schemas/AggregateVersion"}
    AgentExecutionTokenIssued:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, agent_connection_ref, execution_grant_ref, grant_bound_snapshot_ref, acting_profession_membership_ref, authorization_level, action_types, resource_scopes]
      properties:
        access_token: {type: string, minLength: 32, maxLength: 8192}
        token_type: {const: Bearer}
        expires_at: {type: string, format: date-time}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        execution_grant_ref: {$ref: "#/components/schemas/OpaqueId"}
        grant_bound_snapshot_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Immutable server-side snapshot of channel, count, cost, resource and time bounds used for every token-authenticated request.
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        authorization_level: {enum: [A0, A1, A2, A3]}
        action_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        resource_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
      description: The access token is audience-bound and not self-authoritative. Every request resolves grant_bound_snapshot_ref, rechecks the current grant state/time and atomically consumes applicable count/cost capacity; A3 channel and content policy are never inferred from client claims.
    ExecutionGrantSummary:
      type: object
      additionalProperties: false
      required: [grant_id, agent_connection_ref, acting_profession_membership_ref, authorization_level, action_types, resource_scopes, starts_at, expires_at, state]
      dependentRequired:
        max_action_count: [remaining_action_count]
        remaining_action_count: [max_action_count]
        cost_cap: [cost_consumed]
        cost_consumed: [cost_cap]
      x-invariants:
        - {rule: integer_lte, left: remaining_action_count, right: max_action_count}
        - {rule: money_lte_same_currency, left: cost_consumed, right: cost_cap}
      properties:
        grant_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        authorization_level: {enum: [A0, A1, A2, A3]}
        action_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        resource_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
        channel_refs:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
        max_action_count: {type: integer, minimum: 1, maximum: 100000}
        remaining_action_count: {type: integer, minimum: 0, maximum: 100000}
        content_policy_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        cost_cap: {$ref: "#/components/schemas/NonNegativeMoney"}
        cost_consumed: {$ref: "#/components/schemas/NonNegativeMoney"}
        starts_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        state: {enum: [active, revoked, expired, exhausted, superseded]}
      allOf:
        - if:
            properties:
              authorization_level: {const: A3}
            required: [authorization_level]
          then:
            required: [channel_refs, max_action_count, remaining_action_count, content_policy_ref]
      description: A3 persists non-empty channel refs, total and remaining count bounds, and its immutable content policy. Count fields and cost fields are pair-present; CI and the server enforce remaining_action_count <= max_action_count plus equal currency and cost_consumed.amount_minor <= cost_cap.amount_minor. A4 is deliberately absent because exact consequential actions require a fresh human signature.
    WorkFeedItem:
      type: object
      additionalProperties: false
      required:
      - work_item_id
      - title
      - work_type
      - state
      - why_matched
      - acting_profession_ref
      - skill_version_refs
      - domain_skill_runtime_mode
      - expected_effort
      - expected_gain
      - acceptance_criteria
      - evidence_required
      - review_and_signature_requirement
      - authorization_level
      - execution_mode
      - terms_status
      - review_capacity_navigation
      properties:
        work_item_id:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          minLength: 1
          maxLength: 300
        work_type:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{1,99}$
        state:
          enum:
          - open
          - active
        why_matched:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 500
        acting_profession_ref:
          $ref: '#/components/schemas/OpaqueId'
        skill_version_refs:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OpaqueId'
          description: Domain SkillVersion refs used for matching and provenance. Runtime is not implied by the
            refs alone; it requires the separately gated signed_isolated_overlay_v1 path.
        domain_skill_runtime_mode:
          type: string
          enum:
          - eligibility_and_provenance_only_v1
          - signed_isolated_overlay_v1
          default: eligibility_and_provenance_only_v1
          description: Server-enforced minimum runtime path. Eligibility-only is the fail-closed default; signed
            isolated overlay requires the BLD-05 signed artifact, exact runtime QC, current revocation and publisher
            authority, exact roots-set equality and supported per-run isolation.
        expected_effort:
          type: string
          minLength: 1
          maxLength: 200
        expected_gain:
          type: string
          minLength: 1
          maxLength: 500
        acceptance_criteria:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 1000
        evidence_required:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 300
        review_and_signature_requirement:
          $ref: '#/components/schemas/ReviewAndSignatureRequirement'
        authorization_level:
          enum:
          - A0
          - A1
          - A2
          - A3
          - A4
        execution_mode:
          enum:
          - exclusive
          - collaborative
          - competitive
        deadline:
          type: string
          format: date-time
        terms_status:
          enum:
          - declared
          - legacy_unclassified
        participation_terms_revision:
          type: integer
          minimum: 1
        participation_terms_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        review_capacity_navigation:
          enum:
          - not_required
          - available
          - waiting_reviewer_capacity
        participation_summary:
          type: object
          additionalProperties: false
          required:
          - participation_mode
          - beneficiary_need
          - contributor_gain
          - effort_limit_minutes
          - support_disclosure
          - completion_disclosure
          - reuse_disclosure
          - funding_disclosure
          properties:
            participation_mode:
              enum:
              - voluntary_contribution
              - bounded_mutual_help
              - funded_work
            beneficiary_need:
              type: string
              minLength: 1
              maxLength: 1000
            contributor_gain:
              type: string
              minLength: 1
              maxLength: 1000
            support_disclosure:
              type: string
              minLength: 1
              maxLength: 1000
            completion_disclosure:
              type: string
              minLength: 1
              maxLength: 1000
            reuse_disclosure:
              type: string
              minLength: 1
              maxLength: 1000
            funding_disclosure:
              type: string
              minLength: 1
              maxLength: 1000
            effort_limit_minutes:
              type: integer
              minimum: 1
          description: Server-derived material disclosures from the exact terms revision. No private participant,
            reservation, budget or evidence IDs. Redaction must not conceal material conditions; item is invite-only
            if safe public disclosure is impossible. Full scoped terms are available via the authorized terms endpoint
            before claim.
      allOf:
      - if:
          required:
          - terms_status
          properties:
            terms_status:
              const: declared
        then:
          required:
          - participation_terms_revision
          - participation_terms_sha256
          - participation_summary
    ReviewAndSignatureRequirement:
      type: object
      additionalProperties: false
      required: [review, signature]
      properties:
        review: {enum: [none, peer, independent_human, scoped_delegate, module_steward, release_authority]}
        signature: {enum: [none, A4_exact_artifact]}
        reason: {type: string, minLength: 1, maxLength: 500}
    MemberSupportFeedCard:
      type: object
      additionalProperties: false
      required: [card_id, card_type, member_ref, route, status, enforcement, suggested_action, dismissal_effect, created_at]
      properties:
        card_id: {$ref: "#/components/schemas/OpaqueId"}
        card_type: {enum: [new_runner_joined, starter_installation_verified, member_stuck, member_requested_help]}
        member_ref: {$ref: "#/components/schemas/OpaqueId"}
        profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        onboarding_journey_ref: {$ref: "#/components/schemas/OpaqueId"}
        starter_item_id: {$ref: "#/components/schemas/StableKey"}
        installation_receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        reason_code: {$ref: "#/components/schemas/StableKey"}
        route: {enum: [strategist_or_delegate_pool, master_exception_feed]}
        master_escalation_reason: {enum: [major_version, rule_change, dispute, succession]}
        status: {$ref: "#/components/schemas/NavigationStatus"}
        enforcement: {type: string, const: navigation}
        suggested_action: {type: string, minLength: 1, maxLength: 500}
        dismissal_effect: {type: string, const: none_for_member}
        created_at: {type: string, format: date-time}
      description: Notification and offer of help only; no response or dismissal can block or penalize the member.
    DailyWorkFeed:
      type: object
      additionalProperties: false
      required: [feed_revision_id, generated_at, items]
      properties:
        feed_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        generated_at: {type: string, format: date-time}
        items:
          type: array
          maxItems: 100
          items:
            oneOf:
              - {$ref: "#/components/schemas/WorkFeedItem"}
              - {$ref: "#/components/schemas/MemberSupportFeedCard"}
        next_cursor: {type: string, minLength: 1, maxLength: 1000}
    WorkContextBundle:
      type: object
      additionalProperties: false
      required: [context_id, community_id, principal_ref, confirmed_profession_memberships, equipped_skills, work_direction_basis, available_work_items, execution_grants, resource_refs, generated_at, expires_at]
      properties:
        context_id: {$ref: "#/components/schemas/OpaqueId"}
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        principal_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        confirmed_profession_memberships:
          type: array
          items: {$ref: "#/components/schemas/ProfessionMembershipRef"}
        equipped_skills:
          type: array
          items: {$ref: "#/components/schemas/EquippedSkillRef"}
        work_direction_basis: {$ref: "#/components/schemas/WorkDirectionBasis"}
        available_work_items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/WorkFeedItem"}
        execution_grants:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ExecutionGrantSummary"}
        resource_refs:
          type: array
          maxItems: 200
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 500}
        generated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    WorkDirectionBasis:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, work_intent]
          properties:
            type: {const: member_work_intent}
            work_intent: {$ref: "#/components/schemas/WorkIntentSummary"}
        - type: object
          additionalProperties: false
          required: [type, organization_work_policy_ref, operator_user_ref, acting_profession_membership_refs, authorized_work_types, revision]
          properties:
            type: {const: organization_work_policy}
            organization_work_policy_ref: {$ref: "#/components/schemas/OpaqueId"}
            operator_user_ref: {$ref: "#/components/schemas/OpaqueId"}
            acting_profession_membership_refs:
              type: array
              minItems: 1
              uniqueItems: true
              items: {$ref: "#/components/schemas/OpaqueId"}
            authorized_work_types:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
            revision: {$ref: "#/components/schemas/AggregateVersion"}
      description: Organization-owned agents use an explicit organization policy plus a named human operator's acting ProfessionMembership; they never borrow hidden personal WorkIntent state.
    SubmissionDraftState:
      type: string
      enum: [draft, confirmed, rejected, expired]
    PortalSubmissionDraftSourceInput:
      type: object
      additionalProperties: false
      required: [source_type, client_source_ref, source_revision]
      properties:
        source_type: {const: portal}
        client_source_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Caller-stable non-secret intent identifier used with the Idempotency-Key; it is not an owner or remote URL.
        source_revision: {type: string, minLength: 1, maxLength: 200}
    LineSubmissionDraftSourceInput:
      type: object
      additionalProperties: false
      required: [source_type, normalized_delivery_ref]
      properties:
        source_type: {const: line}
        normalized_delivery_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Exact verified and durably captured LINE Inbox receipt; the server reloads its connection, subject, revision and body digest.
    DiscordSubmissionDraftSourceInput:
      type: object
      additionalProperties: false
      required: [source_type, normalized_delivery_ref]
      properties:
        source_type: {const: discord}
        normalized_delivery_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Exact verified Discord interaction Inbox receipt; the server reloads installation, channel, subject, revision and body digest.
    DocumentSubmissionDraftSourceInput:
      type: object
      additionalProperties: false
      required: [source_type, external_document_ref, source_revision, content_sha256, media_type, size_bytes, access_policy_ref]
      properties:
        source_type: {const: document}
        external_document_ref:
          type: string
          pattern: "^extdoc:[A-Za-z0-9][A-Za-z0-9._~-]{7,239}$"
          description: Opaque owner-controlled locator identifier, never a URL, bearer token, object-store key or reusable download credential.
        source_revision: {type: string, minLength: 1, maxLength: 200}
        content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        media_type: {type: string, minLength: 1, maxLength: 200}
        size_bytes: {type: integer, minimum: 0, maximum: 9007199254740991}
        access_policy_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Registered owner-controlled access policy. The Platform stores no source credential; confirmation checks only whether this policy is already recorded as revoked and does not contact the owner endpoint.
    SubmissionDraftSourceInput:
      oneOf:
        - $ref: "#/components/schemas/PortalSubmissionDraftSourceInput"
        - $ref: "#/components/schemas/LineSubmissionDraftSourceInput"
        - $ref: "#/components/schemas/DiscordSubmissionDraftSourceInput"
        - $ref: "#/components/schemas/DocumentSubmissionDraftSourceInput"
    SubmissionDraftSource:
      type: object
      additionalProperties: false
      required: [source_type, source_ref, source_revision, content_sha256, captured_at, source_custody, normalized_delivery_ref, external_document_ref, media_type, size_bytes, access_policy_ref]
      x-invariants:
        - portal_has_no_delivery_or_external_document_ref_and_uses_platform_consented_content_custody
        - line_or_discord_has_exactly_one_verified_normalized_delivery_ref_and_uses_external_provider_custody
        - document_has_exactly_one_non_URL_external_document_ref_and_access_policy_ref_and_uses_owner_controlled_storage
      properties:
        source_type: {enum: [portal, line, discord, document]}
        source_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Server-created immutable normalized source identity.
        source_revision: {type: string, minLength: 1, maxLength: 200}
        content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        captured_at: {type: string, format: date-time}
        source_custody: {enum: [external_provider, owner_controlled_storage, platform_consented_content]}
        normalized_delivery_ref: {oneOf: [{$ref: "#/components/schemas/OpaqueId"}, {type: "null"}]}
        external_document_ref:
          type: [string, "null"]
          pattern: "^extdoc:[A-Za-z0-9][A-Za-z0-9._~-]{7,239}$"
          description: Opaque non-URL identifier only; null for non-document sources.
        media_type: {type: [string, "null"], maxLength: 200}
        size_bytes: {type: [integer, "null"], minimum: 0, maximum: 9007199254740991}
        access_policy_ref: {oneOf: [{$ref: "#/components/schemas/OpaqueId"}, {type: "null"}]}
    SubmissionWorkItemProposal:
      type: object
      additionalProperties: false
      required:
      - target_kind
      - title
      - objective
      - expected_output
      - execution_mode
      properties:
        target_kind:
          const: work_item
        title:
          type: string
          minLength: 1
          maxLength: 300
        objective:
          type: string
          minLength: 1
          maxLength: 2000
        expected_output:
          type: string
          minLength: 1
          maxLength: 2000
        execution_mode:
          enum:
          - exclusive
          - collaborative
          - competitive
        intended_visibility:
          enum:
          - private
          - community
          - public
        required_profession_refs:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OpaqueId'
        required_skill_version_refs:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OpaqueId'
        participation_terms:
          $ref: ./work-participation.schema.json#/$defs/ParticipationTerms
          description: Optional draft input. Confirmation creates only draft work; real capacity and funding refs are
            verified by owning commands before any promise.
      description: Confirmation creates only a draft WorkItem; intended_visibility cannot open or publish it.
    SubmissionOpportunityStubProposal:
      type: object
      additionalProperties: false
      required: [target_kind, opportunity_kind, next_action, privacy_scope]
      properties:
        target_kind: {const: opportunity_stub}
        opportunity_kind: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        next_action: {type: string, minLength: 1, maxLength: 1000}
        privacy_scope: {const: private}
        external_case_ref:
          type: string
          minLength: 1
          maxLength: 300
          description: Optional non-secret business reference; it must not contain customer text or a reusable URL credential.
      description: Confirmation creates only a private OpportunityStub and does not authorize an Agent to read its external source. The stub may remain metadata-only; if an accepted Opportunity later produces a Project WorkItem that needs the document, that WorkItem must explicitly copy the exact immutable external source requirement before a bound local Agent can verify it.
    SubmissionDraftTargetProposal:
      oneOf:
        - $ref: "#/components/schemas/SubmissionWorkItemProposal"
        - $ref: "#/components/schemas/SubmissionOpportunityStubProposal"
    CreateSubmissionDraftRequest:
      type: object
      additionalProperties: false
      required: [source, proposed_target, redacted_summary, data_classification]
      properties:
        source: {$ref: "#/components/schemas/SubmissionDraftSourceInput"}
        proposed_target: {$ref: "#/components/schemas/SubmissionDraftTargetProposal"}
        redacted_summary:
          type: [string, "null"]
          maxLength: 2000
          description: Optional minimum useful summary after adapter-side redaction; never a provider transcript or full customer document.
        data_classification: {enum: [public, internal, confidential, restricted]}
      description: community and owner are deliberately absent and are derived from the authenticated session, Agent grant or verified provider Inbox binding.
    ConfirmSubmissionDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_aggregate_version, acknowledged_source_ref, acknowledged_source_revision, acknowledged_source_content_sha256, confirmed_target]
      x-invariants:
        - expected_aggregate_version_equals_the_If_Match_ETag_version
        - acknowledged_source_ref_equals_the_saved_immutable_draft_source_ref
        - acknowledged_source_revision_equals_the_saved_immutable_draft_source_revision
        - acknowledged_source_content_sha256_equals_the_saved_immutable_draft_source_digest
        - confirmed_target_target_kind_equals_the_original_proposed_target_kind
        - document_confirmation_does_not_dereference_external_document_ref_or_claim_current_reachability_or_bytes
      properties:
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        acknowledged_source_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Exact saved server-created source identity. For a document it binds the immutable record containing the saved external_document_ref and access_policy_ref; it is not a remote locator.
        acknowledged_source_revision: {type: string, minLength: 1, maxLength: 200}
        acknowledged_source_content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        confirmed_target: {$ref: "#/components/schemas/SubmissionDraftTargetProposal"}
      description: >-
        The server hashes the canonical request for Idempotency-Key comparison, compares the
        acknowledgement tuple byte-for-byte with the saved SubmissionDraft source tuple and
        atomically creates exactly one typed draft/private target. For an external document this
        is owner acknowledgement only: no fetch or byte hashing occurs until a bound local Agent run.
    SubmissionDraftRejectionReason:
      type: string
      enum: [not_actionable, duplicate, wrong_owner, privacy_risk, source_unavailable, other]
    RejectSubmissionDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_aggregate_version, reason_code, redacted_reason]
      x-invariants:
        - expected_aggregate_version_equals_the_If_Match_ETag_version
      properties:
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        reason_code: {$ref: "#/components/schemas/SubmissionDraftRejectionReason"}
        redacted_reason: {type: [string, "null"], maxLength: 500}
    SubmissionDraft:
      type: object
      additionalProperties: false
      required: [submission_draft_id, community_id, owner_principal_ref, source, source_dedupe_key_sha256, proposed_target, redacted_summary, data_classification, privacy_scope, created_by_origin, created_by_ref, state, target_ref, confirmed_payload_sha256, rejection_reason_code, retention_policy_ref, aggregate_version, created_at, expires_at, terminal_at]
      x-invariants:
        - owner_principal_ref_is_server_derived_and_never_copied_from_request_content
        - confirmed_has_exactly_one_non_null_target_ref_and_confirmed_payload_sha256
        - rejected_or_expired_has_null_target_ref_and_confirmed_payload_sha256
        - only_rejected_may_have_a_non_null_rejection_reason_code
        - terminal_at_is_non_null_if_and_only_if_state_is_terminal
        - no_field_contains_raw_LINE_Discord_or_external_client_document_content_or_a_reusable_credential
      properties:
        submission_draft_id: {$ref: "#/components/schemas/OpaqueId"}
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        owner_principal_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        source: {$ref: "#/components/schemas/SubmissionDraftSource"}
        source_dedupe_key_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        proposed_target: {$ref: "#/components/schemas/SubmissionDraftTargetProposal"}
        redacted_summary: {type: [string, "null"], maxLength: 2000}
        data_classification: {enum: [public, internal, confidential, restricted]}
        privacy_scope: {const: owner_private}
        created_by_origin: {enum: [user_session, agent_run, integration_adapter]}
        created_by_ref: {$ref: "#/components/schemas/OpaqueId"}
        state: {$ref: "#/components/schemas/SubmissionDraftState"}
        target_ref: {oneOf: [{$ref: "#/components/schemas/OpaqueId"}, {type: "null"}]}
        confirmed_payload_sha256: {type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$"}
        rejection_reason_code: {oneOf: [{$ref: "#/components/schemas/SubmissionDraftRejectionReason"}, {type: "null"}]}
        retention_policy_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        terminal_at: {type: [string, "null"], format: date-time}
      description: This intake aggregate is separate from a post-claim work_submission and from an immutable non-code DraftArtifact.
    SubmissionDraftPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/SubmissionDraft"}
        next_cursor: {type: [string, "null"], maxLength: 1000}
    ClaimWorkItemRequest:
      type: object
      additionalProperties: false
      required:
      - claimant_type
      - acting_profession_membership_ref
      - expected_aggregate_version
      - terms_status
      properties:
        claimant_type:
          enum:
          - user
          - team
          - squad
        claimant_ref:
          $ref: '#/components/schemas/OpaqueId'
          description: Required for team or Squad; user is always derived from the session.
        acting_profession_membership_ref:
          $ref: '#/components/schemas/OpaqueId'
        expected_aggregate_version:
          $ref: '#/components/schemas/AggregateVersion'
        terms_status:
          enum:
          - declared
          - legacy_unclassified
        participation_terms_revision:
          type: integer
          minimum: 1
        participation_terms_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      allOf:
      - if:
          properties:
            claimant_type:
              enum:
              - team
              - squad
          required:
          - claimant_type
        then:
          required:
          - claimant_ref
        else:
          not:
            required:
            - claimant_ref
      - if:
          required:
          - terms_status
          properties:
            terms_status:
              const: declared
        then:
          required:
          - participation_terms_revision
          - participation_terms_sha256
      description: Server compares viewed terms with current WorkItem and pins snapshot atomically. Client cannot select
        legacy_unclassified for a declared item. Legacy offers imply neither compensation nor guaranteed human support.
    WorkClaim:
      type: object
      additionalProperties: false
      required:
      - claim_id
      - work_item_id
      - claimant_type
      - claimant_ref
      - acting_profession_membership_ref
      - state
      - aggregate_version
      - terms_status
      properties:
        claim_id:
          $ref: '#/components/schemas/OpaqueId'
        work_item_id:
          $ref: '#/components/schemas/OpaqueId'
        claimant_type:
          enum:
          - user
          - team
          - squad
        claimant_ref:
          $ref: '#/components/schemas/OpaqueId'
        acting_profession_membership_ref:
          $ref: '#/components/schemas/OpaqueId'
        state:
          enum:
          - claimed
          - in_progress
          - submitted
          - in_review
          - changes_requested
          - accepted
          - released
          - cancelled
          - expired
        aggregate_version:
          $ref: '#/components/schemas/AggregateVersion'
        terms_status:
          enum:
          - declared
          - legacy_unclassified
        participation_terms_revision:
          type: integer
          minimum: 1
        participation_terms_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      allOf:
      - if:
          required:
          - terms_status
          properties:
            terms_status:
              const: declared
        then:
          required:
          - participation_terms_revision
          - participation_terms_sha256
    ExternalSourceRequirement:
      type: object
      additionalProperties: false
      required: [submission_draft_id, source_ref, external_document_ref, source_revision, expected_content_sha256, access_policy_ref]
      properties:
        submission_draft_id: {$ref: "#/components/schemas/OpaqueId"}
        source_ref: {$ref: "#/components/schemas/OpaqueId"}
        external_document_ref:
          type: string
          pattern: "^extdoc:[A-Za-z0-9][A-Za-z0-9._~-]{7,239}$"
        source_revision: {type: string, minLength: 1, maxLength: 200}
        expected_content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        access_policy_ref: {$ref: "#/components/schemas/OpaqueId"}
      description: Exact immutable owner-controlled document tuple copied from the confirmed SubmissionDraft into a document-requiring draft WorkItem; it contains no source credential or bytes. A confirmed OpportunityStub grants no Agent access, and any later Project WorkItem that needs the document must explicitly copy this exact requirement.
    RecordExternalSourceVerificationRequest:
      type: object
      additionalProperties: false
      required: [task_lease_id, fencing_token, submission_draft_id, source_ref, source_revision, expected_content_sha256, outcome, observed_content_sha256, checked_at]
      x-invariants:
        - task_lease_id_and_fencing_token_equal_the_current_AgentRun_lease
        - submission_draft_id_source_ref_revision_and_expected_digest_equal_one_exact_WorkItem_external_source_requirement
        - verified_requires_observed_content_sha256_equal_to_expected_content_sha256
        - digest_mismatch_requires_a_non_null_observed_content_sha256_different_from_expected_content_sha256
        - source_unavailable_access_denied_or_revision_unavailable_require_null_observed_content_sha256
        - raw_source_bytes_credentials_and_remote_URLs_are_never_sent
      properties:
        task_lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        submission_draft_id: {$ref: "#/components/schemas/OpaqueId"}
        source_ref: {$ref: "#/components/schemas/OpaqueId"}
        source_revision: {type: string, minLength: 1, maxLength: 200}
        expected_content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        outcome: {enum: [verified, source_unavailable, access_denied, revision_unavailable, digest_mismatch]}
        observed_content_sha256: {type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$"}
        checked_at: {type: string, format: date-time}
      description: The bound local Agent fetches the exact external_document_ref and source_revision with owner-side authority, hashes bytes locally and reports only this minimized result. This is an authenticated/fenced Agent assertion and provenance, not independent server attestation of remote bytes.
    ExternalSourceVerificationReceipt:
      type: object
      additionalProperties: false
      required: [verification_receipt_id, agent_run_id, agent_connection_ref, task_lease_id, fencing_token, submission_draft_id, source_ref, source_revision, expected_content_sha256, outcome, observed_content_sha256, checked_at, recorded_at]
      x-invariants:
        - one_receipt_identity_is_idempotent_for_the_exact_AgentRun_source_tuple_and_request_hash
        - a_non_verified_outcome_fails_the_AgentRun_and_allows_zero_consequential_effects
        - a_verified_receipt_is_Agent_provenance_not_independent_remote_byte_attestation_and_does_not_bypass_review_signature_or_A4
        - the_receipt_contains_no_raw_source_bytes_credentials_or_remote_URL
      properties:
        verification_receipt_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        task_lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        submission_draft_id: {$ref: "#/components/schemas/OpaqueId"}
        source_ref: {$ref: "#/components/schemas/OpaqueId"}
        source_revision: {type: string, minLength: 1, maxLength: 200}
        expected_content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        outcome: {enum: [verified, source_unavailable, access_denied, revision_unavailable, digest_mismatch]}
        observed_content_sha256: {type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$"}
        checked_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    CreateAgentRunRequest:
      type: object
      additionalProperties: false
      required: [work_item_id, claim_id, execution_grant_id, context_id, activation]
      properties:
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        claim_id: {$ref: "#/components/schemas/OpaqueId"}
        execution_grant_id: {$ref: "#/components/schemas/OpaqueId"}
        context_id: {$ref: "#/components/schemas/OpaqueId"}
        activation: {$ref: "#/components/schemas/AgentActivationPin"}
      description: >-
        agent_connection_ref is derived from the agentExecutionToken audience and must equal the
        connection bound into the ExecutionGrant. Domain equipped_skill_version_refs are deliberately
        not client input: the server derives the exact set from the immutable WorkItem skill_version_refs,
        requires every item to be currently equipped in the referenced WorkContext and compatible with
        the grant/task, and returns and persists that set. In v1 these domain refs are eligibility and
        provenance metadata only: the launcher does not fetch, materialize, discover or execute their
        package bytes, and a task that truly requires such runtime bytes fails capability_unavailable until
        a future signed domain-Skill activation contract is adopted. The activation tuple separately pins the single
        Freedom control Skill root and its signed dependency closure; it is an expected value, not client
        authority. The server loads and verifies the publisher-resolved signed channel with its local trust
        root, minimum accepted sequence and current revocation state, requires exact equality, then persists
        that result. It never reselects dependency versions from a mutable registry. For a WorkItem created
        from an owner-controlled document SubmissionDraft, the server also derives an exact external source
        requirement. The bound local Agent must fetch that exact ref/revision with owner-side authority and
        hash it locally; SubmissionDraft confirmation itself is not evidence that the source is reachable or
        that its current bytes match.
    AgentActivationPin:
      type: object
      additionalProperties: false
      required: [channel_id, sequence, activation_digest, skill_package_digest, skill_dependency_closure_digest, plan_bundle_digest, contract_bundle_digest]
      properties:
        channel_id:
          type: string
          pattern: "^[a-z][a-z0-9._/-]{1,127}$"
        sequence:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          format: positive-int64-decimal-string
        activation_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: SHA-256 over JCS of the exact channel artifact/statement, active publisher-policy/keyset-chain, signed bootstrap-index artifact/statement and revocation artifact/statement digests, as defined by portable-activation.schema.json; it is not a digest of concatenated payload bytes.
        skill_package_digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        skill_dependency_closure_digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        plan_bundle_digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        contract_bundle_digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
      description: Exact compatible tuple from one signed activation; never accepted solely because a client supplied it.
    AgentRunLease:
      type: object
      additionalProperties: false
      required: [agent_run_id, work_item_id, claim_id, agent_connection_ref, equipped_skill_version_refs, domain_skill_runtime_mode, domain_skill_overlay, external_source_requirements, activation, task_lease_id, fencing_token, state, expires_at]
      properties:
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        claim_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        equipped_skill_version_refs:
          type: array
          uniqueItems: true
          readOnly: true
          items: {$ref: "#/components/schemas/OpaqueId"}
          description: Exact server-derived WorkItem SkillVersion set; it is empty when the immutable WorkItem requires no domain Skill and is never copied from client input. It becomes a runtime loading instruction only with the separately verified signed overlay.
        domain_skill_runtime_mode:
          type: string
          enum: [eligibility_and_provenance_only_v1, signed_isolated_overlay_v1]
          readOnly: true
        domain_skill_overlay:
          readOnly: true
          description: Null in eligibility-only mode. In signed mode this is the exact current BLD-05 artifact selected by the server; the request never supplies it.
          anyOf:
            - type: "null"
            - $ref: './domain-skill-overlay.schema.json#/$defs/signed_overlay_artifact'
        external_source_requirements:
          type: array
          maxItems: 100
          uniqueItems: true
          readOnly: true
          items: {$ref: "#/components/schemas/ExternalSourceRequirement"}
          description: Server-derived exact external document tuples required by the WorkItem; empty when no owner-controlled document is bound. Confirmation is not a verification receipt.
        activation: {$ref: "#/components/schemas/AgentActivationPin"}
        task_lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        state: {enum: [prepared, running, awaiting_human, submitted]}
        expires_at: {type: string, format: date-time, description: TaskLease executor-authority expiry; it appears with fencing_token on this lease object and is never a WorkItem/Claim/Grant/evidence expiry, delivery deadline or evidence validity time.}
      allOf:
        - if:
            properties:
              domain_skill_runtime_mode: {const: eligibility_and_provenance_only_v1}
            required: [domain_skill_runtime_mode]
          then:
            properties:
              domain_skill_overlay: {type: "null"}
        - if:
            properties:
              domain_skill_runtime_mode: {const: signed_isolated_overlay_v1}
            required: [domain_skill_runtime_mode]
          then:
            properties:
              domain_skill_overlay: {$ref: './domain-skill-overlay.schema.json#/$defs/signed_overlay_artifact'}
    AgentRunRecord:
      type: object
      additionalProperties: false
      required: [agent_run_id, work_item_id, claim_id, agent_connection_ref, agent_client_version, execution_grant_id, execution_grant_snapshot_ref, acting_profession_membership_ref, equipped_skill_version_refs, domain_skill_runtime_mode, domain_skill_overlay, external_source_requirements, external_source_verification_receipts, context_id, work_context_bundle_digest, activation, model_ref, tool_contract_version_ref, input_artifact_refs, output_artifact_refs, human_signature_refs, result_refs, started_at, completed_at, state, outcome]
      x-invariants:
        - work_context_bundle_digest_is_server_computed_from_the_exact_canonical_WorkContextBundle_used_to_authorize_the_run
        - execution_grant_snapshot_ref_and_acting_profession_membership_ref_are_server_derived_and_immutable_for_the_run
        - equipped_skill_version_refs_exactly_equal_the_immutable_WorkItem_required_set_and_may_be_empty
        - eligibility_and_provenance_only_v1_requires_domain_skill_overlay_null_and_no_domain_package_is_loaded_or_executed
        - signed_isolated_overlay_v1_requires_a_current_BLD_05_artifact_exact_runtime_QC_revocation_publisher_authority_roots_set_equality_and_supported_isolation
        - any_failed_domain_runtime_gate_returns_capability_unavailable_with_zero_domain_skill_execution_or_consequential_effect
        - every_external_source_requirement_is_server_derived_from_the_immutable_WorkItem_and_may_be_empty
        - every_source_bound_run_has_a_successful_exact_tuple_receipt_before_outputs_or_consequential_ActionIntent_and_known_failure_is_recorded_with_zero_consequential_effects
        - null_scalar_and_empty_array_values_are_stored_explicitly_instead_of_omitting_provenance_fields
      properties:
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        claim_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        agent_client_version:
          type: [string, "null"]
          maxLength: 300
          description: Exact CLI/adapter build when attested by the client protocol; null is stored explicitly when unavailable.
        execution_grant_id: {$ref: "#/components/schemas/OpaqueId"}
        execution_grant_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        equipped_skill_version_refs:
          type: array
          uniqueItems: true
          readOnly: true
          items: {$ref: "#/components/schemas/OpaqueId"}
          description: Exact server-derived WorkItem SkillVersion set after current WorkContext and grant/task checks; empty is valid when none are required. It remains distinct from the signed control-Skill activation root and closure and must exactly equal signed overlay roots when runtime is enabled.
        domain_skill_runtime_mode:
          type: string
          enum: [eligibility_and_provenance_only_v1, signed_isolated_overlay_v1]
          readOnly: true
        domain_skill_overlay:
          readOnly: true
          description: Separate signed domain runtime provenance; null in eligibility-only mode and required in signed mode. It does not alter the existing eight-input control activation digest.
          anyOf:
            - type: "null"
            - $ref: './domain-skill-overlay.schema.json#/$defs/signed_overlay_artifact'
        external_source_requirements:
          type: array
          maxItems: 100
          uniqueItems: true
          readOnly: true
          items: {$ref: "#/components/schemas/ExternalSourceRequirement"}
        external_source_verification_receipts:
          type: array
          maxItems: 100
          uniqueItems: true
          readOnly: true
          items: {$ref: "#/components/schemas/ExternalSourceVerificationReceipt"}
          description: Immutable local verification results. Known failures remain visible even though they produce no output, domain mutation or provider effect.
        context_id: {$ref: "#/components/schemas/OpaqueId"}
        work_context_bundle_digest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        activation: {$ref: "#/components/schemas/AgentActivationPin"}
        model_ref: {type: [string, "null"], maxLength: 300}
        tool_contract_version_ref: {type: [string, "null"], maxLength: 300}
        input_artifact_refs:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        output_artifact_refs:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_refs:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        result_refs:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        state: {enum: [prepared, running, awaiting_human, submitted, succeeded, failed, cancelled, result_unknown, reconciling, manual_unknown]}
        outcome: {type: [string, "null"], maxLength: 1000}
      allOf:
        - if:
            properties:
              domain_skill_runtime_mode: {const: eligibility_and_provenance_only_v1}
            required: [domain_skill_runtime_mode]
          then:
            properties:
              domain_skill_overlay: {type: "null"}
        - if:
            properties:
              domain_skill_runtime_mode: {const: signed_isolated_overlay_v1}
            required: [domain_skill_runtime_mode]
          then:
            properties:
              domain_skill_overlay: {$ref: './domain-skill-overlay.schema.json#/$defs/signed_overlay_artifact'}
    CreateActionIntentRequest:
      type: object
      additionalProperties: false
      required: [origin, action_type, target_ref, expected_target_version, artifact_ref, artifact_sha256, request_sha256, consequence_summary, consequence_summary_sha256, required_authorization_level]
      properties:
        origin: {enum: [principal_session, agent_run]}
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        claim_id: {$ref: "#/components/schemas/OpaqueId"}
        acting_role_ref:
          type: string
          minLength: 1
          maxLength: 300
          description: Required only for principal_session and resolved against the authenticated principal; AgentRun acting profession is derived from its token/grant.
        action_type: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        target_ref: {type: string, minLength: 1, maxLength: 500}
        expected_target_version: {$ref: "#/components/schemas/AggregateVersion"}
        artifact_ref: {type: string, minLength: 1, maxLength: 500}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        request_sha256:
          type: string
          pattern: "^sha256:[a-fA-F0-9]{64}$"
          description: Hash of the canonical typed command including target_ref, expected_target_version and artifact digest; server recomputes it.
        consequence_summary: {type: string, minLength: 1, maxLength: 2000}
        consequence_summary_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        required_authorization_level:
          enum: [A0, A1, A2, A3, A4]
          description: Claimed level; the server derives the action-type minimum and rejects any lower client value.
      oneOf:
        - properties:
            origin: {const: principal_session}
          required: [acting_role_ref]
          not:
            required: [agent_run_id]
        - properties:
            origin: {const: agent_run}
          required: [agent_run_id, work_item_id, claim_id]
          not:
            required: [acting_role_ref]
      description: Authentication must match origin. The server derives the principal and immutable authorization snapshot; system_mandate intents are created only by the owning domain transaction.
    ActionIntent:
      type: object
      additionalProperties: false
      required: [action_intent_id, origin, authorization_principal_ref, acting_role_ref, authorization_basis_snapshot_ref, action_type, target_ref, expected_target_version, artifact_ref, artifact_sha256, request_sha256, consequence_summary, consequence_summary_sha256, required_authorization_level, idempotency_key, state, aggregate_version]
      properties:
        action_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        origin: {enum: [principal_session, agent_run, system_mandate]}
        authorization_principal_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        acting_role_ref: {type: string, minLength: 1, maxLength: 300}
        authorization_basis_snapshot_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Immutable session/authority, ExecutionGrant, or signed mandate evaluation snapshot selected by origin.
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        claim_id: {$ref: "#/components/schemas/OpaqueId"}
        agent_connection_ref: {$ref: "#/components/schemas/OpaqueId"}
        execution_grant_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
        settlement_instruction_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_bound_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_usage_reservation_ref: {$ref: "#/components/schemas/OpaqueId"}
        action_type: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        target_ref: {type: string, minLength: 1, maxLength: 500}
        expected_target_version: {$ref: "#/components/schemas/AggregateVersion"}
        artifact_ref: {type: string, minLength: 1, maxLength: 500}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        request_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        consequence_summary: {type: string, minLength: 1, maxLength: 2000}
        consequence_summary_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        required_authorization_level: {enum: [A0, A1, A2, A3, A4]}
        idempotency_key: {type: string, minLength: 8, maxLength: 200}
        state: {enum: [drafted, awaiting_signature, authorized, executing, succeeded, failed, expired, superseded, result_unknown, manual_unknown]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        signature_ref: {$ref: "#/components/schemas/OpaqueId"}
      allOf:
        - oneOf:
            - properties:
                origin: {const: principal_session}
              not:
                anyOf:
                  - required: [agent_run_id]
                  - required: [agent_connection_ref]
                  - required: [execution_grant_snapshot_ref]
                  - required: [settlement_instruction_ref]
                  - required: [mandate_ref]
                  - required: [mandate_bound_ref]
                  - required: [mandate_usage_reservation_ref]
            - properties:
                origin: {const: agent_run}
              required: [agent_run_id, work_item_id, claim_id, agent_connection_ref, execution_grant_snapshot_ref]
              not:
                anyOf:
                  - required: [settlement_instruction_ref]
                  - required: [mandate_ref]
                  - required: [mandate_bound_ref]
                  - required: [mandate_usage_reservation_ref]
            - properties:
                origin: {const: system_mandate}
              required: [settlement_instruction_ref, mandate_ref, mandate_bound_ref, mandate_usage_reservation_ref]
              not:
                anyOf:
                  - required: [agent_run_id]
                  - required: [work_item_id]
                  - required: [claim_id]
                  - required: [agent_connection_ref]
                  - required: [execution_grant_snapshot_ref]
        - if:
            properties:
              origin: {enum: [principal_session, agent_run]}
              required_authorization_level: {const: A4}
              state: {enum: [authorized, executing, succeeded, failed, result_unknown, manual_unknown]}
            required: [origin, required_authorization_level, state]
          then:
            required: [signature_ref]
      description: A4 principal-session or AgentRun intents cannot reach an authorized/effect state without signature_ref. A system_mandate intent never fabricates a per-transfer signature; its required authorization basis points to the exact HumanSignature-backed mandate, bound and atomic usage reservation.
    SignActionIntentRequest:
      type: object
      additionalProperties: false
      required: [request_sha256, artifact_sha256, consequence_summary_sha256, acknowledgement, expected_aggregate_version]
      properties:
        request_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        consequence_summary_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: sign_this_exact_action_and_artifact}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    ExecuteActionIntentRequest:
      type: object
      additionalProperties: false
      required: [execution_mode, expected_action_intent_version]
      properties:
        execution_mode: {enum: [principal_session, agent_run, system_mandate]}
        agent_run_id: {$ref: "#/components/schemas/OpaqueId"}
        task_lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        expected_action_intent_version: {$ref: "#/components/schemas/AggregateVersion"}
      oneOf:
        - properties:
            execution_mode: {const: principal_session}
          not:
            anyOf:
              - required: [agent_run_id]
              - required: [task_lease_id]
              - required: [fencing_token]
        - properties:
            execution_mode: {const: agent_run}
          required: [agent_run_id, task_lease_id, fencing_token]
        - properties:
            execution_mode: {const: system_mandate}
          not:
            anyOf:
              - required: [agent_run_id]
              - required: [task_lease_id]
              - required: [fencing_token]
      description: The credential and mode must match ActionIntent origin. Idempotency-Key must equal the bound key; execution rechecks expected_target_version and cannot replace target, artifact, request or consequence.
    CreateDraftArtifactRequest:
      type: object
      additionalProperties: false
      required: [work_item_id, work_claim_id, acting_profession_membership_ref, artifact_type, artifact_schema_ref, target_ref, base_target_version, content]
      properties:
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        work_claim_id: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_type:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{1,99}$"
          description: Typed domain command payload; free-form executable instructions are not accepted.
        artifact_schema_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        target_ref: {type: string, minLength: 1, maxLength: 500}
        base_target_version: {$ref: "#/components/schemas/AggregateVersion"}
        base_artifact_ref:
          type: string
          minLength: 1
          maxLength: 500
          description: Optional immutable source artifact when the draft proposes a change rather than a new target.
        content:
          type: object
          description: Validated server-side against the exact pinned artifact_schema_ref before storage.
    CreateDraftArtifactRevisionRequest:
      type: object
      additionalProperties: false
      required: [work_item_id, work_claim_id, acting_profession_membership_ref, prior_revision_id, base_target_version, content, expected_aggregate_version]
      properties:
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        work_claim_id: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        prior_revision_id:
          allOf:
            - {$ref: "#/components/schemas/OpaqueId"}
          description: Must equal the draftArtifactId path value so the successor cannot be attached to a different lineage.
        base_target_version: {$ref: "#/components/schemas/AggregateVersion"}
        content:
          type: object
          description: A complete replacement document validated against the artifact's pinned schema; merge patches are not stored as canonical content.
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    DraftArtifact:
      type: object
      additionalProperties: false
      required: [draft_artifact_id, lineage_id, revision_number, work_item_id, work_claim_id, acting_profession_membership_ref, author_principal_ref, artifact_type, artifact_schema_ref, target_ref, base_target_version, content, artifact_sha256, deterministic_diff, state, aggregate_version, created_at]
      properties:
        draft_artifact_id: {$ref: "#/components/schemas/OpaqueId"}
        lineage_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Stable across successor revisions; draft_artifact_id identifies exactly one immutable revision aggregate.
        revision_number: {type: integer, minimum: 1, maximum: 1000000}
        prior_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        work_item_id: {$ref: "#/components/schemas/OpaqueId"}
        work_claim_id: {$ref: "#/components/schemas/OpaqueId"}
        acting_profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        author_principal_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        author_agent_run_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Present only when an AgentRun produced this revision; the human or organization remains the principal.
        artifact_type: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        artifact_schema_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        target_ref: {type: string, minLength: 1, maxLength: 500}
        base_target_version: {$ref: "#/components/schemas/AggregateVersion"}
        base_artifact_ref: {type: string, minLength: 1, maxLength: 500}
        content: {type: object}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        deterministic_diff:
          type: object
          additionalProperties: false
          required: [format, base_sha256, result_sha256, operations]
          properties:
            format: {const: json_patch_summary/v1}
            base_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
            result_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
            operations:
              type: array
              maxItems: 10000
              items:
                type: object
                additionalProperties: false
                required: [op, path]
                properties:
                  op: {enum: [add, remove, replace, move, copy, test]}
                  path: {type: string, maxLength: 2000}
                  from: {type: string, maxLength: 2000}
        review_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        applied_action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [draft, superseded, applied, abandoned]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        created_at: {type: string, format: date-time}
      description: Applying this immutable revision requires a separate ActionIntent, current target version, required human review and the target action's A0–A4 authorization rule. Creating a successor atomically supersedes this revision and creates a new draft_artifact_id in the same lineage.
    CreatePositioningDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_aggregate_version, user_words, ai_suggestions, unknowns, first_evidence, falsifier, fallback]
      properties:
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        user_words:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 1000}
        ai_suggestions:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 1000}
        unknowns:
          type: array
          items: {type: string, minLength: 1, maxLength: 1000}
        first_evidence: {type: string, minLength: 1, maxLength: 1000}
        falsifier: {type: string, minLength: 1, maxLength: 1000}
        fallback: {type: string, minLength: 1, maxLength: 1000}
        strategy_mode: {enum: [content, workflow, business_amplifier, pause]}
    PositioningDraft:
      type: object
      additionalProperties: false
      required: [draft_id, run_id, skill_version_ref, artifact_sha256, state, user_words, ai_suggestions, unknowns, first_evidence, falsifier, fallback]
      properties:
        draft_id: {$ref: "#/components/schemas/OpaqueId"}
        run_id: {$ref: "#/components/schemas/OpaqueId"}
        skill_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        state: {enum: [advisory, confirmed, dismissed, superseded]}
        user_words:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 1000}
        ai_suggestions:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 1000}
        unknowns:
          type: array
          items: {type: string, minLength: 1, maxLength: 1000}
        first_evidence: {type: string, minLength: 1, maxLength: 1000}
        falsifier: {type: string, minLength: 1, maxLength: 1000}
        fallback: {type: string, minLength: 1, maxLength: 1000}
        strategy_mode: {enum: [content, workflow, business_amplifier, pause]}
    CreateReviewSubmissionRequest:
      type: object
      additionalProperties: false
      required: [target_kind, target_ref, version_ref, artifact_sha256, review_protocol_ref, evidence_refs]
      properties:
        target_kind: {enum: [software, skill, physical_product, service_package, listing, batch]}
        target_ref: {type: string, minLength: 1, maxLength: 500}
        version_ref: {type: string, minLength: 1, maxLength: 500}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        review_protocol_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 500}
        funded_engagement_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Optional separate customer-sponsored project; absence means community review has no review fee for software or Skills.
    CreateReviewerAppointmentRequest:
      type: object
      additionalProperties: false
      required: [subject_member_ref, scope, review_by, reason]
      properties:
        subject_member_ref: {$ref: "#/components/schemas/OpaqueId"}
        scope: {$ref: "#/components/schemas/StableKey"}
        review_by: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 2000}
    RevokeReviewerAppointmentRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    RetractQualityReviewRequest:
      type: object
      additionalProperties: false
      required: [reason, original_review_ref]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        original_review_ref: {$ref: "#/components/schemas/OpaqueId"}
        second_authorizer_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Required only when the authenticated retractor is not the original reviewer; must identify a distinct natural person's exact authorization.
      description: retracted_by is always derived from the authenticated principal and is intentionally not client-supplied.
    ReviewerAppointment:
      type: object
      additionalProperties: false
      required: [appointment_id, appointer_ref, subject_member_ref, scope, granted_at, review_by, reason, state, aggregate_version]
      properties:
