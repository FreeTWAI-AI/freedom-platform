    get:
      tags: [Commerce]
      operationId: getProductPricingGuidance
      description: >-
        Returns Supplier terms plus explainable platform suggestions. MSRP and
        recommended_floor are advisory; this endpoint never decides whether a Supplier accepts a Seller price.
      parameters:
        - name: productId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Versioned pricing and split guidance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingGuidance"}
  /seller-listings:
    post:
      tags: [Commerce]
      operationId: createSellerListingRevision
      description: >-
        Creates a Seller-owned default-price revision with an optional immutable effective-
        price schedule. MSRP and recommended_floor are advisory. The listing remains non-
        sellable until every Supplier accepts this exact revision and schedule digest.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSellerListingRevisionRequest"}
      responses:
        "201":
          description: Draft SellerListingRevision created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SellerListingRevision"}
  /seller-listings/{listingRevisionId}:request-supply:
    post:
      tags: [Commerce]
      operationId: requestDistributionAcceptance
      parameters:
        - name: listingRevisionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizeSellerListingRevisionRequest"}
      responses:
        "202": {description: "Supplier receives the exact default price, effective-price schedule, settlement rule, fulfillment, returns and effective window for human choice"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /distribution-acceptances/{acceptanceId}:accept:
    post:
      tags: [Commerce]
      operationId: acceptDistributionTerms
      description: A4 supplier signature over the exact listing revision and artifact digest; only then can checkout expose it as sellable.
      parameters:
        - name: acceptanceId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptDistributionTermsRequest"}
      responses:
        "200": {description: Supplier acceptance activated for this exact revision and effective window}
        "412": {$ref: "#/components/responses/VersionConflict"}
