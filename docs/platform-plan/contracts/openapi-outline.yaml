          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: milestoneId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecideServiceMilestoneRequest"}
      responses:
        "200": {description: Exact milestone decision recorded}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
