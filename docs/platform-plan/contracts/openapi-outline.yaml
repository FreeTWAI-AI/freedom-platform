        "201": {description: Server-owned scheduled round created from an immutable participant snapshot}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /match-rounds/{roundId}:complete:
    post:
      tags: [Community, Integrations]
      operationId: completeActivityMatchRound
      parameters:
        - $ref: "#/components/parameters/RoundId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionedSystemCommand"}
      responses:
        "200": {description: Round completed once from server clock; directed assignments are not encounter facts}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
