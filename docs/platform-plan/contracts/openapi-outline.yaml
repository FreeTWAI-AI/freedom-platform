  /activities/{activityId}/check-ins:
    post:
      tags: [Community]
      operationId: checkInToCommunityActivity
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityCheckInRequest"}
      responses:
        "201": {description: "Actor-derived, activity-scoped participation atomically created or returned"}
        "409": {$ref: "#/components/responses/StateConflict"}
