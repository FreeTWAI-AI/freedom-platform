        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateServiceChangeRequest"}
      responses:
        "201": {description: Change request opened; current signed SOW remains authoritative}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /opportunities/{opportunityId}/claims:
    post:
      tags: [Opportunities]
      operationId: claimOpportunity
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201": {description: Claim created}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /products:
    post:
      tags: [Commerce]
      operationId: createProduct
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201": {description: Product draft created}
  /commercial-editions:
    post:
      tags: [Quality]
      operationId: createCommercialEdition
      description: >-
        Binds packaged, hosted, custom, implementation, managed or support modes to an
        exact open-source repository/SkillVersion and license evidence. Commercial does not mean proprietary.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201": {description: CommercialEdition draft created; listing still requires QC and signed commercial terms}
  /offers/{offerId}:publish:
    post:
      tags: [Commerce]
      operationId: publishOffer
      description: A4 signer publishes the exact OfferVersion, Supplier pricing/settlement terms and artifact digest; draft creation remains reversible.
      parameters:
        - name: offerId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublishOfferRequest"}
      responses:
        "200": {description: Functionally valid OfferVersion published}
        "412": {$ref: "#/components/responses/VersionConflict"}
