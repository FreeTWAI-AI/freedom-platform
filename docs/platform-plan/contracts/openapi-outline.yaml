        appointer_ref: {$ref: "#/components/schemas/OpaqueId"}
        subject_member_ref: {$ref: "#/components/schemas/OpaqueId"}
        scope: {$ref: "#/components/schemas/StableKey"}
        granted_at: {type: string, format: date-time}
        review_by: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 2000}
        state: {enum: [active, revoked, expired]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Only an active exact-scope appointment grants qc.review scope; appointer_ref is a named OD-10 Council natural person.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, verdict, artifact_sha256, protocol_version_ref, findings, evidence_refs, acknowledgement]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        verdict: {enum: [accepted, changes_requested]}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        protocol_version_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        findings:
          type: array
          items: {type: string, minLength: 1, maxLength: 2000}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 500}
        acknowledgement: {const: sign_this_exact_version_review}
    CreateServiceEngagementRequest:
      type: object
      additionalProperties: false
      required: [source_type, source_ref, customer_party_ref, provider_party_ref, engagement_types, coordinator_profession_membership_ref]
      properties:
        source_type: {enum: [opportunity, project, direct_customer_request]}
        source_ref: {$ref: "#/components/schemas/OpaqueId"}
        customer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        provider_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        squad_ref: {$ref: "#/components/schemas/OpaqueId"}
        engagement_types:
          type: array
          minItems: 1
