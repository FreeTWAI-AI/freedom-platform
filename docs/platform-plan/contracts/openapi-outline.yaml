        "412": {$ref: "#/components/responses/VersionConflict"}
  /service-engagements/{engagementId}/allocation-plans/{allocationPlanId}:sign:
    post:
      tags: [Opportunities]
      operationId: signEngagementAllocationPlan
      description: A named participant A4-signs only their exact entry and the complete plan digest; all required acceptances must exist before activation.
      parameters:
        - name: engagementId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: allocationPlanId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignEngagementAllocationPlanRequest"}
      responses:
        "200": {description: Participant signature appended; plan activates only after all required signatures}
