      tags: [Community]
      operationId: reportCommunityEncounter
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EncounterReportRequest"}
      responses:
        "201": {description: Reporting actor records their own activity-scoped encounter; assignment alone never calls this}
  /internal/activities/{activityId}/encounter-reports:
    post:
      tags: [Community, Integrations]
      operationId: reportCommunityEncounterFromActivitySession
      description: >-
        Lounge backchannel for the encounter-report aggregate. Service identity and
        activity-session proof are both required; community, activity and actor are
