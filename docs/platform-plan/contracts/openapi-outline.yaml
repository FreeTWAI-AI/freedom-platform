    post:
      tags: [Commerce]
      operationId: requestDistributionTermsChange
      description: Supplier asks the Seller for a new price, schedule or supply-term revision; the current revision never becomes sellable.
      parameters:
        - name: acceptanceId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequestDistributionTermsChangeRequest"}
      responses:
        "200": {description: Requested changes recorded and SellerListingRevision remains non-sellable}
        "412": {$ref: "#/components/responses/VersionConflict"}
