        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202": {description: Quota-reserved render jobs queued}
  /activities:
    post:
      tags: [Community]
      operationId: createCommunityActivity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201": {description: Draft activity created; roles and preferences remain event-scoped}
  /activities/{activityId}:publish:
    post:
      tags: [Community]
      operationId: publishCommunityActivity
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
