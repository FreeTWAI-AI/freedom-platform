          items: {$ref: "#/components/schemas/SowMilestoneDefinition"}
        support_terms: {type: string, minLength: 1, maxLength: 10000}
        change_rule: {type: string, minLength: 1, maxLength: 5000}
        commercial_edition_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        required_signer_parties:
          type: array
          minItems: 2
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
    SowMilestoneDefinition:
      type: object
      additionalProperties: false
