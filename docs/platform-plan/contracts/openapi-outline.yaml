openapi: 3.1.0
info:
  title: Freedom Platform API
  version: 0.1.1-planning-low-ops
  description: >-
    Executable-shaped planning subset, not the complete API. The endpoint tables in
    04-module-specifications.md are the complete planning inventory. 1A contract freeze expands
    every operation, request/response schema, error, example and authorization scope
    into the canonical OpenAPI before implementation.
servers:
  - url: https://api.freedom.example/api/v1
    description: Placeholder production base URL
x-internal-service-bindings:
  CREDENTIAL_LIFECYCLE_BROKER:
    owner: platform-security
    runtime: credential-broker
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: CredentialLifecycleEntrypoint
    provisioned_only_to: platform-api
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    entrypoint_role: credential_lifecycle
    methods:
      storeOAuthCallbackCredential:
        request_schema: "#/components/schemas/StoreOAuthCallbackCredentialRequest"
        response_schema: "#/components/schemas/StoredOAuthCredentialReceipt"
        preconditions:
          - verified_provider_callback_state_PKCE_and_exact_pending_Connection
          - exact_community_principal_provider_purpose_and_callback_receipt_binding
          - transient_credential_material_is_redacted_and_encrypted_before_return
        returns: opaque_secret_ref_only
      rotateConnectionCredential:
        request_schema: "#/components/schemas/RotateConnectionCredentialRequest"
        response_schema: "#/components/schemas/RotatedConnectionCredentialReceipt"
        preconditions:
          - authorized_owner_or_operator_connection_lifecycle_command
          - exact_connection_version_and_community_match
          - new_provider_credential_is_encrypted_before_reference_activation
        returns: opaque_secret_ref_and_redacted_rotation_receipt
      revokeConnectionCredential:
        request_schema: "#/components/schemas/RevokeConnectionCredentialRequest"
        response_schema: "#/components/schemas/RevokedConnectionCredentialReceipt"
        preconditions:
          - authorized_owner_or_operator_connection_lifecycle_command
          - exact_connection_version_and_community_match
        returns: redacted_revocation_receipt
    invariants:
      - entrypoint_exports_only_the_three_listed_lifecycle_methods
      - entrypoint_role_is_hard_coded_and_never_selected_by_request_body
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - no_method_returns_a_stored_long_lived_provider_credential
  INTEGRATION_CREDENTIAL_BROKER:
    owner: platform-security
    runtime: credential-broker
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: IntegrationJobCredentialEntrypoint
    provisioned_only_to: integration-worker
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    entrypoint_role: integration
    allowed_job_types: [payment_session, settlement_transfer, notification_delivery, github_sync, provider_reconciliation]
    methods:
      issueJobCapability:
        request_schema: "#/components/schemas/ProviderCredentialExchangeRequest"
        response_schema: "#/components/schemas/ProviderCredentialCapability"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_and_registry_executor_group_integration_match
      proxyProviderOperation:
        request_schema: "#/components/schemas/ProviderProxyOperationRequest"
        response_schema: "#/components/schemas/ProviderProxyOperationResult"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_operation_and_registry_executor_group_integration_match
    invariants:
      - entrypoint_exports_only_the_two_listed_job_methods
      - executor_group_integration_is_hard_coded_and_never_selected_by_request_body
      - exact_job_type_group_and_current_lease_are_rechecked_from_canonical_DB_before_secret_lookup
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - no_method_returns_a_stored_long_lived_provider_credential
  GROWTH_CREDENTIAL_BROKER:
    owner: platform-security
    runtime: credential-broker
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: GrowthJobCredentialEntrypoint
    provisioned_only_to: growth-worker
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    entrypoint_role: growth
    allowed_job_types: [channel_publication]
    methods:
      issueJobCapability:
        request_schema: "#/components/schemas/ProviderCredentialExchangeRequest"
        response_schema: "#/components/schemas/ProviderCredentialCapability"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_and_registry_executor_group_growth_match
      proxyProviderOperation:
        request_schema: "#/components/schemas/ProviderProxyOperationRequest"
        response_schema: "#/components/schemas/ProviderProxyOperationResult"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_operation_and_registry_executor_group_growth_match
    invariants:
      - entrypoint_exports_only_the_two_listed_job_methods
      - executor_group_growth_is_hard_coded_and_never_selected_by_request_body
      - exact_job_type_group_and_current_lease_are_rechecked_from_canonical_DB_before_secret_lookup
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - no_method_returns_a_stored_long_lived_provider_credential
  MEDIA_CREDENTIAL_BROKER:
    owner: platform-security
    runtime: credential-broker
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: MediaJobCredentialEntrypoint
    provisioned_only_to: media-worker
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    entrypoint_role: media
    allowed_job_types: [media_transcript, media_render]
    methods:
      issueJobCapability:
        request_schema: "#/components/schemas/ProviderCredentialExchangeRequest"
        response_schema: "#/components/schemas/ProviderCredentialCapability"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_and_registry_executor_group_media_match
      proxyProviderOperation:
        request_schema: "#/components/schemas/ProviderProxyOperationRequest"
        response_schema: "#/components/schemas/ProviderProxyOperationResult"
        preconditions:
          - canonical_job_family_is_general_provider_and_state_is_running
          - current_lease_fencing_connection_community_operation_and_registry_executor_group_media_match
    invariants:
      - entrypoint_exports_only_the_two_listed_job_methods
      - executor_group_media_is_hard_coded_and_never_selected_by_request_body
      - exact_job_type_group_and_current_lease_are_rechecked_from_canonical_DB_before_secret_lookup
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - no_method_returns_a_stored_long_lived_provider_credential
  STATUS_SIGNER:
    owner: platform-trust
    runtime: status-signer
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: ProjectStatusSignerEntrypoint
    provisioned_only_to: release-status-worker
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    methods:
      signProjectStatusAttestation:
        request_schema: "#/components/schemas/SignProjectStatusAttestationRequest"
        response_schema: "#/components/schemas/ProjectStatusAttestationSigningReceipt"
        preconditions:
          - exact_release_status_job_is_running_under_the_current_lease_and_fencing_token
          - release_status_intent_expected_version_matches_canonical_DB
          - signer_reloads_repo_release_assets_QC_A4_key_and_revocation_facts_with_its_own_status_only_DB_role
    invariants:
      - entrypoint_exports_only_the_one_listed_typed_method
      - request_accepts_only_canonical_identifiers_version_and_lease_proof_not_statement_bytes_decision_trust_label_or_official_boolean
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - signer_never_reads_the_credential_vault_or_returns_signing_key_material
  QUARANTINE_WRITER:
    owner: platform-security
    runtime: quarantine-writer
    transport: cloudflare-service-binding-private-rpc
    named_entrypoint: IncidentQuarantineWriterEntrypoint
    provisioned_only_to: [platform-api, webhook-ingress]
    public_route: false
    public_hostname: false
    authority_source: deploy-time_binding_to_exact_named_entrypoint
    methods:
      putIncident:
        request_schema: "#/components/schemas/PutIncidentQuarantineRequest"
        request_body_argument: transient_read_once_binary_stream
        response_schema: "#/components/schemas/IncidentQuarantineReceipt"
        preconditions:
          - payload_was_received_accidentally_before_classification_and_downstream_processing_is_stopped
          - declared_digest_size_and_delete_deadline_are_verified_while_streaming
    invariants:
      - entrypoint_exports_only_putIncident_and_has_no_read_list_delete_or_generic_object_method
      - body_stream_is_never_logged_traced_replayed_indexed_or_returned
      - binding_has_no_public_default_RPC_HTTP_or_service_OAuth_fallback
      - only_quarantine_writer_holds_the_isolated_incident_bucket_binding_but_native_R2_capability_is_explicitly_broader_than_the_putIncident_RPC_contract
x-credential-broker-deployment-invariants:
  runtime: credential-broker
  default_entrypoint_rpc_methods: []
  denied_binding_holders:
    - release-status-worker
    - status-signer
    - public-web
    - portal-web
    - webhook-ingress
    - local-or-server-agent
  invariants:
    - each_caller_deployment_has_at_most_its_one_exact_named_broker_entrypoint_binding
    - request_body_headers_and_RPC_arguments_never_select_or_assert_caller_role
    - lifecycle_and_executor_entrypoints_share_no_public_superset_interface
x-status-signer-deployment-invariants:
  runtime: status-signer
  default_entrypoint_rpc_methods: []
  exact_binding_holder: release-status-worker
  denied_binding_holders: [platform-api, integration-worker, growth-worker, media-worker, credential-broker, public-web, portal-web, webhook-ingress, local-or-server-agent]
  invariants:
    - release_status_worker_holds_STATUS_SIGNER_only_and_holds_no_credential_broker_binding
    - signer_reconstructs_the_typed_statement_from_canonical_DB_and_never_signs_caller_supplied_bytes
    - signer_and_credential_broker_share_no_DB_credential_secret_namespace_root_key_or_deploy_token
x-quarantine-writer-deployment-invariants:
  runtime: quarantine-writer
  default_entrypoint_rpc_methods: []
  exact_binding_holders: [platform-api, webhook-ingress]
  denied_binding_holders: [public-web, portal-web, integration-worker, growth-worker, media-worker, release-status-worker, credential-broker, status-signer, local-or-server-agent]
  native_storage_binding_capability: cloudflare_r2_bucket_binding_exposes_broader_get_head_put_delete_list_and_multipart_API_without_action_level_IAM
  invariants:
    - callers_hold_only_the_private_put_facade_and_never_the_incident_bucket_binding
    - quarantine_writer_has_no_normal_application_DB_role_and_exports_only_putIncident_but_its_native_R2_binding_is_not_a_method_scoped_security_boundary
    - reviewed_code_must_not_invoke_get_head_list_delete_or_multipart_and_IaC_integrity_audit_alerts_short_retention_and_bucket_isolation_are_compensating_controls
    - quarantine_sweeper_uses_a_separate_deploy_credential_and_is_not_a_QUARANTINE_WRITER_caller
    - quarantine_sweeper_application_code_invokes_only_head_delete_but_its_native_R2_binding_is_also_broader_than_that_logical_contract
    - hard_action_level_write_only_or_delete_only_is_not_claimed_for_R2_and_requires_a_storage_provider_with_enforceable_action_scoped_IAM
x-submission-intake-invariants:
  aggregate_owner: opportunities-results
  source_auth_matrix:
    portal: [userSession_with_csrf]
    line: [serviceOAuth_intake.drafts.create_with_verified_LINE_inbox_binding]
    discord: [serviceOAuth_intake.drafts.create_with_verified_Discord_inbox_binding]
    document: [userSession_with_csrf, agentExecutionToken_with_intake.draft_grant]
  terminal_command_auth: userSession_with_csrf_owner_or_authorized_organization_operator_only
  invariants:
    - request_never_accepts_owner_principal_and_server_derives_it_from_the_authenticated_binding
    - line_or_discord_source_is_loaded_from_the_exact_verified_normalized_inbox_receipt
    - external_client_document_body_remains_owner_controlled_and_only_opaque_ref_revision_digest_and_media_metadata_are_stored
    - source_dedupe_key_is_server_derived_and_same_key_same_hash_returns_original_while_changed_hash_conflicts
    - confirm_or_reject_requires_idempotency_key_and_matching_if_match_and_body_expected_version
    - exactly_one_terminal_transition_wins_and_confirm_atomically_creates_exactly_one_typed_draft_target
    - document_confirm_compares_owner_acknowledgement_to_the_saved_source_ref_revision_and_digest_but_performs_no_fetch_and_proves_no_current_reachability_or_bytes
    - a_Platform_known_revoked_document_access_policy_conflicts_but_endpoint_outage_does_not_block_confirmation
    - a_bound_local_Agent_later_fetches_the_exact_revision_hashes_bytes_locally_and_records_success_or_known_failure_before_any_consequential_effect
    - a_local_success_receipt_is_authenticated_fenced_Agent_provenance_not_independent_remote_attestation_and_never_replaces_review_signature_or_A4
    - external_adapter_or_agent_token_can_create_but_never_confirm_or_reject
    - no_external_message_or_submission_draft_is_an_A4_signature_QC_contract_payment_or_release_approval
tags:
  - name: Membership
  - name: Organization
  - name: Positioning
  - name: Coaching
  - name: Skills
  - name: Opportunities
  - name: Work
  - name: Quality
  - name: Commerce
  - name: Storefront
  - name: Marketing
  - name: Media
  - name: Community
  - name: Integrations
paths:
  /auth/guest-sessions:
    post:
      tags: [Membership]
      operationId: createGuestSession
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: Server-set purpose-limited guest session and CSRF bootstrap
          headers:
            Set-Cookie:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GuestSessionCreated"}
      security:
        - {}
  /me/status:
    get:
      tags: [Membership]
      operationId: getMyStatus
      responses:
        "200":
          description: Now, Next, Gained and Needs attention projection
  /me/xp:
    get:
      tags: [Membership, Organization]
      operationId: getMyProfessionXp
      description: >-
        Returns separately keyed member-by-profession-by-track projections. The response
        has no cross-profession total and is never an entitlement, rank, reviewer-appointment
        or A4 input. Every row identifies its policy version and rebuild event position.
      responses:
        "200":
          description: Rebuildable profession-scoped XP projections
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberXpProjectionPage"}
  /professions/{profession_key}/xp-policy:
    get:
      tags: [Organization]
      operationId: getProfessionXpPolicy
      description: Returns the active, human-readable deterministic XP policy for exactly one profession.
      parameters:
        - name: profession_key
          in: path
          required: true
          schema: {$ref: "#/components/schemas/StableKey"}
      responses:
        "200":
          description: Active profession-specific XP policy version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/XpPolicyVersion"}
        "404": {description: No active XP policy for this profession}
  /guilds:
    get:
      tags: [Organization]
      operationId: listGuilds
      description: >-
        Lists long-lived vertical professions, learning paths, current office holders,
        public entry points and the Board WorkItem template for proposing a new profession
        line. v1 members self-join an existing Guild; they do not directly create one.
      responses:
        "200":
          description: Versioned Guild and profession directory
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GuildSummary"}
      security:
        - {}
    post:
      tags: [Organization]
      operationId: createGuild
      description: >-
        Creates a Guild draft for a Board or delegated Community Ops operator. This is
        not a member self-join endpoint. Missing playbook items, including the optional
        private Discord channel slot, are navigation findings and do not prevent draft creation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGuildRequest"}
      responses:
        "201":
          description: Guild draft created with a navigation readiness projection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GuildSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /guilds/{guildId}:
    patch:
      tags: [Organization]
      operationId: updateGuild
      description: Updates mutable Guild draft/profile fields; every accepted change creates a new aggregate version and recomputes navigation readiness.
      parameters:
        - name: guildId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateGuildRequest"}
      responses:
        "200":
          description: Guild revision updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GuildSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /guilds/{guildId}:change-state:
    post:
      tags: [Organization]
      operationId: changeGuildState
      description: Applies draft/active/degraded/archived lifecycle transitions. Readiness gaps never prevent active; degraded is observable navigation, not member punishment.
      parameters:
        - name: guildId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeGuildStateRequest"}
      responses:
        "200":
          description: Guild lifecycle state changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GuildSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /entity-playbooks/{entityKind}/{playbookKey}:
    get:
      tags: [Organization]
      operationId: getEntityPlaybook
      description: Returns the exact published playbook version shared by people and agents.
      parameters:
        - name: entityKind
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PlaybookEntityKind"}
        - name: playbookKey
          in: path
          required: true
          schema: {$ref: "#/components/schemas/StableKey"}
      responses:
        "200":
          description: Versioned playbook with stable item IDs and enforcement on every item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntityPlaybookVersion"}
      security:
        - {}
  /entity-readiness/{entityKind}/{entityId}:
    get:
      tags: [Organization]
      operationId: getEntityReadiness
      description: Returns a rebuildable per-instance readiness projection; missing navigation items do not change visibility or authority.
      parameters:
        - name: entityKind
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PlaybookEntityKind"}
        - name: entityId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Per-instance readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntityReadinessProjection"}
  /entity-readiness/{entityKind}/{entityId}/items/{itemId}:materialize-work-item:
    post:
      tags: [Organization, Work]
      operationId: materializeReadinessWorkItem
      description: Idempotently creates or returns the one claimable WorkItem for a missing playbook item without changing the entity or member's authority.
      parameters:
        - name: entityKind
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PlaybookEntityKind"}
        - name: entityId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: itemId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/StableKey"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: WorkItem created or prior idempotent result returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterializedReadinessWorkItem"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /module-stewardships:
    get:
      tags: [Organization]
      operationId: listModuleStewardships
      description: Shows exactly one accountable office holder per module revision plus bounded delegates and succession path.
      responses:
        "200": {description: Active stewardship directory}
      security:
        - {}
  /me/profession-memberships:
    post:
      tags: [Organization]
      operationId: createMyProfessionMembership
      description: >-
        Member joins or confirms a profession at Runner entry. Later rank evidence is
        separate from office or entitlement; joining one Guild never removes another profession.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMyProfessionMembershipRequest"}
      responses:
        "201":
          description: ProfessionMembership created at Runner or existing active membership returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfessionMembershipSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/onboarding-bundles:
    post:
      tags: [Organization, Work, Skills]
      operationId: confirmMyOnboardingBundle
      description: >-
        The canonical day-one command. In one idempotent transaction the authenticated
        member confirms a stable profession_key, the server resolves the current Guild and
        starter package, creates or returns Runner ProfessionMembership, confirms WorkIntent,
        replaces the profession-scoped equipped set and returns all generated opaque refs.
        A newcomer or agent never hand-enters opaque IDs. The welcome journey starts from
        the committed profession-confirmed event and none of its steps is an admission gate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmMyOnboardingBundleRequest"}
      responses:
        "201":
          description: Atomic membership, WorkIntent, equipped-skill and journey result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingBundleSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/work-intents:
    post:
      tags: [Organization, Work]
      operationId: confirmMyWorkIntent
      description: >-
        Creates and confirms a self-declared WorkIntent revision without requiring a
        positioning assessment or guided-discovery run. The authenticated member chooses
        existing ProfessionMemberships, availability and desired work types; this affects
        matching only and grants no rank, office, entitlement or payment.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmMyWorkIntentRequest"}
      responses:
        "201":
          description: Immutable WorkIntent revision confirmed by the member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkIntentSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /me/equipped-skills:
    put:
      tags: [Organization, Skills]
      operationId: replaceMyEquippedSkills
      description: Selects pinned SkillVersions per acting profession for matching and agent context; it grants no privileged capability by itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceMyEquippedSkillsRequest"}
      responses:
        "200":
          description: Equipped SkillVersion set replaced as one versioned revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EquippedSkillsSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/onboarding-journeys/current:
    get:
      tags: [Organization, Work, Skills]
      operationId: getMyCurrentOnboardingJourney
      description: Rebuildable day-one projection from identity, optional positioning, membership, WorkIntent, equip, installation, welcome and first WorkItem facts.
      responses:
        "200":
          description: Current navigation-only journey
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingJourney"}
  /me/onboarding-journeys/{journeyId}:answer-welcome:
    post:
      tags: [Organization]
      operationId: answerMyWelcomePrompt
      description: Records the member's optional one-line goal. Skipping or leaving it unanswered has no effect on access, matching or discoverability.
      parameters:
        - name: journeyId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AnswerWelcomePromptRequest"}
      responses:
        "200":
          description: Welcome prompt answered or explicitly skipped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingJourney"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/profession-memberships/{membershipId}/starter-track:
    get:
      tags: [Organization, Work]
      operationId: getMyProfessionStarterTrack
      description: Returns the pinned starter-track version and per-membership navigation progress; it is never an admission score.
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Profession starter track and member progress
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfessionStarterProgress"}
  /me/profession-memberships/{membershipId}/starter-track/items/{itemId}:report:
    post:
      tags: [Organization, Work]
      operationId: reportMyProfessionStarterItem
      description: Reports satisfied, skipped, stuck or alternative evidence for one starter item; every outcome remains navigation-only.
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: itemId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/StableKey"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportStarterItemRequest"}
      responses:
        "200":
          description: Starter progress updated without authority side effects
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfessionStarterProgress"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/member-skill-installations:
    post:
      tags: [Skills, Work]
      operationId: startMyMemberSkillInstallation
      description: >-
        Creates a member plus AgentConnection plus PackageVersion scoped installation.
        The package/version ref must come from the onboarding bundle, starter-track or
        Skill catalog response; it is never free-form user text. This status is distinct
        from package capability_readiness, equipped selection and an AgentRun.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartMemberSkillInstallationRequest"}
      responses:
        "201":
          description: Installation tracking record created or returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberSkillInstallation"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/member-skill-installations/{installationId}:verify:
    post:
      tags: [Skills, Work]
      operationId: verifyMyMemberSkillInstallation
      description: >-
        A1 preflight records a deterministic receipt for the exact member, connection and
        PackageVersion. Failure or outdated state creates navigation Next/WorkItem options;
        it never removes membership, entitlement or future discoverability.
      parameters:
        - name: installationId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyMemberSkillInstallationRequest"}
      responses:
        "200":
          description: Verification receipt applied; fail/degraded remains an accepted navigation fact
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberSkillInstallation"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
      security:
        - agentExecutionToken: []
  /me/day-one-execution-grants:
    post:
      tags: [Work]
      operationId: createMyDayOneExecutionGrant
      description: >-
        Instantiates the fixed day1.learn-equip-and-claim A0-A2 template for the
        calling member's already returned onboarding bundle and AgentConnection. It is
        short-lived, single-profession, starter-package and first-low-risk-WorkItem scoped,
        revocable, and never an A4 signature for a contract, payment, QC or future artifact.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateDayOneExecutionGrantRequest"}
      responses:
        "201":
          description: Bounded day-one ExecutionGrant created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecutionGrantSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /me/work-context:
    get:
      tags: [Work]
      operationId: getMyWorkContext
      description: >-
        Returns a short-lived, purpose-minimized bundle for the member or their agent:
        confirmed profession memberships, equipped SkillVersions, current WorkIntent,
        matched WorkItems, resource references and active grant summaries. Raw positioning
        conversations, unrelated profile fields, provider secrets and chain-of-thought are absent.
      responses:
        "200":
          description: Current immutable context revision
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkContextBundle"}
      security:
        - userSession: []
        - agentConnectionToken: []
        - agentExecutionToken: []
  /me/work-feed:
    get:
      tags: [Work]
      operationId: getMyDailyWorkFeed
      description: >-
        Lists help requests, offered assistance and shared-goal items from the active operating scope, with legacy and promised capacity explicitly distinguished. Lists explainable, workable items across sales, marketing, support, QC, GitHub,
        supplier onboarding, development, implementation and opportunities. Each item
        says why it matches, the acting profession, effort, gain, evidence and signature needs.
      responses:
        "200":
          description: Personalized but non-exclusive daily feed; skipping creates no penalty
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DailyWorkFeed"}
      security:
        - userSession: []
        - agentConnectionToken: []
        - agentExecutionToken: []
  /agent-connections/device-authorizations:
    post:
      tags: [Work]
      operationId: beginAgentDeviceAuthorization
      description: >-
        Begins a rate-limited OAuth-style device/browser authorization. It creates no
        membership, profession, grant or authority; the human must approve the displayed
        client identity in the Portal before token exchange.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginAgentDeviceAuthorizationRequest"}
      responses:
        "201":
          description: Short-lived device and user codes created
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentDeviceAuthorization"}
      security:
        - {}
  /agent-connections/device-authorizations/{userCode}:approve:
    post:
      tags: [Work]
      operationId: approveAgentDeviceAuthorization
      description: >-
        Authenticated human binds the displayed client instance to their user or an
        organization they may represent. This registers an AgentConnection with only the
        purpose-minimized agent.bootstrap.read scope for the principal's status/feed; it
        grants no A1–A3 domain action. An ExecutionGrant is required for those actions and
        A4 is never delegated here.
      parameters:
        - name: userCode
          in: path
          required: true
          schema: {type: string, minLength: 6, maxLength: 32}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApproveAgentDeviceAuthorizationRequest"}
      responses:
        "200":
          description: AgentConnection registered for the exact displayed client and principal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentConnectionSummary"}
        "409": {$ref: "#/components/responses/StateConflict"}
  /agent-connections/device-token:
    post:
      tags: [Work]
      operationId: exchangeAgentDeviceAuthorization
      description: >-
        CLI exchanges its opaque device code and client-instance proof after human approval.
        Pending and slow-down responses reveal no member data; issued tokens are audience-
        bound to the registered AgentConnection and stored by the client in an OS credential vault.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeAgentDeviceAuthorizationRequest"}
      responses:
        "200":
          description: Short-lived connection token and rotation-bound refresh credential
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentConnectionToken"}
        "202": {description: Authorization pending; honor the returned polling interval}
        "409": {$ref: "#/components/responses/StateConflict"}
      security:
        - {}
  /agent-connections/refresh-token:
    post:
      tags: [Work]
      operationId: rotateAgentConnectionToken
      description: >-
        Rotates a connection refresh credential and issues a new short-lived token.
        The old refresh credential is invalidated atomically; replay, revoked connections
        and mismatched client-instance proof fail without revealing member data.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshAgentConnectionTokenRequest"}
      responses:
        "200":
          description: Rotated refresh credential and short-lived connection token
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentConnectionToken"}
        "409": {$ref: "#/components/responses/StateConflict"}
      security:
        - {}
  /agent-connections/{agentConnectionId}:revoke:
    post:
      tags: [Work]
      operationId: revokeAgentConnection
      description: Revokes connection tokens and stops new AgentRuns; ambiguous external effects remain in reconciliation.
      parameters:
        - name: agentConnectionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": {description: AgentConnection revoked and active grants made unusable for new actions}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /submission-drafts:
    get:
      tags: [Work, Integrations]
      operationId: listMySubmissionDrafts
      description: >-
        Lists owner-private intake metadata for the authenticated principal and any
        organization for which the current operator has the explicit intake capability.
        No caller-supplied owner filter, raw message or document body is accepted or returned.
      parameters:
        - name: state
          in: query
          required: false
          schema: {$ref: "#/components/schemas/SubmissionDraftState"}
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 1000}
      responses:
        "200":
          description: Resource-scoped SubmissionDraft inbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionDraftPage"}
      security:
        - userSession: []
    post:
      tags: [Work, Integrations]
      operationId: createSubmissionDraft
      description: >-
        Creates only an owner-private intake draft. Portal requests use the authenticated
        user session; LINE or Discord service callers must point to an exact verified Inbox
        receipt; a document source stays in owner-controlled storage. Agent execution tokens
        additionally require an active grant containing intake.draft. The owner is always
        server-derived and this operation cannot create, open or claim a canonical target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSubmissionDraftRequest"}
      responses:
        "201":
          description: New owner-private SubmissionDraft, or the original representation for an exact idempotent source replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionDraft"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
      security:
        - userSession: []
          csrfHeader: []
        - agentExecutionToken: []
        - serviceOAuth: [intake.drafts.create]
  /submission-drafts/{submissionDraftId}:
    get:
      tags: [Work, Integrations]
      operationId: getSubmissionDraft
      description: Returns only the owner-authorized, minimized intake record; never raw provider or document content.
      parameters:
        - name: submissionDraftId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Owner-authorized SubmissionDraft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionDraft"}
        "404": {description: No visible SubmissionDraft with this identifier}
      security:
        - userSession: []
  /submission-drafts/{submissionDraftId}:confirm:
    post:
      tags: [Work]
      operationId: confirmSubmissionDraft
      description: >-
        Owner or explicitly authorized organization operator acknowledges the exact saved
        source ref, revision and digest and confirms the same target kind in Portal. For an
        external document this command performs no source fetch and proves neither current
        reachability nor current bytes; an endpoint outage alone therefore does not block it,
        although an access policy already recorded as revoked does. One DB transaction invokes exactly one
        CreateDraftWorkItem or CreatePrivateOpportunityStub owning command and stores its
        target reference. It never opens, publishes, claims, grants, signs or approves it.
      parameters:
        - name: submissionDraftId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmSubmissionDraftRequest"}
      responses:
        "200":
          description: Confirmed SubmissionDraft with exactly one draft/private canonical target ref
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionDraft"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
      security:
        - userSession: []
          csrfHeader: []
  /submission-drafts/{submissionDraftId}:reject:
    post:
      tags: [Work]
      operationId: rejectSubmissionDraft
      description: Owner or explicitly authorized organization operator rejects one still-draft intake record; no target is created.
      parameters:
        - name: submissionDraftId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RejectSubmissionDraftRequest"}
      responses:
        "200":
          description: Rejected SubmissionDraft with no target ref
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionDraft"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
      security:
        - userSession: []
          csrfHeader: []
  /work-items/{workItemId}:claim:
    post:
      tags: [Work]
      operationId: claimWorkItem
      description: >-
        A person may claim directly, or an agent may perform this pre-run A2 command
        under an execution token whose grant explicitly allows work.claim for this item.
        The resulting WorkClaim always belongs to the person, team or Squad, never the agent.
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimWorkItemRequest"}
      responses:
        "201":
          description: Claim belongs to the person, team or Squad; never to an agent process
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkClaim"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
      security:
        - userSession: []
          csrfHeader: []
        - agentExecutionToken: []
  /execution-grants:
    post:
      tags: [Work]
      operationId: createExecutionGrant
      description: >-
        Principal grants one agent A0–A3 actions within explicit resource, time,
        count, channel and optional cost bounds. A4 is never a standing grant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateExecutionGrantRequest"}
      responses:
        "201":
          description: Bounded grant activated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecutionGrantSummary"}
  /execution-grants/{grantId}:revoke:
    post:
      tags: [Work]
      operationId: revokeExecutionGrant
      description: Revocation stops new actions immediately and preserves already recorded facts and in-flight reconciliation.
      parameters:
        - name: grantId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": {description: Grant revoked prospectively}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /execution-grants/{grantId}:mint-token:
    post:
      tags: [Work]
      operationId: mintAgentExecutionToken
      description: >-
        Exchanges a registered AgentConnection token for a short-lived execution token
        bound to this active grant, its acting ProfessionMembership and exact scopes. The
        grant must already name the same AgentConnection; A4 is structurally excluded.
      parameters:
        - name: grantId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MintAgentExecutionTokenRequest"}
      responses:
        "200":
          description: Purpose-, audience-, grant- and profession-bound execution token
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentExecutionTokenIssued"}
        "409": {$ref: "#/components/responses/StateConflict"}
      security:
        - agentConnectionToken: []
  /agent-runs:
    post:
      tags: [Work]
      operationId: createAgentRun
      description: >-
        Starts one leased execution for a current human-owned WorkClaim under one active
        ExecutionGrant. The agent is execution provenance, not a member, reviewer, Master or payee.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentRunRequest"}
      responses:
        "201":
          description: AgentRun and short TaskLease created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunLease"}
        "409": {$ref: "#/components/responses/StateConflict"}
      security:
        - agentExecutionToken: []
  /agent-runs/{agentRunId}:
    get:
      tags: [Work]
      operationId: getAgentRun
      description: Returns the persisted run provenance, including the server-verified signed activation tuple.
      parameters:
        - name: agentRunId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: AgentRun provenance record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunRecord"}
      security:
        - userSession: []
        - agentExecutionToken: []
  /agent-runs/{agentRunId}/external-source-verifications:
    post:
      tags: [Work, Integrations]
      operationId: recordAgentRunExternalSourceVerification
      description: >-
        Records the result of a bound local Agent fetching an exact owner-controlled external
        document revision and computing SHA-256 locally. The server requires the current
        AgentRun, TaskLease/fence and WorkItem-bound source tuple. Raw bytes and source
        credentials are never uploaded. A known unavailable, denied, missing-revision or
        digest-mismatch result is persisted as provenance and fails the AgentRun with zero
        consequential effects; a successful exact-digest receipt is required before that
        source-bound run may submit outputs or execute an ActionIntent. The receipt is an
        authenticated, current-lease-fenced Agent assertion, not independent server
        attestation that an untrusted remote host returned those bytes, and it never replaces
        normal review, signature or A4 controls.
      parameters:
        - name: agentRunId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecordExternalSourceVerificationRequest"}
      responses:
        "200":
          description: Immutable success or known-failure verification receipt recorded once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalSourceVerificationReceipt"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "423": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - agentExecutionToken: []
  /action-intents:
    post:
      tags: [Work]
      operationId: createActionIntent
      description: >-
        Creates one immutable, idempotent intent for a principal-session or AgentRun
        request. Authentication determines and must match the declared origin; clients
        cannot create system_mandate intents. The server recomputes request_sha256 and
        snapshots principal, acting role, target version and authorization basis. For an
        AgentRun whose WorkItem is bound to an external document, every required local
        exact-source verification receipt must already be successful.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateActionIntentRequest"}
      responses:
        "201":
          description: Intent created as authorized-within-grant or awaiting an exact A4 signature
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActionIntent"}
      security:
        - userSession: []
          csrfHeader: []
        - agentExecutionToken: []
  /action-intents/{actionIntentId}:sign:
    post:
      tags: [Work]
      operationId: signActionIntent
      description: >-
        Human signer approves the exact target, action, artifact digest and consequence digest.
        A chat reply or old signature for another digest cannot satisfy this operation.
      parameters:
        - $ref: "#/components/parameters/ActionIntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignActionIntentRequest"}
      responses:
        "200":
          description: Signature bound and intent authorized for exactly that digest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActionIntent"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /action-intents/{actionIntentId}:execute:
    post:
      tags: [Work]
      operationId: executeActionIntent
      description: >-
        Executes one allowlisted typed platform command referenced by the immutable
        ActionIntent. Principal-session, AgentRun and system-mandate execution contexts
        are mutually exclusive. The server rechecks the bound target version and exact
        authorization basis; AgentRun also requires a current lease/fence, while a system
        mandate requires an active matching mandate and atomically reserved capacity. A
        source-bound AgentRun must still have successful receipts for every exact external
        source tuple; confirmation of the originating SubmissionDraft is not such a receipt.
      parameters:
        - $ref: "#/components/parameters/ActionIntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecuteActionIntentRequest"}
      responses:
        "202":
          description: Typed command accepted once, or original result returned for an idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActionIntent"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "423": {$ref: "#/components/responses/StaleJobLease"}
      security:
        - userSession: []
          csrfHeader: []
        - agentExecutionToken: []
        - serviceOAuth: [actions.execute]
  /draft-artifacts:
    post:
      tags: [Work]
      operationId: createDraftArtifact
      description: >-
        Creates a schema-validated, immutable revision for a non-code business draft.
        Agents may draft only inside their current WorkItem/grant; this operation never
        applies the draft to a domain aggregate. GitHub remains canonical for code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateDraftArtifactRequest"}
      responses:
        "201":
          description: Immutable draft revision and deterministic diff created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftArtifact"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
      security:
        - userSession: []
          csrfHeader: []
        - agentExecutionToken: []
  /draft-artifacts/{draftArtifactId}:
    get:
      tags: [Work]
      operationId: getDraftArtifact
      description: Returns one immutable revision aggregate with its lineage, exact schema, base version, content digest and human-readable diff; authorization is resource-scoped.
      parameters:
        - name: draftArtifactId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Immutable draft revision with review/apply status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftArtifact"}
      security:
        - userSession: []
        - agentExecutionToken: []
  /draft-artifacts/{draftArtifactId}/revisions:
    post:
      tags: [Work]
      operationId: reviseDraftArtifact
      description: Supersedes this exact draft revision and creates a new immutable successor in the same lineage; it never overwrites the reviewed or applied digest.
      parameters:
        - name: draftArtifactId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateDraftArtifactRevisionRequest"}
      responses:
        "201":
          description: New immutable revision created and prior revision superseded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftArtifact"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
      security:
