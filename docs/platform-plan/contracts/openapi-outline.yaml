  /activities/{activityId}/exchange-codes:
    post:
      tags: [Community]
      operationId: createActivityExchangeCode
      description: >-
        Creates a one-time Lounge backchannel code for either the authenticated User
        or an activity_guest derived from a purpose-limited guest session. Exactly one
        cookie identity is accepted; presenting both guest and user sessions is
        rejected. Origin and csrfHeader are required for both cookie branches.
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: One-time short-lived backchannel exchange code; never place a participant or host token in the QR/URL
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityExchangeCodeCreated"}
        "400": {$ref: "#/components/responses/AmbiguousBrowserCredentials"}
        "403": {$ref: "#/components/responses/OriginRejected"}
      security:
        - guestSession: []
          csrfHeader: []
        - userSession: []
          csrfHeader: []
  /activity-sessions:exchange:
    post:
      tags: [Community, Integrations]
      operationId: exchangeActivitySession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivitySessionExchangeRequest"}
      responses:
        "200":
          description: Activity-scoped session resolved by the Lounge backend; code is consumed atomically
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivitySession"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "410": {$ref: "#/components/responses/ExchangeCodeExpired"}
      security:
        - serviceOAuth: [activities.exchange]
  /internal/activities/{activityId}/participation-actions:
    post:
      tags: [Community, Integrations]
      operationId: applyActivityParticipationAction
      description: >-
        Lounge compatibility backchannel. Service identity and the activity-session proof are both required;
        actor/community/participation are resolved server-side and no caller-supplied user ID is accepted.
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityParticipationAction"}
      responses:
        "200":
          description: Activity-scoped participation command applied idempotently; attendance remains a distinct fact
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityParticipationRef"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
      security:
        - serviceOAuth: [activities.participation.write]
          activitySessionProof: []
  /activities/{activityId}/match-rounds:
    post:
      tags: [Community]
      operationId: createActivityMatchRound
