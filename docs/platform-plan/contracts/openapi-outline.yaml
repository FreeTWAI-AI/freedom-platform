    post:
      tags: [Commerce]
      operationId: declineDistributionTerms
      description: Supplier declines the exact requested revision with a visible reason; a later proposal requires a new DistributionAcceptance request.
      parameters:
        - name: acceptanceId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeclineDistributionTermsRequest"}
      responses:
        "200": {description: Exact request declined; no new SupplyReservation may be created from it}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /distribution-acceptances/{acceptanceId}:revoke-future:
    post:
      tags: [Commerce]
      operationId: revokeFutureDistributionTerms
      description: >-
        A4 supplier signature stops new SupplyReservations immediately. Already-paid
        SupplyOrders and reservations created before revocation remain honored through
        their declared expiry under the previously accepted commitment.
      parameters:
        - name: acceptanceId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeFutureDistributionTermsRequest"}
      responses:
        "200": {description: Future supply revoked and listing removed from new checkout intents}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /orders:
    post:
      tags: [Commerce]
      operationId: createOrder
      description: >-
        Trusted Storefront backend submits one sealed intent. Commerce revalidates Store,
        Seller/biller tuple, exact listing/schedule resolution, active DistributionAcceptances
        and SupplyReservations, then creates one BuyerOrder plus per-Supplier SupplyOrders in
        awaiting_buyer_payment before provider checkout. Verified payment later consumes the
        reservations and creates SettlementInstructions; it does not first create SupplyOrders.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateCanonicalOrderRequest"}
      responses:
        "201":
          description: Canonical BuyerOrder and awaiting-payment SupplyOrders created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CanonicalOrderCreated"}
        "409": {$ref: "#/components/responses/StateConflict"}
      security:
        - serviceOAuth: [orders.create]
  /orders/{orderId}/refund-requests:
    post:
      tags: [Commerce]
      operationId: requestOrderRefund
      description: >-
        Creates a RefundRequest against the refundable server-confirmed payment
        balance. This command does not itself refund money or reverse ledger entries.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRefundRequest"}
      responses:
        "201":
          description: Refund requested; payment and ledger unchanged
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefundRequestView"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "403": {$ref: "#/components/responses/OriginRejected"}
      security:
        - userSession: []
          csrfHeader: []
  /refund-requests/{refundRequestId}:accept:
    post:
      tags: [Commerce]
      operationId: acceptRefundRequest
      parameters:
        - name: refundRequestId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptRefundRequest"}
      responses:
        "200":
          description: Refund accepted for execution; outcome remains not_refunded until an authoritative fact or manual resolution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefundRequestView"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "403": {$ref: "#/components/responses/OriginRejected"}
      security:
        - userSession: []
          csrfHeader: []
  /internal/refund-requests/{refundRequestId}:resolve-manually:
    post:
      tags: [Commerce, Integrations]
      operationId: resolveRefundRequestManually
      description: >-
        Audited exceptional path. resolve_manually_as_refunded appends an explicitly
        verified operator-resolution PaymentFact and the corresponding append-only
        reversal; resolve_manually_as_not_refunded records no payment or ledger fact.
        The service authenticates the call, while a matching exact-artifact human
        signature identifies the accountable operator; the body never accepts an arbitrary operator user ID.
      parameters:
        - name: refundRequestId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualRefundResolutionRequest"}
      responses:
        "200":
          description: Terminal manual outcome recorded with immutable audit/evidence references
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefundRequestView"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
      security:
        - serviceOAuth: [refunds.resolve]
  /commerce-connections:begin:
    post:
      tags: [Commerce, Integrations]
      operationId: beginCommerceConnection
      description: >-
        Starts provider-hosted onboarding for one explicit purpose: Seller collection,
        payer-owned disbursement, or beneficiary payout destination. One provider account
        may back more than one verified purpose binding, but collection authority never
        implies disbursement authority. Ordinary domain tables retain only an opaque
        credential reference. Provider-managed credentials stay in the provider vault;
        when OAuth or API proxying unavoidably requires Platform custody, only the
        Credential Broker resolves that reference to a per-record envelope-encrypted
        token in the isolated PostgreSQL credential vault, while the root key remains
        in a purpose-scoped secret manager or KMS. Plaintext credentials are forbidden.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginCommerceConnectionRequest"}
      responses:
        "201":
          description: Provider onboarding session or supported direct-tokenization step created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommerceConnectionSetup"}
        "403": {$ref: "#/components/responses/OriginRejected"}
      security:
        - userSession: []
          csrfHeader: []
  /commerce-connections/{connectionId}:verify:
    post:
      tags: [Commerce, Integrations]
      operationId: verifyCommerceConnection
      description: >-
        Refreshes provider capabilities and verifies ownership/readiness without returning
        plaintext provider credentials to the caller or importing them into ordinary domain
        tables; an unavoidable Platform-custodied dynamic token remains envelope-encrypted in
        the isolated credential vault and is usable only through the Credential Broker.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Connection readiness and capability snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommerceConnectionReadiness"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /parties/{partyId}/commerce-readiness:
    get:
      tags: [Commerce]
      operationId: getPartyCommerceReadiness
      parameters:
        - name: partyId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Collection, disbursement, beneficiary destination, mandate, sellability and fix-next-step status for this party
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartyCommerceReadiness"}
  /settlement-mandates:
    post:
      tags: [Commerce]
      operationId: createSettlementMandate
      description: >-
        A payer signs bounded standing authorization for the platform to settle named
        SupplierPayable, CommissionObligation or ServicePayable entries through that
        payer's disbursement connection. In commerce the payer is normally the Seller.
        The platform stores only references and never receives or holds the funds.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSettlementMandateRequest"}
      responses:
        "201":
          description: Exact bounded mandate activated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettlementMandate"}
  /settlement-mandates/{mandateId}:revoke:
    post:
      tags: [Commerce]
      operationId: revokeSettlementMandate
      description: >-
        A4 payer signature revokes the exact mandate. Ready operations stop, release
        reserved capacity and return to authorization_required. Executing,
        provider-accepted and result-unknown operations retain capacity and reconcile;
        obligations remain due and need another mandate or an explicitly signed manual path.
      parameters:
        - name: mandateId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeSettlementMandateRequest"}
      responses:
        "200": {description: Mandate revoked prospectively}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /settlement-instructions/{instructionId}:
    get:
      tags: [Commerce]
      operationId: getSettlementInstruction
      parameters:
        - name: instructionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
      responses:
        "200":
          description: Obligation, automated transfer and reconciliation status without provider secrets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettlementInstruction"}
  /settlement-instructions/{instructionId}:submit-manual-evidence:
    post:
      tags: [Commerce]
      operationId: submitManualSettlementEvidence
      description: Manual-required evidence path only when the connected provider cannot initiate transfers or reconciliation requires human evidence; it never starts a second payment for an ambiguous operation.
      parameters:
        - name: instructionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualSettlementEvidenceRequest"}
      responses:
        "202": {description: "Evidence queued for verification; upload alone confirms no transfer, and only a confirmed SupplierPayable may authorize fulfillment"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /stores/{storeId}/bindings:
    post:
      tags: [Storefront]
      operationId: createStoreBinding
      parameters:
        - name: storeId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      description: A4 signer activates one exact Seller/biller and buyer-facing responsibility tuple for this Store; Supplier and fulfiller remain line-level snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateStoreBindingRequest"}
      responses:
        "201":
          description: Pending deployment binding created for one Seller and biller
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreBinding"}
  /storefront/v1/stores/{publicId}/catalog:
    servers:
      - url: https://api.freedom.example
        description: Public Storefront BFF surface
    get:
      tags: [Storefront]
      operationId: getStorefrontCatalog
      description: >-
        Cacheable public catalog. X-Store-Client identifies a public deployment for
        origin/rate controls but is not an authentication credential.
      parameters:
        - $ref: "#/components/parameters/PublicStoreId"
        - $ref: "#/components/parameters/PublicStoreClientId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Server-derived catalog with immutable OfferVersion, SellerListingRevision and active DistributionAcceptance references
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string}
            Vary:
              schema: {type: string, const: "Origin, X-Store-Client"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontCatalog"}
        "304": {description: Catalog ETag has not changed}
        "403": {$ref: "#/components/responses/OriginRejected"}
        "409": {$ref: "#/components/responses/StorefrontConflict"}
      security:
        - {}
  /storefront/v1/order-intents:
    servers:
      - url: https://api.freedom.example
        description: Public Storefront BFF surface
    post:
      tags: [Storefront]
      operationId: createStorefrontOrderIntent
      description: >-
        Creates a short-lived, server-priced intent and Supplier-backed SupplyReservations
        before any payment session. Client input contains no price, seller, commission
        or payment authority; Commerce recomputes all snapshots.
      parameters:
        - $ref: "#/components/parameters/PublicStoreClientId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateStorefrontOrderIntentRequest"}
      responses:
        "201":
          description: One Seller-priced order and one checkout-purpose token; a cart containing another Seller must start a separate checkout
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontOrderIntentCreated"}
        "403": {$ref: "#/components/responses/OriginRejected"}
        "409": {$ref: "#/components/responses/StorefrontConflict"}
        "422": {$ref: "#/components/responses/StorefrontValidationFailed"}
        "503": {$ref: "#/components/responses/StorefrontPaymentUnavailable"}
      security:
        - {}
  /storefront/v1/order-intents/{intentId}:checkout:
    servers:
      - url: https://api.freedom.example
        description: Public Storefront BFF surface
    post:
      tags: [Storefront]
      operationId: checkoutStorefrontOrderIntent
      description: >-
        The bearer must have purpose=checkout and be bound to intentId, store,
        allowed Origin, OfferVersions, SellerListingRevisions, DistributionAcceptances
        and nonce. The server ignores any attempted
        client override of price, seller or commission and atomically rejects expired reservations before charge creation.
      parameters:
        - $ref: "#/components/parameters/StorefrontIntentId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StorefrontCheckoutRequest"}
      responses:
        "202":
          description: One BuyerOrder under the Store's Seller and biller, with internal per-Supplier SupplyOrders
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontCheckoutAccepted"}
        "401": {$ref: "#/components/responses/PurposeTokenInvalid"}
        "403": {$ref: "#/components/responses/OriginRejected"}
        "409": {$ref: "#/components/responses/StorefrontConflict"}
        "410": {$ref: "#/components/responses/PurposeTokenExpired"}
        "412": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/StorefrontValidationFailed"}
        "503": {$ref: "#/components/responses/StorefrontPaymentUnavailable"}
      security:
        - storefrontPurposeToken: []
  /storefront/v1/orders/{publicNumber}:
    servers:
      - url: https://api.freedom.example
        description: Public Storefront BFF surface
    get:
      tags: [Storefront]
      operationId: getStorefrontOrderView
      description: >-
        The bearer must have purpose=order_view and be bound to this public order
        number and buyer context. It cannot enumerate or mutate any other order.
      parameters:
        - $ref: "#/components/parameters/PublicOrderNumber"
      responses:
        "200":
          description: Buyer-scoped payment, fulfillment and refund projection
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontOrderView"}
        "401": {$ref: "#/components/responses/PurposeTokenInvalid"}
        "404": {description: Order not found within the token scope}
        "410": {$ref: "#/components/responses/PurposeTokenExpired"}
      security:
        - storefrontPurposeToken: []
  /storefront/v1/stores/{publicId}/binding-health:
    servers:
      - url: https://api.freedom.example
        description: Public Storefront BFF surface
    get:
      tags: [Storefront]
      operationId: getStorefrontBindingHealth
      description: >-
        Returns only public deployment compatibility and recovery guidance. A
        transient degraded state never revokes a member entitlement.
      parameters:
        - $ref: "#/components/parameters/PublicStoreId"
        - $ref: "#/components/parameters/PublicStoreClientId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Public binding and contract compatibility health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontBindingHealth"}
        "403": {$ref: "#/components/responses/OriginRejected"}
      security:
        - {}
  /campaigns:
    post:
      tags: [Marketing]
      operationId: createCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
