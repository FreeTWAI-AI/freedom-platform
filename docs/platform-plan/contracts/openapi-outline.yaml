        The request cannot supply a user ID, and an assignment alone never records an encounter.
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivitySessionEncounterAction"}
      responses:
        "201": {description: Actor-bound encounter report or explicit decline recorded idempotently}
        "409": {$ref: "#/components/responses/StateConflict"}
