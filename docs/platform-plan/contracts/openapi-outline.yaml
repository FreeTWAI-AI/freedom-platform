        title: {type: string, minLength: 1, maxLength: 300}
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 2000}
        value: {$ref: "#/components/schemas/NonNegativeMoney"}
        due_at: {type: string, format: date-time}
    SignSowVersionRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, signer_party_ref, signer_role, sow_artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        signer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        signer_role: {enum: [customer, provider, sponsor]}
        sow_artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: sign_this_exact_sow_version}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    CreateEngagementAllocationPlanRequest:
      type: object
      additionalProperties: false
      required: [sow_version_ref, entries, required_participant_refs]
      properties:
        sow_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        entries:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          x-uniqueBy: entry_id
          items: {$ref: "#/components/schemas/EngagementAllocationEntry"}
        required_participant_refs:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
      x-invariants:
        - {rule: set_equals_projection, set: required_participant_refs, array: entries, field: participant_party_ref}
      description: Entries come from Squad negotiation. entry_id is unique, and required_participant_refs must equal the distinct participant_party_ref set projected from entries. The API has no default allocation and rejects any entry inferred only from a contribution, PR or community QC record.
    EngagementAllocationEntry:
      type: object
      additionalProperties: false
      required: [entry_id, participant_party_ref, profession_membership_ref, work_scope, milestone_refs, calculation]
      properties:
        entry_id: {$ref: "#/components/schemas/OpaqueId"}
        participant_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        profession_membership_ref: {$ref: "#/components/schemas/OpaqueId"}
        work_scope: {type: string, minLength: 1, maxLength: 5000}
        milestone_refs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        calculation:
          oneOf:
            - type: object
              additionalProperties: false
              required: [mode, amount]
              properties:
                mode: {const: fixed_amount}
                amount: {$ref: "#/components/schemas/NonNegativeMoney"}
            - type: object
              additionalProperties: false
              required: [mode, currency, basis_points]
              properties:
                mode: {const: milestone_value_basis_points}
                currency: {type: string, pattern: "^[A-Z]{3}$"}
                basis_points: {type: integer, minimum: 0, maximum: 10000}
            - type: object
              additionalProperties: false
              required: [mode, formula_ref, maximum_amount]
              properties:
                mode: {const: signed_formula}
                formula_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
                maximum_amount: {$ref: "#/components/schemas/NonNegativeMoney"}
    SignEngagementAllocationPlanRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, participant_party_ref, allocation_entry_refs, plan_artifact_sha256, acknowledgement, expected_aggregate_version]
      x-invariants:
        - {rule: refs_owned_by, refs: allocation_entry_refs, collection: allocation_plan.entries, owner_field: participant_party_ref, owner: participant_party_ref}
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        participant_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        allocation_entry_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        plan_artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: accept_my_entries_and_this_complete_allocation_plan}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: The server resolves every allocation_entry_ref from the exact plan digest and rejects missing, foreign or duplicate entries; each referenced entry must name participant_party_ref, and the HumanSignature signer must have authority for that same party.
    SubmitServiceMilestoneRequest:
      type: object
      additionalProperties: false
      required: [deliverable_artifact_sha256, evidence_refs, acceptance_criteria_results, expected_aggregate_version]
      properties:
        deliverable_artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string, minLength: 1, maxLength: 500}
        acceptance_criteria_results:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 2000}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    DecideServiceMilestoneRequest:
      type: object
      additionalProperties: false
      required: [decision, deliverable_artifact_sha256, expected_aggregate_version]
      properties:
        decision: {enum: [accept, request_changes]}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        deliverable_artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        reason: {type: string, minLength: 1, maxLength: 5000}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      allOf:
        - if:
            properties:
              decision: {const: accept}
            required: [decision]
          then:
            required: [action_intent_ref, human_signature_ref]
        - if:
            properties:
              decision: {const: request_changes}
            required: [decision]
          then:
            required: [reason]
    CreateServiceChangeRequest:
      type: object
      additionalProperties: false
      required: [requested_by_party_ref, reason, scope_delta, schedule_delta, price_delta, expected_aggregate_version]
      properties:
        requested_by_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        reason: {type: string, minLength: 1, maxLength: 5000}
        scope_delta: {type: string, minLength: 1, maxLength: 10000}
        schedule_delta: {type: string, minLength: 1, maxLength: 5000}
        price_delta: {$ref: "#/components/schemas/SignedMoneyDelta"}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Approval is represented by a newly signed SOWVersion and, when allocation changes, a newly signed EngagementAllocationPlan; this request never edits either signed artifact.
    PublishOfferRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, offer_version_ref, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        offer_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: publish_this_exact_offer_and_supplier_terms}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    PricingGuidance:
      type: object
      additionalProperties: false
      required: [product_version_ref, currency, supplier_due, msrp, recommended_floor, suggested_seller_margin, explanation, guidance_rule_ref, advisory_only]
      properties:
        product_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        supplier_due: {$ref: "#/components/schemas/NonNegativeMoney"}
        msrp: {$ref: "#/components/schemas/NonNegativeMoney"}
        recommended_floor: {$ref: "#/components/schemas/NonNegativeMoney"}
        suggested_seller_margin: {$ref: "#/components/schemas/NonNegativeMoney"}
        suggested_split_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
          description: Optional display aid; signed DistributionAcceptance and order snapshot are authoritative.
        explanation:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 500}
        guidance_rule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        advisory_only: {const: true}
    CreateSellerListingRevisionRequest:
      type: object
      additionalProperties: false
      required: [store_ref, product_version_ref, offer_version_ref, qc_verdict_ref, pricing_mode, default_unit_price, proposed_supplier_settlement_rule, fulfillment_terms_ref, return_terms_ref, effective_from]
      properties:
        store_ref: {$ref: "#/components/schemas/OpaqueId"}
        product_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        offer_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        qc_verdict_ref: {$ref: "#/components/schemas/OpaqueId"}
        pricing_mode: {enum: [fixed, preaccepted_schedule]}
        default_unit_price:
          allOf:
            - {$ref: "#/components/schemas/NonNegativeMoney"}
          description: Default effective buyer-facing item price before separately itemized shipping and tax; it is the only price when pricing_mode=fixed.
        price_schedule_ref:
          $ref: "#/components/schemas/ImmutableRuleRef"
          description: Immutable condition-to-effective-price schedule visible to and signed by the Supplier; required only for preaccepted_schedule.
        proposed_supplier_settlement_rule: {$ref: "#/components/schemas/SupplierSettlementRule"}
        fulfillment_terms_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        return_terms_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        effective_from: {type: string, format: date-time}
        effective_until: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              pricing_mode: {const: preaccepted_schedule}
            required: [pricing_mode]
          then:
            required: [price_schedule_ref]
          else:
            not:
              required: [price_schedule_ref]
    SellerListingRevision:
      type: object
      additionalProperties: false
      required: [listing_id, listing_revision_id, seller_party_ref, store_ref, product_version_ref, offer_version_ref, qc_verdict_ref, pricing_mode, default_unit_price, proposed_supplier_settlement_rule, fulfillment_terms_ref, return_terms_ref, effective_from, artifact_sha256, supply_acceptance_state, sellability_state, aggregate_version]
      properties:
        listing_id: {$ref: "#/components/schemas/OpaqueId"}
        listing_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        seller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        store_ref: {$ref: "#/components/schemas/OpaqueId"}
        product_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        offer_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        qc_verdict_ref: {$ref: "#/components/schemas/OpaqueId"}
        pricing_mode: {enum: [fixed, preaccepted_schedule]}
        default_unit_price:
          allOf:
            - {$ref: "#/components/schemas/NonNegativeMoney"}
          description: Default effective item price; immutable schedule conditions may resolve another Supplier-preaccepted effective price.
        price_schedule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        proposed_supplier_settlement_rule: {$ref: "#/components/schemas/SupplierSettlementRule"}
        fulfillment_terms_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        return_terms_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        effective_from: {type: string, format: date-time}
        effective_until: {type: string, format: date-time}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        supply_acceptance_state: {enum: [not_requested, pending, accepted, declined, revoked, expired]}
        sellability_state: {enum: [draft, awaiting_supply_acceptance, changes_requested, sellable, paused, superseded, retired]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    AuthorizeSellerListingRevisionRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, listing_revision_id, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        listing_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: authorize_this_actual_price_revision_for_supplier_review}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    AcceptDistributionTermsRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, listing_revision_id, pricing_mode, default_unit_price, supplier_settlement_rule, fulfillment_commitment_ref, return_terms_ref, effective_from, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        listing_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        pricing_mode: {enum: [fixed, preaccepted_schedule]}
        default_unit_price: {$ref: "#/components/schemas/NonNegativeMoney"}
        price_schedule_ref:
          $ref: "#/components/schemas/ImmutableRuleRef"
          description: When present, the Supplier signs the same immutable schedule used by checkout pricing.
        supplier_settlement_rule: {$ref: "#/components/schemas/SupplierSettlementRule"}
        fulfillment_commitment_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        return_terms_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        quantity_cap: {type: integer, minimum: 1}
        effective_from: {type: string, format: date-time}
        effective_until: {type: string, format: date-time}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: accept_this_actual_price_and_supply_commitment}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      allOf:
        - if:
            properties:
              pricing_mode: {const: preaccepted_schedule}
            required: [pricing_mode]
          then:
            required: [price_schedule_ref]
          else:
            not:
              required: [price_schedule_ref]
    SupplierSettlementRule:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, amount]
          properties:
            mode: {const: fixed_supplier_net_per_unit}
            amount: {$ref: "#/components/schemas/NonNegativeMoney"}
        - type: object
          additionalProperties: false
          required: [mode, currency, supplier_share_basis_points]
          properties:
            mode: {const: supplier_share_basis_points}
            currency: {type: string, pattern: "^[A-Z]{3}$"}
            supplier_share_basis_points: {type: integer, minimum: 0, maximum: 10000}
        - type: object
          additionalProperties: false
          required: [mode, currency, amount_schedule_ref]
          properties:
            mode: {const: signed_amount_schedule}
            currency: {type: string, pattern: "^[A-Z]{3}$"}
            amount_schedule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
      description: Supplier signs one immutable rule. Checkout resolves and snapshots the exact Supplier due per line; no contribution, PR or QC record may infer this rule.
    RequestDistributionTermsChangeRequest:
      type: object
      additionalProperties: false
      required: [reason, requested_changes, expected_aggregate_version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        requested_changes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {enum: [default_unit_price, effective_price_schedule, supplier_settlement_rule, quantity_or_availability, fulfillment, returns, effective_window, other]}
        note: {type: string, minLength: 1, maxLength: 2000}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    DeclineDistributionTermsRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_aggregate_version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    RevokeFutureDistributionTermsRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, reason, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        reason: {type: string, minLength: 1, maxLength: 2000}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: revoke_future_supply_but_honor_paid_orders_and_live_reservations}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    BeginCommerceConnectionRequest:
      type: object
      additionalProperties: false
      required: [party_ref, purpose, provider, onboarding_mode, currencies, return_url]
      properties:
        party_ref: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {enum: [seller_collection, payer_disbursement, beneficiary_payout_destination]}
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        onboarding_mode: {enum: [provider_hosted, oauth, provider_tokenization, file_export_only]}
        currencies:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[A-Z]{3}$"}
        return_url: {type: string, format: uri}
    CommerceConnectionSetup:
      type: object
      additionalProperties: false
      required: [connection_id, purpose, provider, state, capability_snapshot, expires_at]
      properties:
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {enum: [seller_collection, payer_disbursement, beneficiary_payout_destination]}
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        state: {enum: [onboarding, pending_verification, active, manual_only]}
        onboarding_url:
          type: string
          format: uri
          description: Short-lived provider-hosted URL; absent for file_export_only.
        capability_snapshot:
          type: array
          uniqueItems: true
          items: {enum: [collect_payment, query_payment, create_refund, initiate_transfer, query_transfer, receive_webhook, export_transfer_file, verify_destination, receive_transfer]}
        expires_at: {type: string, format: date-time}
    CommerceConnectionReadiness:
      type: object
      additionalProperties: false
      required: [connection_ref, purpose, state, capabilities, currencies, masked_destination, checked_at, aggregate_version]
      properties:
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        purpose: {enum: [seller_collection, payer_disbursement, beneficiary_payout_destination]}
        state: {enum: [pending, active, degraded, reauth_required, manual_only, revoked]}
        capabilities:
          type: array
          uniqueItems: true
          items: {enum: [collect_payment, query_payment, create_refund, initiate_transfer, query_transfer, receive_webhook, export_transfer_file, verify_destination, receive_transfer]}
        currencies:
          type: array
          uniqueItems: true
          items: {type: string, pattern: "^[A-Z]{3}$"}
        masked_destination: {type: string, minLength: 1, maxLength: 200}
        checked_at: {type: string, format: date-time}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    PartyCommerceReadiness:
      type: object
      additionalProperties: false
      required: [party_ref, seller_collection, payer_disbursement, beneficiary_payout_destination, money_movement_enabled, active_mandates_as_payer, sellable_listing_count, needs_attention]
      properties:
        party_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller_collection: {enum: [not_configured, onboarding, ready, degraded, reauth_required, manual_only]}
        payer_disbursement: {enum: [not_configured, onboarding, ready, degraded, reauth_required, manual_only]}
        beneficiary_payout_destination: {enum: [not_configured, onboarding, ready, degraded, reauth_required, manual_only]}
        money_movement_enabled:
          type: boolean
          default: false
          readOnly: true
          description: Platform-wide money-movement gate projected into commerce readiness; false is the launch default.
        active_mandates_as_payer: {type: integer, minimum: 0}
        sellable_listing_count: {type: integer, minimum: 0}
        needs_attention:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [code, fix_action]
            properties:
              code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
              fix_action: {type: string, minLength: 1, maxLength: 500}
    CreateSettlementMandateRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, payer_party_ref, payer_disbursement_connection_ref, bounds, starts_at, expires_at, artifact_sha256, acknowledgement]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_disbursement_connection_ref: {$ref: "#/components/schemas/PayerDisbursementConnectionRef"}
        bounds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          x-uniqueBy: bound_id
          items: {$ref: "#/components/schemas/SettlementMandateBound"}
        starts_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: authorize_bounded_financial_obligation_settlements_from_my_disbursement_connection}
      description: Bound IDs must be unique. Contract CI and the server enforce x-uniqueBy=bound_id, verify that payer_party_ref owns the active purpose-tagged disbursement connection, and reject overlapping applicability within this mandate for the same beneficiary, destination, currency, action type and intersecting scope.
    SettlementMandateBound:
      type: object
      additionalProperties: false
      required: [bound_id, beneficiary_party_ref, payout_destination_ref, currency, payout_action_types, scope_mode, per_transfer_cap, period_cap, period, period_timezone]
      properties:
        bound_id: {$ref: "#/components/schemas/OpaqueId"}
        beneficiary_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payout_destination_ref: {$ref: "#/components/schemas/PayoutDestinationRef"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        payout_action_types:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {enum: [supplier_payable_settlement, commission_obligation_settlement, service_payable_settlement, signed_refund_netting, signed_chargeback_netting]}
        scope_mode: {enum: [all_signed_sources_for_beneficiary, explicit]}
        scope_refs:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: ProductVersion, DistributionAcceptance, commission rule, SOW or EngagementAllocationPlan references; required for explicit scope.
          items: {type: string, minLength: 1, maxLength: 500}
        per_transfer_cap: {$ref: "#/components/schemas/PositiveMinorAmount"}
        period_cap: {$ref: "#/components/schemas/PositiveMinorAmount"}
        period: {enum: [day, week, month]}
        period_timezone: {$ref: "#/components/schemas/IanaTimeZone"}
        week_starts_on: {const: monday}
      allOf:
        - if:
            properties:
              scope_mode: {const: explicit}
            required: [scope_mode]
          then:
            required: [scope_refs]
          else:
            not:
              required: [scope_refs]
        - if:
            properties:
              period: {const: week}
            required: [period]
          then:
            required: [week_starts_on]
      description: Both caps are positive minor-unit amounts denominated exclusively by this bound's currency. payout_destination_ref must resolve to an active destination owned by beneficiary_party_ref. Calendar days and months use period_timezone; calendar weeks begin Monday. One instruction must resolve to exactly one non-overlapping bound.
    SettlementMandate:
      type: object
      additionalProperties: false
      required: [mandate_id, payer_party_ref, action_intent_ref, human_signature_ref, payer_disbursement_connection_ref, settlement_execution_mode, bounds, starts_at, expires_at, artifact_sha256, state, aggregate_version]
      properties:
        mandate_id: {$ref: "#/components/schemas/OpaqueId"}
        payer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_disbursement_connection_ref: {$ref: "#/components/schemas/PayerDisbursementConnectionRef"}
        settlement_execution_mode:
          type: string
          enum: [record_only, authorized_mandate]
          default: record_only
          readOnly: true
          description: Server-projected Seller settlement setting; creating or holding a mandate does not itself switch the Seller out of record_only.
        bounds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          x-uniqueBy: bound_id
          items: {$ref: "#/components/schemas/SettlementMandateBound"}
        starts_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        state: {enum: [active, revoked, expired, superseded]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Bound IDs are unique under the required x-uniqueBy validator and overlapping applicability inside one mandate is invalid. payer_party_ref must own the active purpose-tagged disbursement connection. Commerce normally uses SellerParty as payer; service engagements may name another payer.
    RevokeSettlementMandateRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, reason, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        reason: {type: string, minLength: 1, maxLength: 2000}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: revoke_unaccepted_transfer_operations_and_preserve_obligations}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    SettlementInstruction:
      type: object
      additionalProperties: false
      required: [instruction_id, obligation_type, obligation_ref, source_type, source_version_ref, payer_party_ref, payer_disbursement_connection_ref, beneficiary_party_ref, payout_destination_ref, amount, due_at, idempotency_key, state, aggregate_version]
      properties:
        instruction_id: {$ref: "#/components/schemas/OpaqueId"}
        obligation_type: {enum: [supplier_payable, commission_obligation, service_payable]}
        obligation_ref: {$ref: "#/components/schemas/OpaqueId"}
        source_type: {enum: [distribution_acceptance, commission_rule, engagement_allocation_plan]}
        source_version_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_disbursement_connection_ref: {$ref: "#/components/schemas/PayerDisbursementConnectionRef"}
        beneficiary_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payout_destination_ref: {$ref: "#/components/schemas/PayoutDestinationRef"}
        buyer_order_ref: {$ref: "#/components/schemas/OpaqueId"}
        supply_order_ref: {$ref: "#/components/schemas/OpaqueId"}
        order_line_ref: {$ref: "#/components/schemas/OpaqueId"}
        order_split_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
        service_engagement_ref: {$ref: "#/components/schemas/OpaqueId"}
        service_milestone_ref: {$ref: "#/components/schemas/OpaqueId"}
        engagement_allocation_plan_ref: {$ref: "#/components/schemas/OpaqueId"}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        due_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 8, maxLength: 200}
        mandate_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_bound_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_usage_reservation_ref: {$ref: "#/components/schemas/OpaqueId"}
        action_intent_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: System-created typed ActionIntent for a deterministic in-bound transfer; absent while authorization is still required or manual evidence is required.
        authorization_basis_snapshot_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Immutable snapshot of obligation source, mandate digest, exactly one matching bound, usage reservation and transfer amount.
        state: {enum: [created, authorization_required, ready, executing, provider_accepted, confirmed, result_unknown, reconciling, manual_required, reversed, written_off]}
        provider_operation_ref: {type: string, minLength: 1, maxLength: 500}
        evidence_refs:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 500}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      allOf:
        - oneOf:
            - properties:
                obligation_type: {const: supplier_payable}
                source_type: {const: distribution_acceptance}
              required: [buyer_order_ref, supply_order_ref, order_line_ref, order_split_snapshot_ref]
              not:
                anyOf:
                  - required: [service_engagement_ref]
                  - required: [service_milestone_ref]
                  - required: [engagement_allocation_plan_ref]
            - properties:
                obligation_type: {const: commission_obligation}
                source_type: {const: commission_rule}
              required: [buyer_order_ref, order_line_ref]
              not:
                anyOf:
                  - required: [supply_order_ref]
                  - required: [service_engagement_ref]
                  - required: [service_milestone_ref]
                  - required: [engagement_allocation_plan_ref]
            - properties:
                obligation_type: {const: service_payable}
                source_type: {const: engagement_allocation_plan}
              required: [service_engagement_ref, service_milestone_ref, engagement_allocation_plan_ref]
              not:
                anyOf:
                  - required: [buyer_order_ref]
                  - required: [supply_order_ref]
                  - required: [order_line_ref]
                  - required: [order_split_snapshot_ref]
        - if:
            properties:
              state: {enum: [ready, executing, provider_accepted, confirmed, result_unknown, reconciling]}
            required: [state]
          then:
            required: [mandate_ref, mandate_bound_ref, mandate_usage_reservation_ref, action_intent_ref, authorization_basis_snapshot_ref]
      description: All three payable types use the same transfer control. The server verifies that payer_party_ref owns payer_disbursement_connection_ref, beneficiary_party_ref owns payout_destination_ref, and amount.currency equals the selected mandate bound currency. Only confirmed SupplierPayable instructions authorize SupplyOrder fulfillment.
    SettlementMandateUsageReservation:
      type: object
      additionalProperties: false
      required: [reservation_id, settlement_instruction_ref, mandate_ref, mandate_bound_ref, payer_party_ref, beneficiary_party_ref, payout_action_type, amount, period_bucket_start, period_bucket_end, period_timezone, state, aggregate_version]
      properties:
        reservation_id: {$ref: "#/components/schemas/OpaqueId"}
        settlement_instruction_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_ref: {$ref: "#/components/schemas/OpaqueId"}
        mandate_bound_ref: {$ref: "#/components/schemas/OpaqueId"}
        payer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        beneficiary_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payout_action_type: {enum: [supplier_payable_settlement, commission_obligation_settlement, service_payable_settlement, signed_refund_netting, signed_chargeback_netting]}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        period_bucket_start: {type: string, format: date-time}
        period_bucket_end: {type: string, format: date-time}
        period_timezone: {$ref: "#/components/schemas/IanaTimeZone"}
        state: {enum: [reserved, consumed, released]}
        provider_operation_ref: {type: string, minLength: 1, maxLength: 500}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Created atomically with bound selection. amount.currency is the sole reservation currency and must equal the selected bound currency. period_timezone must equal the immutable selected bound value; period_bucket_start must be earlier than period_bucket_end and both must equal the server's recomputation from that bound's period, pinned IANA tzdb release and Monday week rule. The cap check counts reserved plus consumed minor-unit amounts in that exact calendar bucket, preventing concurrent instructions from overspending a mandate.
    ManualSettlementEvidenceRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, artifact_sha256, payment_reference, evidence_refs, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        payment_reference: {type: string, minLength: 1, maxLength: 500}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    DataExportRequest:
      type: object
      additionalProperties: false
      required: [format, data_classes]
      properties:
        format: {const: jsonl_zip}
        data_classes:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            enum: [identity, membership, external_identity_refs, assessments, coaching, community, skills, media_refs, commerce, integration_refs, audit]
        locale: {type: string, minLength: 2, maxLength: 35}
      description: Export selection only; the authenticated actor is always the export subject.
    DataExportDownload:
      type: object
      additionalProperties: false
      required: [download_url, content_type, sha256, expires_at]
      properties:
        download_url:
          type: string
          format: uri
          description: Short-lived, purpose-bound URL for this member and export only.
        content_type: {type: string, const: application/zip}
        sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        expires_at: {type: string, format: date-time}
    DataExportStatus:
      type: object
      additionalProperties: false
      required: [export_id, state, format, data_classes, requested_at, retention_policy_ref]
      properties:
        export_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [queued, processing, ready, needs_attention, expired]}
        format: {const: jsonl_zip}
        data_classes:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            enum: [identity, membership, external_identity_refs, assessments, coaching, community, skills, media_refs, commerce, integration_refs, audit]
        requested_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        retention_policy_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        attention_code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        download: {$ref: "#/components/schemas/DataExportDownload"}
      allOf:
        - if:
            properties:
              state: {const: ready}
            required: [state]
          then:
            required: [download, completed_at]
          else:
            not:
              required: [download]
    DeactivateMyAccountRequest:
      type: object
      additionalProperties: false
      required: [acknowledgement]
      properties:
        acknowledgement: {const: deactivate_my_account}
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        export_before_deactivation: {type: boolean, default: false}
      description: A safety acknowledgement, not a compliance approval or eligibility gate.
    AccountDeactivationAccepted:
      type: object
      additionalProperties: false
      required: [deactivation_id, state, aggregate_version, sessions_revoked_at, user_owned_connection_refs, pending_shared_connection_refs]
      properties:
        deactivation_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [deactivated, deactivation_pending_shared_connection_handoff]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        sessions_revoked_at: {type: string, format: date-time}
        user_owned_connection_refs:
          type: array
          maxItems: 100
          description: Connections revoked by this command; contains no credentials.
          items: {$ref: "#/components/schemas/ProviderConnectionRef"}
        pending_shared_connection_refs:
          type: array
          maxItems: 100
          description: Shared Connections preserved for audited owner handoff rather than silently revoked.
          items: {$ref: "#/components/schemas/ProviderConnectionRef"}
        export_ref: {$ref: "#/components/schemas/OpaqueId"}
        retained_fact_policy_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
    ConnectionOwnerRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {enum: [user, organization]}
        id: {$ref: "#/components/schemas/OpaqueId"}
    SharedConnectionOwnerHandoffRequest:
      type: object
      additionalProperties: false
      required: [expected_aggregate_version, current_owner, new_owner, reason, case_ref]
      properties:
        expected_aggregate_version:
          $ref: "#/components/schemas/AggregateVersion"
          description: Must equal If-Match.
        current_owner: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        new_owner: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        reason: {type: string, minLength: 1, maxLength: 1000}
        case_ref: {$ref: "#/components/schemas/OpaqueId"}
      description: The authenticated service identity is the operator; no operator user ID is accepted.
    SharedConnectionOwnerHandoff:
      type: object
      additionalProperties: false
      required: [connection_ref, previous_owner, new_owner, aggregate_version, audit_record_id, handed_off_at]
      properties:
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        previous_owner: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        new_owner: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        audit_record_id: {$ref: "#/components/schemas/OpaqueId"}
        handed_off_at: {type: string, format: date-time}
      description: Contains ownership and audit metadata only, never a provider credential or secret reference.
    StorefrontCatalog:
      type: object
      additionalProperties: false
      required: [store_public_id, contract_version, seller, items]
      properties:
        store_public_id: {$ref: "#/components/schemas/OpaqueId"}
        contract_version: {type: string, minLength: 1, maxLength: 80}
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/StorefrontCatalogItem"}
        next_cursor: {type: string, minLength: 1, maxLength: 1000}
      description: Every item seller_ref must equal the Store seller; a different Seller belongs to a different Store and checkout.
    StorefrontCatalogItem:
      type: object
      additionalProperties: false
      required: [listing_id, listing_revision_id, offer_id, offer_version_id, title, unit_price, availability, seller, fulfillment, refund]
      properties:
        listing_id: {$ref: "#/components/schemas/OpaqueId"}
        listing_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        offer_id: {$ref: "#/components/schemas/OpaqueId"}
        offer_version_id: {$ref: "#/components/schemas/OpaqueId"}
        title: {type: string, minLength: 1, maxLength: 300}
        summary: {type: string, maxLength: 2000}
        unit_price:
          allOf:
            - {$ref: "#/components/schemas/NonNegativeMoney"}
          description: Default effective item price; checkout may resolve a different price only from the Supplier-accepted immutable schedule.
        accepted_price_schedule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        msrp:
          allOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
          description: Advisory suggested retail price, never an automatic checkout or supply gate.
        recommended_floor:
          allOf:
            - $ref: "#/components/schemas/NonNegativeMoney"
          description: Advisory pricing signal; Supplier choice is represented by an explicit DistributionAcceptance for the actual price.
        availability: {enum: [available, limited, manual_confirmation, unavailable]}
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        fulfillment: {$ref: "#/components/schemas/StorefrontFulfillmentSummary"}
        refund: {$ref: "#/components/schemas/StorefrontRefundPolicySummary"}
    StorefrontSellerSummary:
      type: object
      additionalProperties: false
      required: [seller_ref, display_name, selling_arrangement, biller_party_ref, biller_display_name, seller_of_record_party_ref, payment_collector_party_ref, invoice_issuer_party_ref, refund_owner_party_ref, price_owner_party_ref, fulfillment_responsibility_mode]
      properties:
        seller_ref: {$ref: "#/components/schemas/OpaqueId"}
        display_name: {type: string, minLength: 1, maxLength: 200}
        selling_arrangement: {enum: [reseller, sales_agent]}
        biller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        biller_display_name: {type: string, minLength: 1, maxLength: 200}
        seller_of_record_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payment_collector_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        invoice_issuer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        refund_owner_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        price_owner_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        fulfillment_responsibility_mode: {const: per_line_snapshot}
      description: Launch defaults buyer-facing responsibility refs to SellerParty under reseller. Every line separately names its Supplier and fulfiller; carts segment by the complete buyer-facing responsibility tuple, so one checkout never mixes seller-of-record, collector, invoice issuer or refund owner even when a biller ID happens to match.
    CreateStoreBindingRequest:
      type: object
      additionalProperties: false
      required: [action_intent_ref, human_signature_ref, seller_party_ref, selling_arrangement, biller_party_ref, seller_of_record_party_ref, payment_collector_party_ref, invoice_issuer_party_ref, refund_owner_party_ref, price_owner_party_ref, seller_collection_connection_ref, allowed_origins, deployed_contract_version, artifact_sha256, acknowledgement, expected_aggregate_version]
      properties:
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        selling_arrangement: {enum: [reseller, sales_agent]}
        biller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller_of_record_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        payment_collector_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        invoice_issuer_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        refund_owner_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        price_owner_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller_collection_connection_ref: {$ref: "#/components/schemas/SellerCollectionConnectionRef"}
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uri}
        deployed_contract_version: {type: string, minLength: 1, maxLength: 80}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: bind_this_store_to_one_seller_biller_and_responsibility_tuple}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
      description: Reseller launch validation requires all buyer-facing party refs and biller to equal SellerParty; sales_agent requires an explicit signed responsibility contract. Fulfillment is always resolved and snapshotted per line.
    StoreBinding:
      type: object
      additionalProperties: false
      required: [binding_id, store_ref, seller, seller_collection_connection_ref, allowed_origins, deployed_contract_version, state, artifact_sha256, aggregate_version]
      properties:
        binding_id: {$ref: "#/components/schemas/OpaqueId"}
        store_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        seller_collection_connection_ref: {$ref: "#/components/schemas/SellerCollectionConnectionRef"}
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uri}
        deployed_contract_version: {type: string, minLength: 1, maxLength: 80}
        state: {enum: [pending_deployment, active, degraded, revoked, superseded]}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    StorefrontFulfillmentSummary:
      type: object
      additionalProperties: false
      required: [type, promise]
      properties:
        type: {enum: [physical, digital, software, service, coaching]}
        promise: {type: string, minLength: 1, maxLength: 1000}
        estimated_window: {type: string, maxLength: 200}
    StorefrontRefundPolicySummary:
      type: object
      additionalProperties: false
      required: [policy_version_id, summary]
      properties:
        policy_version_id: {$ref: "#/components/schemas/OpaqueId"}
        summary: {type: string, minLength: 1, maxLength: 1000}
    CreateStorefrontOrderIntentRequest:
      type: object
      additionalProperties: false
      required: [store_public_id, items]
      properties:
        store_public_id: {$ref: "#/components/schemas/OpaqueId"}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/StorefrontIntentItem"}
        attribution_token: {type: string, minLength: 16, maxLength: 2048}
      description: Price, seller, commission and totals are deliberately absent and always computed by Commerce.
    StorefrontIntentItem:
      type: object
      additionalProperties: false
      required: [offer_version_id, quantity]
      properties:
        offer_version_id: {$ref: "#/components/schemas/OpaqueId"}
        variant_id: {$ref: "#/components/schemas/OpaqueId"}
        quantity: {type: integer, minimum: 1, maximum: 999}
        promotion_code:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional condition selector only; it never supplies an amount and the server resolves it against the Supplier-accepted schedule.
    StorefrontPricedLine:
      type: object
      additionalProperties: false
      required: [line_id, seller_listing_revision_id, offer_version_id, quantity, base_unit_price, effective_unit_price, pricing_resolution_snapshot_ref, subtotal, supplier_party_ref, fulfillment_party_ref, responsibility_snapshot_ref, supply_acceptance_snapshot_refs, supply_reservation_refs]
      properties:
        line_id: {$ref: "#/components/schemas/OpaqueId"}
        seller_listing_revision_id: {$ref: "#/components/schemas/OpaqueId"}
        offer_version_id: {$ref: "#/components/schemas/OpaqueId"}
        quantity: {type: integer, minimum: 1, maximum: 999}
        base_unit_price:
          allOf:
            - {$ref: "#/components/schemas/NonNegativeMoney"}
          description: Default effective price in the accepted SellerListingRevision.
        effective_unit_price:
          allOf:
            - {$ref: "#/components/schemas/NonNegativeMoney"}
          description: Exact post-condition item price charged before separately itemized shipping and tax.
        effective_price_schedule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        pricing_condition_key: {type: string, minLength: 1, maxLength: 200}
        pricing_resolution_snapshot_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Immutable server resolution of listing, schedule version/digest, condition key and exact effective price; present for fixed pricing too.
        subtotal: {$ref: "#/components/schemas/NonNegativeMoney"}
        supplier_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        fulfillment_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        responsibility_snapshot_ref:
          $ref: "#/components/schemas/OpaqueId"
          description: Immutable line-level Supplier, fulfiller, return terms and buyer-facing responsibility tuple.
        supply_acceptance_snapshot_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        supply_reservation_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Short reservations created before any provider payment session; checkout atomically revalidates their expiry and quantity.
          items: {$ref: "#/components/schemas/OpaqueId"}
    StorefrontPricedSellerOrder:
      type: object
      additionalProperties: false
      required: [seller, lines, total]
      properties:
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/StorefrontPricedLine"}
        total: {$ref: "#/components/schemas/NonNegativeMoney"}
    StorefrontOrderIntentCreated:
      type: object
      additionalProperties: false
      required: [intent_id, aggregate_version, store_public_id, purpose, checkout_token, expires_at, supply_reservations_expire_at, seller_order]
      properties:
        intent_id: {$ref: "#/components/schemas/OpaqueId"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        store_public_id: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {const: checkout}
        checkout_token:
          type: string
          minLength: 32
          maxLength: 4096
          description: One-time bearer bound to this intent, store, Origin, OfferVersions, SellerListingRevisions, DistributionAcceptances, expiry and nonce.
        expires_at: {type: string, format: date-time}
        supply_reservations_expire_at: {type: string, format: date-time}
        seller_order:
          $ref: "#/components/schemas/StorefrontPricedSellerOrder"
          description: Exactly one SellerParty and buyer-facing biller for this checkout; Supplier splits remain backend SupplyOrders.
    CreateCanonicalOrderRequest:
      type: object
      additionalProperties: false
      required: [storefront_intent_ref, store_binding_ref, store_binding_version, seller_responsibility_snapshot_ref, pricing_resolution_snapshot_refs, distribution_acceptance_snapshot_refs, supply_reservation_refs, expected_total]
      properties:
        storefront_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        store_binding_ref: {$ref: "#/components/schemas/OpaqueId"}
        store_binding_version: {$ref: "#/components/schemas/AggregateVersion"}
        seller_responsibility_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
        pricing_resolution_snapshot_refs:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        distribution_acceptance_snapshot_refs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        supply_reservation_refs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        expected_total: {$ref: "#/components/schemas/NonNegativeMoney"}
      description: All monetary values and parties are server-owned references; Commerce rejects any mismatch and never trusts a browser-supplied price or split.
    CanonicalOrderCreated:
      type: object
      additionalProperties: false
      required: [buyer_order_ref, seller_party_ref, biller_party_ref, supply_order_refs, payment_state, supply_order_state, total, aggregate_version]
      properties:
        buyer_order_ref: {$ref: "#/components/schemas/OpaqueId"}
        seller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        biller_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        supply_order_refs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        payment_state: {const: unpaid}
        supply_order_state: {const: awaiting_buyer_payment}
        total: {$ref: "#/components/schemas/NonNegativeMoney"}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    StorefrontBuyerContact:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: {type: string, format: email, maxLength: 320}
        display_name: {type: string, minLength: 1, maxLength: 200}
        phone: {type: string, minLength: 4, maxLength: 40}
    StorefrontFulfillmentInput:
      type: object
      additionalProperties: false
      required: [line_id]
      properties:
        line_id: {$ref: "#/components/schemas/OpaqueId"}
        method_id: {$ref: "#/components/schemas/OpaqueId"}
        recipient_name: {type: string, minLength: 1, maxLength: 200}
        country_code: {type: string, pattern: "^[A-Z]{2}$"}
        postal_code: {type: string, minLength: 1, maxLength: 32}
        address_lines:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, minLength: 1, maxLength: 300}
      description: Only fulfillment-required data; unknown fields and all pricing fields are rejected.
    StorefrontCheckoutRequest:
      type: object
      additionalProperties: false
      required: [return_url]
      properties:
        return_url:
          type: string
          format: uri
          description: Must match the active binding's allowlist; it is never trusted as an open redirect.
        buyer_contact: {$ref: "#/components/schemas/StorefrontBuyerContact"}
        fulfillment_inputs:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/StorefrontFulfillmentInput"}
    StorefrontCheckoutOrder:
      type: object
      additionalProperties: false
      required: [public_number, seller, line_responsibilities, order_state, payment_state, fulfillment_state, supply_order_count, total, order_view_token, order_view_token_expires_at]
      properties:
        public_number: {type: string, minLength: 6, maxLength: 100}
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        line_responsibilities:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/StorefrontLineResponsibilitySnapshot"}
        order_state: {enum: [created, accepted, cancelled, completed, disputed]}
        payment_state: {enum: [unpaid, pending, authorized, paid, failed, partially_refunded, refunded, chargeback]}
        fulfillment_state: {enum: [not_required, pending, in_progress, fulfilled, cancelled]}
        supply_order_count: {type: integer, minimum: 1, maximum: 100}
        total: {$ref: "#/components/schemas/NonNegativeMoney"}
        order_view_token:
          type: string
          minLength: 32
          maxLength: 4096
          description: Short-lived bearer with purpose=order_view bound to this public number and buyer context.
        order_view_token_expires_at: {type: string, format: date-time}
        provider_redirect_uri: {type: string, format: uri}
    StorefrontLineResponsibilitySnapshot:
      type: object
      additionalProperties: false
      required: [line_id, supplier_party_ref, supplier_display_name, fulfillment_party_ref, fulfillment_party_display_name, responsibility_snapshot_ref]
      properties:
        line_id: {$ref: "#/components/schemas/OpaqueId"}
        supplier_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        supplier_display_name: {type: string, minLength: 1, maxLength: 200}
        fulfillment_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        fulfillment_party_display_name: {type: string, minLength: 1, maxLength: 200}
        responsibility_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
    StorefrontCheckoutAccepted:
      type: object
      additionalProperties: false
      required: [checkout_id, intent_id, state, order]
      properties:
        checkout_id: {$ref: "#/components/schemas/OpaqueId"}
        intent_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [processing, redirect_ready, manual_payment_required]}
        order: {$ref: "#/components/schemas/StorefrontCheckoutOrder"}
    StorefrontRefundStatus:
      type: object
      additionalProperties: false
      required: [refund_request_ref, state, outcome_kind, requested_amount]
      properties:
        refund_request_ref: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [requested, accepted, executing, failed, refunded, rejected, withdrawn, manually_resolved_not_refunded]}
        outcome_kind: {enum: [not_refunded, provider_confirmed_refunded, manually_confirmed_refunded, manually_resolved_not_refunded]}
        requested_amount: {$ref: "#/components/schemas/PositiveMoney"}
    StorefrontSupplyFulfillment:
      type: object
      additionalProperties: false
      required: [supply_order_public_ref, supplier_party_ref, supplier_display_name, fulfillment_party_ref, fulfillment_party_display_name, responsibility_snapshot_ref, settlement_state, fulfillment_state]
      properties:
        supply_order_public_ref: {type: string, minLength: 1, maxLength: 100}
        supplier_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        supplier_display_name: {type: string, minLength: 1, maxLength: 200}
        fulfillment_party_ref: {$ref: "#/components/schemas/OpaqueId"}
        fulfillment_party_display_name: {type: string, minLength: 1, maxLength: 200}
        responsibility_snapshot_ref: {$ref: "#/components/schemas/OpaqueId"}
        settlement_state:
          enum: [waiting_for_buyer_payment, transfer_pending, transfer_confirmed, credit_terms, needs_attention, reversed]
          description: Buyer sees delivery readiness without receiving payout credentials or private settlement evidence.
        fulfillment_state: {enum: [pending, authorized, in_progress, fulfilled, cancelled]}
        tracking_or_delivery_summary: {type: string, maxLength: 1000}
    StorefrontOrderView:
      type: object
      additionalProperties: false
      required: [public_number, order_state, payment_state, fulfillment_state, seller, total, supply_fulfillments, refunds, updated_at]
      properties:
        public_number: {type: string, minLength: 6, maxLength: 100}
        order_state: {enum: [created, accepted, cancelled, completed, disputed]}
        payment_state: {enum: [unpaid, pending, authorized, paid, failed, partially_refunded, refunded, chargeback]}
        fulfillment_state: {enum: [not_required, pending, in_progress, fulfilled, cancelled]}
        seller: {$ref: "#/components/schemas/StorefrontSellerSummary"}
        total: {$ref: "#/components/schemas/NonNegativeMoney"}
        supply_fulfillments:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/StorefrontSupplyFulfillment"}
        refunds:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/StorefrontRefundStatus"}
        next_actions:
          type: array
          maxItems: 10
          items: {enum: [wait_for_payment, retry_payment, contact_seller, view_fulfillment, request_refund, no_action]}
        updated_at: {type: string, format: date-time}
    StorefrontBindingHealth:
      type: object
      additionalProperties: false
      required: [store_public_id, state, origin_allowed, deployed_contract_version, minimum_supported_contract_version, last_seen_at, recovery_actions]
      properties:
        store_public_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [active, degraded, contract_upgrade_required, revoked]}
        origin_allowed: {type: boolean}
        deployed_contract_version: {type: string, minLength: 1, maxLength: 80}
        minimum_supported_contract_version: {type: string, minLength: 1, maxLength: 80}
        last_seen_at: {type: string, format: date-time}
        recovery_actions:
          type: array
          maxItems: 10
          items: {enum: [none, retry, verify_origin, upgrade_contract, reconnect_binding]}
    RefundLineRequest:
      type: object
      additionalProperties: false
      required: [order_line_id, quantity]
      properties:
        order_line_id: {$ref: "#/components/schemas/OpaqueId"}
        quantity: {type: integer, minimum: 1, maximum: 999}
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [requested_amount, reason_code]
      properties:
        requested_amount: {$ref: "#/components/schemas/PositiveMoney"}
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/RefundLineRequest"}
        note: {type: string, maxLength: 2000}
        evidence_refs:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
      description: Buyer identity, Order currency and refundable balance are resolved and validated server-side.
    AcceptRefundRequest:
      oneOf:
        - $ref: "#/components/schemas/AcceptRefundForProviderExecution"
        - $ref: "#/components/schemas/AcceptRefundForManualExecution"
      discriminator:
        propertyName: execution_route
        mapping:
          provider: "#/components/schemas/AcceptRefundForProviderExecution"
          manual_seller: "#/components/schemas/AcceptRefundForManualExecution"
    AcceptRefundForProviderExecution:
      type: object
      additionalProperties: false
      required: [execution_route, accepted_amount, provider_connection_ref, action_intent_ref, human_signature_ref, artifact_sha256, acknowledgement]
      properties:
        execution_route: {const: provider}
        accepted_amount: {$ref: "#/components/schemas/PositiveMoney"}
        provider_connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: approve_this_exact_refund_execution}
        decision_reason: {type: string, maxLength: 1000}
    AcceptRefundForManualExecution:
      type: object
      additionalProperties: false
      required: [execution_route, accepted_amount, action_intent_ref, human_signature_ref, artifact_sha256, acknowledgement]
      properties:
        execution_route: {const: manual_seller}
        accepted_amount: {$ref: "#/components/schemas/PositiveMoney"}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        acknowledgement: {const: approve_this_exact_refund_execution}
        decision_reason: {type: string, maxLength: 1000}
    ManualRefundResolutionRequest:
      oneOf:
        - $ref: "#/components/schemas/ResolveRefundManuallyAsRefunded"
        - $ref: "#/components/schemas/ResolveRefundManuallyAsNotRefunded"
      discriminator:
        propertyName: action
        mapping:
          resolve_manually_as_refunded: "#/components/schemas/ResolveRefundManuallyAsRefunded"
          resolve_manually_as_not_refunded: "#/components/schemas/ResolveRefundManuallyAsNotRefunded"
    ResolveRefundManuallyAsRefunded:
      type: object
      additionalProperties: false
      required: [action, action_intent_ref, human_signature_ref, artifact_sha256, expected_aggregate_version, resolved_amount, reason, evidence_refs, resolution_reference]
      properties:
        action: {const: resolve_manually_as_refunded}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        expected_aggregate_version:
          $ref: "#/components/schemas/AggregateVersion"
          description: Must equal If-Match.
        resolved_amount: {$ref: "#/components/schemas/PositiveMoney"}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        resolution_reference: {type: string, minLength: 1, maxLength: 500}
    ResolveRefundManuallyAsNotRefunded:
      type: object
      additionalProperties: false
      required: [action, action_intent_ref, human_signature_ref, artifact_sha256, expected_aggregate_version, reason, evidence_refs]
      properties:
        action: {const: resolve_manually_as_not_refunded}
        action_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        human_signature_ref: {$ref: "#/components/schemas/OpaqueId"}
        artifact_sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        expected_aggregate_version:
          $ref: "#/components/schemas/AggregateVersion"
          description: Must equal If-Match.
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
    RefundOutcome:
      oneOf:
        - $ref: "#/components/schemas/RefundNotRefundedOutcome"
        - $ref: "#/components/schemas/ProviderConfirmedRefundOutcome"
        - $ref: "#/components/schemas/ManuallyConfirmedRefundOutcome"
        - $ref: "#/components/schemas/ManuallyResolvedNotRefundedOutcome"
      discriminator:
        propertyName: kind
        mapping:
          not_refunded: "#/components/schemas/RefundNotRefundedOutcome"
          provider_confirmed_refunded: "#/components/schemas/ProviderConfirmedRefundOutcome"
          manually_confirmed_refunded: "#/components/schemas/ManuallyConfirmedRefundOutcome"
          manually_resolved_not_refunded: "#/components/schemas/ManuallyResolvedNotRefundedOutcome"
    RefundNotRefundedOutcome:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {const: not_refunded}
      description: No verified refund PaymentFact and no refund ledger reversal exist yet.
    ProviderConfirmedRefundOutcome:
      type: object
      additionalProperties: false
      required: [kind, payment_refund_fact_id, amount, provider_ref, confirmed_at]
      properties:
        kind: {const: provider_confirmed_refunded}
        payment_refund_fact_id: {$ref: "#/components/schemas/OpaqueId"}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        provider_ref: {$ref: "#/components/schemas/JobProviderRef"}
        confirmed_at: {type: string, format: date-time}
    ManuallyConfirmedRefundOutcome:
      type: object
      additionalProperties: false
      required: [kind, resolution_id, payment_refund_fact_id, amount, evidence_refs, resolved_at]
      properties:
        kind: {const: manually_confirmed_refunded}
        resolution_id: {$ref: "#/components/schemas/OpaqueId"}
        payment_refund_fact_id: {$ref: "#/components/schemas/OpaqueId"}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        resolved_at: {type: string, format: date-time}
    ManuallyResolvedNotRefundedOutcome:
      type: object
      additionalProperties: false
      required: [kind, resolution_id, reason, evidence_refs, resolved_at]
      properties:
        kind: {const: manually_resolved_not_refunded}
        resolution_id: {$ref: "#/components/schemas/OpaqueId"}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/OpaqueId"}
        resolved_at: {type: string, format: date-time}
      description: Terminal no-refund resolution; it carries no PaymentFact and produces no ledger reversal.
    RefundRequestView:
      type: object
      additionalProperties: false
      required: [refund_request_id, order_id, state, aggregate_version, requested_amount, outcome, requested_at, updated_at]
      properties:
        refund_request_id: {$ref: "#/components/schemas/OpaqueId"}
        order_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [requested, accepted, executing, failed, refunded, rejected, withdrawn, manually_resolved_not_refunded]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        requested_amount: {$ref: "#/components/schemas/PositiveMoney"}
        accepted_amount: {$ref: "#/components/schemas/PositiveMoney"}
        outcome: {$ref: "#/components/schemas/RefundOutcome"}
        requested_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      allOf:
        - if:
            required: [state]
            properties:
              state: {enum: [requested, accepted, executing, failed, rejected, withdrawn]}
          then:
            properties:
              outcome: {$ref: "#/components/schemas/RefundNotRefundedOutcome"}
        - if:
            required: [state]
            properties:
              state: {const: refunded}
          then:
            properties:
              outcome:
                oneOf:
                  - $ref: "#/components/schemas/ProviderConfirmedRefundOutcome"
                  - $ref: "#/components/schemas/ManuallyConfirmedRefundOutcome"
        - if:
            required: [state]
            properties:
              state: {const: manually_resolved_not_refunded}
          then:
            properties:
              outcome: {$ref: "#/components/schemas/ManuallyResolvedNotRefundedOutcome"}
    ActivityCheckInRequest:
      type: object
      additionalProperties: false
      properties:
        presentation_role: {type: string, minLength: 1, maxLength: 80}
        social_energy: {type: integer, minimum: 1, maximum: 5}
        wall_enabled: {type: boolean, default: false}
        matching_enabled: {type: boolean, default: false}
        photo_asset_id: {$ref: "#/components/schemas/OpaqueId"}
      description: Actor identity is derived from the authenticated context; display fields never identify or authorize a user.
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [inbox_id, received_at, state]
      properties:
        inbox_id: {$ref: "#/components/schemas/OpaqueId"}
        received_at: {type: string, format: date-time}
        state: {const: verified}
    ActivityExchangeCodeCreated:
      type: object
      additionalProperties: false
      required: [exchange_code, actor, expires_at]
      properties:
        exchange_code:
          type: string
          minLength: 32
          maxLength: 512
          description: One-time code bound to activity, actor, acting_as=participant, expiry and nonce.
        actor: {$ref: "#/components/schemas/ActivityActorRef"}
        expires_at: {type: string, format: date-time}
    ActivitySessionExchangeRequest:
      type: object
      additionalProperties: false
      required: [exchange_code]
      properties:
        exchange_code: {type: string, minLength: 32, maxLength: 512}
    ActivityActorRef:
      type: object
      additionalProperties: false
      required: [type, id, acting_as]
      properties:
        type: {enum: [user, activity_guest]}
        id: {$ref: "#/components/schemas/OpaqueId"}
        acting_as: {const: participant}
    ActivityPublicConfig:
      type: object
      additionalProperties: false
      required: [registration_open, wall_enabled, matching_enabled, badge_download_enabled]
      properties:
        registration_open: {type: boolean}
        wall_enabled: {type: boolean}
        matching_enabled: {type: boolean}
        badge_download_enabled: {type: boolean}
    ActivitySession:
      type: object
      additionalProperties: false
      description: >-
        The proof is bound to community, activity, session, actor, audience and scopes.
        Every backchannel command verifies those claims against the path, resolved
        participation and authenticated Lounge service client; mismatch is rejected.
      required: [community_id, activity_id, session_id, actor, participation, activity_session_token, aud, scopes, public_config, expires_at, contract_version]
      properties:
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        activity_id: {$ref: "#/components/schemas/OpaqueId"}
        session_id: {$ref: "#/components/schemas/OpaqueId"}
        actor: {$ref: "#/components/schemas/ActivityActorRef"}
        participation:
          $ref: "#/components/schemas/ActivityParticipationRef"
          description: Atomically ensured by exchange using the unique activity-plus-actor key; supplies the version required by the next action.
        activity_session_token:
          type: string
          minLength: 32
          maxLength: 4096
          description: Stored by the Lounge backend or in an HttpOnly scoped session, never in URL, QR, analytics or localStorage.
        aud:
          type: string
          const: urn:freedom:activity-lounge
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [participation.write, encounter.write]
        public_config: {$ref: "#/components/schemas/ActivityPublicConfig"}
        expires_at: {type: string, format: date-time}
        contract_version: {type: string, minLength: 1, maxLength: 80}
    ActivityParticipationRef:
      type: object
      additionalProperties: false
      required: [participation_id, state, aggregate_version]
      properties:
        participation_id: {$ref: "#/components/schemas/OpaqueId"}
        state: {enum: [registered, checked_in, participating, completed, withdrawn]}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    ActivityParticipationAction:
      description: >-
        Actor identity comes only from the activity-session proof. Action names match
        the canonical activity_participation state machine. Encounter reporting uses
        /encounter-reports because it owns a different aggregate.
      oneOf:
        - $ref: "#/components/schemas/ActivityCheckInAction"
        - $ref: "#/components/schemas/ActivityUpdatePreferencesAction"
        - $ref: "#/components/schemas/ActivityRecordAttendanceAction"
        - $ref: "#/components/schemas/ActivityFinishAction"
        - $ref: "#/components/schemas/ActivityWithdrawAction"
      discriminator:
        propertyName: action
        mapping:
          check_in: "#/components/schemas/ActivityCheckInAction"
          update_self_declared_activity_preferences: "#/components/schemas/ActivityUpdatePreferencesAction"
          record_attendance: "#/components/schemas/ActivityRecordAttendanceAction"
          finish_activity_participation: "#/components/schemas/ActivityFinishAction"
          withdraw: "#/components/schemas/ActivityWithdrawAction"
    ActivityCheckInAction:
      type: object
      additionalProperties: false
      required: [action, expected_aggregate_version]
      properties:
        action: {const: check_in}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    ActivityUpdatePreferencesAction:
      type: object
      additionalProperties: false
      required: [action, expected_aggregate_version]
      anyOf:
        - required: [presentation_role]
        - required: [social_energy]
        - required: [wall_enabled]
        - required: [matching_enabled]
      properties:
        action: {const: update_self_declared_activity_preferences}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        presentation_role: {type: string, minLength: 1, maxLength: 80}
        social_energy: {type: integer, minimum: 1, maximum: 5}
        wall_enabled: {type: boolean}
        matching_enabled: {type: boolean}
    ActivityRecordAttendanceAction:
      type: object
      additionalProperties: false
      required: [action, expected_aggregate_version]
      properties:
        action: {const: record_attendance}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        evidence_ref: {$ref: "#/components/schemas/OpaqueId"}
    ActivityFinishAction:
      type: object
      additionalProperties: false
      required: [action, expected_aggregate_version]
      properties:
        action: {const: finish_activity_participation}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    ActivityWithdrawAction:
      type: object
      additionalProperties: false
      required: [action, expected_aggregate_version]
      properties:
        action: {const: withdraw}
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
    CreateMatchRoundRequest:
      type: object
      additionalProperties: false
      required: [strategy, duration_seconds]
      properties:
        strategy: {type: string, minLength: 1, maxLength: 80}
        duration_seconds: {type: integer, minimum: 30, maximum: 7200}
        participant_snapshot_version: {$ref: "#/components/schemas/AggregateVersion"}
    VersionedSystemCommand:
      type: object
      additionalProperties: false
      required: [expected_aggregate_version]
      properties:
        expected_aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
    EncounterReportRequest:
      type: object
      additionalProperties: false
      required: [activity_id, assignment_id, outcome]
      properties:
        activity_id: {$ref: "#/components/schemas/OpaqueId"}
        assignment_id: {$ref: "#/components/schemas/OpaqueId"}
        outcome: {enum: [met, could_not_find, skipped]}
        note_ref: {$ref: "#/components/schemas/OpaqueId"}
    ActivitySessionEncounterAction:
      description: >-
        Actor and activity are derived from X-Activity-Session. These command names
        exactly match the community_encounter_report state machine.
      oneOf:
        - $ref: "#/components/schemas/ActivitySessionReportEncounter"
        - $ref: "#/components/schemas/ActivitySessionDeclineEncounter"
      discriminator:
        propertyName: action
        mapping:
          participant_reports_encounter: "#/components/schemas/ActivitySessionReportEncounter"
          participant_declines_to_report: "#/components/schemas/ActivitySessionDeclineEncounter"
    ActivitySessionReportEncounter:
      type: object
      additionalProperties: false
      required: [action, assignment_id, outcome]
      properties:
        action: {const: participant_reports_encounter}
        assignment_id: {$ref: "#/components/schemas/OpaqueId"}
        outcome: {enum: [met, could_not_find, skipped]}
        note_ref: {$ref: "#/components/schemas/OpaqueId"}
    ActivitySessionDeclineEncounter:
      type: object
      additionalProperties: false
      required: [action, assignment_id]
      properties:
        action: {const: participant_declines_to_report}
        assignment_id: {$ref: "#/components/schemas/OpaqueId"}
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
    GuestSessionCreated:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at]
      properties:
        csrf_token: {type: string, minLength: 16, maxLength: 256}
        expires_at: {type: string, format: date-time}
    DelegatedIntegrationAction:
      type: object
      additionalProperties: false
      description: >-
        A provider-originated action. The one-time token is signed over community,
        connection, provider delivery ID, resolved actor, target aggregate ID, action,
        expected_aggregate_version, expiry and nonce. The server rejects any body/path
        mismatch and never accepts a caller-supplied user ID.
      required: [action_token, provider_delivery_id, action, expected_aggregate_version]
      properties:
        action_token:
          type: string
          minLength: 32
          maxLength: 2048
          description: One-time purpose-bound signed token; resolves actor and target server-side.
        provider_delivery_id: {type: string, minLength: 1}
        action: {type: string, minLength: 1}
        expected_aggregate_version:
          $ref: "#/components/schemas/AggregateVersion"
          description: Must equal both the token-bound version and the If-Match version.
        evidence_ref: {$ref: "#/components/schemas/OpaqueId"}
    SystemConfirmation:
      type: object
      additionalProperties: false
      description: >-
        A non-provider system evaluator confirmation. Service OAuth identifies the
        caller; the pinned rule and evaluator references make the decision replayable.
      required: [expected_aggregate_version, rule_ref, evaluator_ref]
      properties:
        expected_aggregate_version:
          $ref: "#/components/schemas/AggregateVersion"
          description: Must equal the If-Match version.
        rule_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        evaluator_ref: {$ref: "#/components/schemas/EvaluatorRef"}
        evidence_refs:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/OpaqueId"}
    JobRegistryVersion:
      type: string
      pattern: "^sha256:[a-f0-9]{64}$"
      description: >-
        Digest of the immutable server-side job type, executor group and OAuth-client
        allowlist registry used for this claim. General/provider and release-status
        registries have separate active digests; a client cannot select registry contents.
    GeneralProviderExecutorGroup:
      type: string
      enum: [integration, growth, media]
      description: >-
        Canonical executor isolation group. OAuth client identity and queue consumer
        registration are authoritative; this wire value is an exact assertion, not a
        caller-selected privilege.
    GeneralProviderQueueName:
      type: string
      enum: [integration-jobs, growth-jobs, media-jobs]
      x-executor-group-by-value:
        integration-jobs: integration
        growth-jobs: growth
        media-jobs: media
      description: Trusted Queue identity; each value has exactly one active consumer from the mapped executor group.
    GeneralProviderJobType:
      type: string
      enum:
        - payment_session
        - settlement_transfer
        - notification_delivery
        - github_sync
        - provider_reconciliation
        - channel_publication
        - media_transcript
        - media_render
      x-executor-group-by-value:
        payment_session: integration
        settlement_transfer: integration
        notification_delivery: integration
        github_sync: integration
        provider_reconciliation: integration
        channel_publication: growth
        media_transcript: media
        media_render: media
      description: >-
        Closed planning registry for general/provider work. Each value has exactly one
        trusted executor group in x-executor-group-by-value. Release-status values are
        deliberately absent and therefore structurally invalid on /internal/jobs*.
    ReleaseStatusJobType:
      type: string
      enum:
        - project_release_attestation_issue
        - project_release_attestation_revalidate
        - project_release_attestation_revoke
      description: >-
        Closed release-status registry accepted only by the dedicated release-status
        surface and worker. No value is a GeneralProviderJobType.
    QueueDeliveryHandle:
      type: string
      pattern: "^[A-Za-z0-9_-]{43,256}$"
      writeOnly: true
      description: >-
        High-entropy opaque one-time/current handle. PostgreSQL stores only its hash
        in the canonical queue_delivery row bound to delivery ID, exact job ID, Queue,
        executor group where applicable, immutable registry digest, OAuth audience,
        lifecycle state and expiry no later than Queue retention. Claim compares the
        hash in constant time and atomically consumes the current handle into one job
        lease. It is always redacted from logs/traces/errors and is never returned in
        a lease. Redelivery cannot create a second lease: terminal/superseded delivery
        returns 204, a current/conflicting lease returns 409, and a later retry uses a
        newly generated delivery ID and handle.
    JobClaimRequest:
      type: object
      additionalProperties: false
      x-invariants:
        - requested_job_id_is_the_only_row_eligible_for_this_claim
        - delivery_job_queue_group_registry_and_OAuth_audience_equal_the_current_DB_backed_handle_binding
      required: [worker_instance_id, requested_job_id, queue_delivery_id, source_queue, queue_delivery_handle, executor_group, job_registry_version, job_types]
      properties:
        worker_instance_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Diagnostic worker instance ID; OAuth client identity remains authoritative.
        requested_job_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Exact job ID from this Queue delivery; the server never substitutes another eligible row.
        queue_delivery_id: {$ref: "#/components/schemas/OpaqueId"}
        source_queue: {$ref: "#/components/schemas/GeneralProviderQueueName"}
        queue_delivery_handle: {$ref: "#/components/schemas/QueueDeliveryHandle"}
        executor_group:
          $ref: "#/components/schemas/GeneralProviderExecutorGroup"
          description: >-
            Must equal the group registered for the OAuth client and the sole group
            mapped from every requested job type by job_registry_version.
        job_registry_version: {$ref: "#/components/schemas/JobRegistryVersion"}
        job_types:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/GeneralProviderJobType"}
        capabilities:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Diagnostic capability declaration only; the server-side client/type registry remains authoritative.
          items: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
      allOf:
        - if:
            properties:
              executor_group: {const: integration}
            required: [executor_group]
          then:
            properties:
              source_queue: {const: integration-jobs}
              job_types:
                items:
                  enum: [payment_session, settlement_transfer, notification_delivery, github_sync, provider_reconciliation]
        - if:
            properties:
              executor_group: {const: growth}
            required: [executor_group]
          then:
            properties:
              source_queue: {const: growth-jobs}
              job_types:
                items: {const: channel_publication}
        - if:
            properties:
              executor_group: {const: media}
            required: [executor_group]
          then:
            properties:
              source_queue: {const: media-jobs}
              job_types:
                items: {enum: [media_transcript, media_render]}
    JobArtifactRef:
      type: object
      additionalProperties: false
      required: [kind, id, uri, sha256, media_type]
      properties:
        kind: {enum: [object, domain_resource, external_resource]}
        id: {$ref: "#/components/schemas/OpaqueId"}
        uri: {type: string, format: uri-reference, minLength: 1, maxLength: 2048}
        sha256: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        media_type: {type: string, minLength: 1, maxLength: 200}
        schema_ref: {type: string, format: uri}
        version: {type: string, minLength: 1, maxLength: 100}
        expires_at:
          type: string
          format: date-time
          description: Expiry of a signed retrieval URI, not of the immutable referenced object.
    JobLease:
      type: object
      additionalProperties: false
      required: [job_id, job_type, executor_group, source_queue, queue_delivery_id, job_registry_version, provider_operation_key, lease_id, fencing_token, expires_at, attempt, input_refs, connection_refs]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        job_type: {$ref: "#/components/schemas/GeneralProviderJobType"}
        executor_group:
          $ref: "#/components/schemas/GeneralProviderExecutorGroup"
          description: Canonical registry-derived group; must match the authenticated worker and source queue.
        source_queue: {$ref: "#/components/schemas/GeneralProviderQueueName"}
        queue_delivery_id: {$ref: "#/components/schemas/OpaqueId"}
        job_registry_version: {$ref: "#/components/schemas/JobRegistryVersion"}
        provider_operation_key:
          type: string
          minLength: 8
          maxLength: 200
          description: Stable idempotency/reconciliation key derived from the canonical job and unchanged across every lease attempt.
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Decimal monotonic token scoped to the job; compare as an integer, never float.
        expires_at: {type: string, format: date-time}
        attempt: {type: integer, minimum: 1}
        input_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
        connection_refs:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Authorized provider connections for this immutable job input; contains references only, never credentials.
          items: {$ref: "#/components/schemas/ProviderConnectionRef"}
    JobProviderRef:
      type: object
      additionalProperties: false
      required: [provider, connection_id, external_id]
      properties:
        provider: {type: string, minLength: 1, maxLength: 100}
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
        external_id: {type: string, minLength: 1, maxLength: 500}
        operation: {type: string, minLength: 1, maxLength: 100}
        observed_status: {type: string, minLength: 1, maxLength: 100}
    JobBeginProviderOperationRequest:
      type: object
      additionalProperties: false
      required: [lease_id, fencing_token, provider_operation_key]
      properties:
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        provider_operation_key:
          type: string
          minLength: 8
          maxLength: 200
          description: Must exactly match the stable key returned by claim; the worker cannot replace it per attempt.
    JobProviderOperationStarted:
      type: object
      additionalProperties: false
      required: [job_id, lease_id, fencing_token, provider_operation_key, state, started_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        provider_operation_key: {type: string, minLength: 8, maxLength: 200}
        state: {const: running}
        started_at: {type: string, format: date-time}
    JobUsageEntry:
      type: object
      additionalProperties: false
      required: [metric, quantity, unit]
      properties:
        metric: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        quantity:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          description: Non-negative decimal encoded as a string, never float.
        unit: {type: string, minLength: 1, maxLength: 50}
        billing_source_id: {$ref: "#/components/schemas/OpaqueId"}
    JobUsage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobUsageEntry"}
    JobCompleteRequest:
      type: object
      additionalProperties: false
      required: [lease_id, fencing_token, output_refs, usage, provider_refs]
      properties:
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        output_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
        usage: {$ref: "#/components/schemas/JobUsage"}
        provider_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobProviderRef"}
    JobCompletion:
      type: object
      additionalProperties: false
      required: [job_id, lease_id, fencing_token, state, completed_at, output_refs, usage, provider_refs]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        state: {const: succeeded}
        completed_at: {type: string, format: date-time}
        output_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
        usage: {$ref: "#/components/schemas/JobUsage"}
        provider_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobProviderRef"}
    JobHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [lease_id, fencing_token, requested_extension_seconds]
      properties:
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        requested_extension_seconds: {type: integer, minimum: 1, maximum: 3600}
        checkpoint: {$ref: "#/components/schemas/JobCheckpoint"}
    JobHeartbeat:
      type: object
      additionalProperties: false
      required: [job_id, lease_id, fencing_token, expires_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        expires_at: {type: string, format: date-time}
    JobCheckpoint:
      type: object
      additionalProperties: false
      required: [stage, resume_ref]
      properties:
        stage: {type: string, pattern: "^[a-z][a-z0-9_.-]{0,99}$"}
        resume_ref: {$ref: "#/components/schemas/JobArtifactRef"}
        progress_basis_points: {type: integer, minimum: 0, maximum: 10000}
    JobAttemptError:
      type: object
      additionalProperties: false
      required: [class, code, message]
      properties:
        class:
          enum: [provider_transient, provider_permanent, rate_limit, invalid_input, dependency, worker, unknown]
        code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Redacted diagnostic; never contains credentials or private source payloads.
        retry_after_seconds: {type: integer, minimum: 0, maximum: 604800}
    JobFailRequest:
      type: object
      additionalProperties: false
      required: [lease_id, fencing_token, retry_classification, error]
      properties:
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        retry_classification: {enum: [retryable, permanent, needs_input]}
        error: {$ref: "#/components/schemas/JobAttemptError"}
        checkpoint: {$ref: "#/components/schemas/JobCheckpoint"}
        usage: {$ref: "#/components/schemas/JobUsage"}
        provider_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobProviderRef"}
    JobFailureAccepted:
      type: object
      additionalProperties: false
      required: [job_id, lease_id, fencing_token, retry_classification, attempt_state, recorded_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        retry_classification: {enum: [retryable, permanent, needs_input]}
        attempt_state:
          enum: [retry_wait, failed_permanent, manual_unknown]
          description: retryable maps to retry_wait; permanent maps to failed_permanent; needs_input maps to manual_unknown pending operator or user input.
        recorded_at: {type: string, format: date-time}
        next_attempt_at: {type: string, format: date-time}
        checkpoint: {$ref: "#/components/schemas/JobCheckpoint"}
    ReleaseStatusJobClaimRequest:
      type: object
      additionalProperties: false
      x-invariants:
        - requested_job_id_is_the_only_row_eligible_for_this_claim
        - delivery_job_release_status_queue_registry_and_OAuth_audience_equal_the_current_DB_backed_handle_binding
      required: [worker_instance_id, requested_job_id, queue_delivery_id, source_queue, queue_delivery_handle, job_registry_version, job_types]
      properties:
        worker_instance_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Diagnostic instance ID; the dedicated release-status OAuth client identity remains authoritative.
        requested_job_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Exact status job ID from this Queue delivery; no other row may be leased.
        queue_delivery_id: {$ref: "#/components/schemas/OpaqueId"}
        source_queue: {const: release-status}
        queue_delivery_handle: {$ref: "#/components/schemas/QueueDeliveryHandle"}
        job_registry_version: {$ref: "#/components/schemas/JobRegistryVersion"}
        job_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: "#/components/schemas/ReleaseStatusJobType"}
    GitHubRepositoryId:
      $ref: "./project-status-attestation.schema.json#/$defs/repository/properties/repository_id"
    GitHubReleaseId:
      $ref: "./project-status-attestation.schema.json#/$defs/release/properties/release_id"
    GitCommitSha:
      $ref: "./project-status-attestation.schema.json#/$defs/commit_sha"
    OfficialReleaseTag:
      $ref: "./project-status-attestation.schema.json#/$defs/release/properties/release_tag"
      description: >-
        Shared canonical tag schema from ProjectStatusAttestation: strict v-prefixed
        SemVer, canonical numeric identifiers, prerelease allowed and build metadata forbidden.
    PublicProjectReleaseStatusSubject:
      type: object
      additionalProperties: false
      required: [project_id, repository_id, release_tag, commit_sha]
      properties:
        project_id: {$ref: "#/components/schemas/OpaqueId"}
        repository_id: {$ref: "#/components/schemas/GitHubRepositoryId"}
        release_tag: {$ref: "#/components/schemas/OfficialReleaseTag"}
        commit_sha: {$ref: "#/components/schemas/GitCommitSha"}
        release_id:
          $ref: "#/components/schemas/GitHubReleaseId"
          description: Required for official; may appear on unverified only when the exact tag/commit resolves to a published immutable GitHub Release.
    PublicProjectStatusCurrentness:
      type: object
      additionalProperties: false
      required: [checked_at, canonical_read, status_registry_version, revocation_registry_version, issuer_key_registry_version]
      properties:
        checked_at: {type: string, format: date-time}
        canonical_read: {const: cache_disabled_primary}
        status_registry_version: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        revocation_registry_version: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        issuer_key_registry_version: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
      description: >-
        Versions actually checked for this response. A stale cache, replica with
        unknown freshness or unavailable registry cannot populate an official result.
    PublicProjectStatusAttestationProof:
      type: object
      additionalProperties: false
      required: [attestation_id, artifact_url, artifact_sha256, statement_sha256, signature_profile, issuer_id, key_id, issued_at, verified_at, expires_at, verification_receipt_sha256]
      properties:
        attestation_id: {$ref: "#/components/schemas/OpaqueId"}
        artifact_url:
          type: string
          format: uri
          pattern: "^https://"
          description: Canonical protected-registry-derived attestation URL, never supplied by the project manifest or widget.
        artifact_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        statement_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        signature_profile: {const: rfc7797-detached-jws}
        issuer_id: {$ref: "#/components/schemas/OpaqueId"}
        key_id: {$ref: "#/components/schemas/OpaqueId"}
        issued_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        verification_receipt_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
      description: >-
        Public proof identity/digests for the exact current signed attestation. The
        server has already verified subject, detached signature, issuer/key status,
        release/assets/QC/A4 evidence, time window and revocation/supersession chain.
    PublicProjectReleaseStatusReason:
      type: string
      enum:
        - attestation_current
        - no_current_attestation
        - subject_mismatch
        - repository_not_approved
        - release_not_published_immutable
        - release_assets_mismatch
        - qc_or_release_approval_invalid
        - attestation_expired
        - attestation_revoked
        - attestation_superseded
        - issuer_or_key_untrusted
        - verification_failed
    PublicProjectReleaseStatus:
      type: object
      additionalProperties: false
      x-invariants:
        - subject_exactly_echoes_and_canonically_resolves_the_path_and_query_subject
        - official_requires_current_attestation_proof_and_all_cache_disabled_registry_checks
        - unverified_forbids_attestation_proof
        - canonical_record_url_is_derived_from_the_protected_platform_domain_registry
      required: [schema_version, subject, status, reason_code, currentness, canonical_record_url]
      properties:
        schema_version: {const: freedom.public-project-release-status/v1}
        subject: {$ref: "#/components/schemas/PublicProjectReleaseStatusSubject"}
        status: {enum: [official, unverified]}
        reason_code: {$ref: "#/components/schemas/PublicProjectReleaseStatusReason"}
        currentness: {$ref: "#/components/schemas/PublicProjectStatusCurrentness"}
        canonical_record_url:
          type: string
          format: uri
          pattern: "^https://"
        attestation_proof: {$ref: "#/components/schemas/PublicProjectStatusAttestationProof"}
      allOf:
        - if:
            properties:
              status: {const: official}
            required: [status]
          then:
            required: [attestation_proof]
            properties:
              reason_code: {const: attestation_current}
              subject:
                required: [release_id]
          else:
            properties:
              reason_code:
                enum:
                  - no_current_attestation
                  - subject_mismatch
                  - repository_not_approved
                  - release_not_published_immutable
                  - release_assets_mismatch
                  - qc_or_release_approval_invalid
                  - attestation_expired
                  - attestation_revoked
                  - attestation_superseded
                  - issuer_or_key_untrusted
                  - verification_failed
            not:
              required: [attestation_proof]
    ReleaseStatusSubject:
      type: object
      additionalProperties: false
      required: [project_id, repository_id, release_id, release_tag, commit_sha]
      properties:
        project_id: {$ref: "#/components/schemas/OpaqueId"}
        repository_id: {$ref: "#/components/schemas/GitHubRepositoryId"}
        release_id: {$ref: "#/components/schemas/GitHubReleaseId"}
        release_tag: {$ref: "#/components/schemas/OfficialReleaseTag"}
        commit_sha: {$ref: "#/components/schemas/GitCommitSha"}
      description: Exact release subject resolved from the canonical status intent; never a provider operation target.
    ReleaseStatusLeaseProof:
      type: object
      additionalProperties: false
      required: [lease_id, fencing_token]
      properties:
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Decimal monotonic token scoped to the release-status job; compare as an integer, never float.
    SignProjectStatusAttestationRequest:
      type: object
      additionalProperties: false
      required: [job_id, release_status_intent_id, expected_intent_version, lease_proof]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        release_status_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        expected_intent_version: {$ref: "#/components/schemas/AggregateVersion"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
      description: >-
        The only STATUS_SIGNER RPC request. It deliberately carries no candidate
        statement, arbitrary bytes, decision, trust label, official boolean, key ID,
        artifact digest set or signature. The signer reconstructs all of those from
        canonical records with its own status-only DB role after rechecking the exact
        running job, intent version, lease and fence.
    ProjectStatusAttestationSigningReceipt:
      type: object
      additionalProperties: false
      required: [attestation_ref, attestation_sha256, statement_sha256, signature_profile, key_id, signing_receipt_ref, issued_at, expires_at]
      properties:
        attestation_ref: {$ref: "#/components/schemas/JobArtifactRef"}
        attestation_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        statement_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        signature_profile: {const: rfc7797-detached-jws}
        key_id: {$ref: "#/components/schemas/OpaqueId"}
        signing_receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
      description: >-
        Redacted receipt for the signer-created artifact. It never includes private-key
        material or a reusable signing capability; release-status-worker must persist it
        through the canonical completion command under the same current lease/fence.
    PutIncidentQuarantineRequest:
      type: object
      additionalProperties: false
      required: [incident_id, source_ingress, content_sha256, size_bytes, media_type, received_at, delete_by, classification_reason, customer_data_suspected]
      properties:
        incident_id: {$ref: "#/components/schemas/OpaqueId"}
        source_ingress: {enum: [platform-api, webhook-ingress]}
        community_id: {oneOf: [{$ref: "#/components/schemas/OpaqueId"}, {type: "null"}]}
        content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        size_bytes: {type: integer, minimum: 0, maximum: 104857600}
        media_type: {type: [string, "null"], maxLength: 200}
        received_at: {type: string, format: date-time}
        delete_by: {type: string, format: date-time}
        classification_reason: {type: string, minLength: 1, maxLength: 500}
        customer_data_suspected: {const: true}
      x-invariants:
        - delete_by_is_after_received_at_and_no_more_than_24_hours_later
        - content_sha256_and_size_bytes_equal_the_transient_stream_while_it_is_written_once
      description: Metadata argument paired with one transient read-once binary stream; the body itself is never represented as JSON, logged, indexed or replayed.
    IncidentQuarantineReceipt:
      type: object
      additionalProperties: false
      required: [incident_ref, content_sha256, size_bytes, delete_by, receipt_ref, accepted_at]
      properties:
        incident_ref: {$ref: "#/components/schemas/OpaqueId"}
        content_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        size_bytes: {type: integer, minimum: 0, maximum: 104857600}
        delete_by: {type: string, format: date-time}
        receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        accepted_at: {type: string, format: date-time}
      description: Opaque write receipt only; it exposes neither object key nor any read, list or delete capability.
    ReleaseStatusJobState:
      type: string
      enum: [queued, leased, verifying, verification_unknown, reconciling, retry_wait, succeeded, failed_permanent, manual_review, cancelled]
    ReleaseStatusJobLease:
      type: object
      additionalProperties: false
      required: [job_id, job_type, release_status_intent_id, subject, source_queue, queue_delivery_id, job_registry_version, lease_proof, state, expires_at, attempt, verification_input_refs]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        job_type: {$ref: "#/components/schemas/ReleaseStatusJobType"}
        release_status_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        subject: {$ref: "#/components/schemas/ReleaseStatusSubject"}
        source_queue: {const: release-status}
        queue_delivery_id: {$ref: "#/components/schemas/OpaqueId"}
        job_registry_version: {$ref: "#/components/schemas/JobRegistryVersion"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        state:
          allOf:
            - {$ref: "#/components/schemas/ReleaseStatusJobState"}
            - {const: leased}
        expires_at: {type: string, format: date-time}
        attempt: {type: integer, minimum: 1}
        verification_input_refs:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
      description: >-
        Dedicated release-status lease. It intentionally has no connection_ref,
        provider_operation_key, provider_ref, capability or credential field.
    ReleaseStatusVerificationStarted:
      type: object
      additionalProperties: false
      required: [job_id, release_status_intent_id, lease_proof, state, started_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        release_status_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        state:
          allOf:
            - {$ref: "#/components/schemas/ReleaseStatusJobState"}
            - {const: verifying}
        started_at: {type: string, format: date-time}
    ReleaseStatusJobHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [lease_proof, requested_extension_seconds]
      properties:
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        requested_extension_seconds: {type: integer, minimum: 1, maximum: 3600}
        verification_checkpoint_ref: {$ref: "#/components/schemas/JobArtifactRef"}
    ReleaseStatusJobHeartbeat:
      type: object
      additionalProperties: false
      required: [job_id, lease_proof, state, expires_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        state:
          allOf:
            - {$ref: "#/components/schemas/ReleaseStatusJobState"}
            - {enum: [leased, verifying, reconciling]}
        expires_at: {type: string, format: date-time}
    ReleaseStatusDecision:
      type: string
      enum: [attested_official, recorded_not_official, revoked, expired]
    ReleaseStatusJobCompleteRequest:
      type: object
      additionalProperties: false
      required: [lease_proof, decision, status_record_ref, verification_evidence_refs]
      properties:
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        decision: {$ref: "#/components/schemas/ReleaseStatusDecision"}
        status_record_ref: {$ref: "#/components/schemas/OpaqueId"}
        verification_evidence_refs:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
        attestation_ref:
          $ref: "#/components/schemas/JobArtifactRef"
          description: Required only for attested_official; the exact signed attestation returned by status-signer.
      allOf:
        - if:
            properties:
              decision: {const: attested_official}
            required: [decision]
          then:
            required: [attestation_ref]
          else:
            not:
              required: [attestation_ref]
    ReleaseStatusJobCompletion:
      type: object
      additionalProperties: false
      required: [job_id, release_status_intent_id, lease_proof, state, decision, status_record_ref, completed_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        release_status_intent_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        state:
          allOf:
            - {$ref: "#/components/schemas/ReleaseStatusJobState"}
            - {const: succeeded}
        decision: {$ref: "#/components/schemas/ReleaseStatusDecision"}
        status_record_ref: {$ref: "#/components/schemas/OpaqueId"}
        completed_at: {type: string, format: date-time}
        attestation_ref: {$ref: "#/components/schemas/JobArtifactRef"}
      allOf:
        - if:
            properties:
              decision: {const: attested_official}
            required: [decision]
          then:
            required: [attestation_ref]
          else:
            not:
              required: [attestation_ref]
    ReleaseStatusJobError:
      type: object
      additionalProperties: false
      required: [class, code, message]
      properties:
        class:
          enum: [source_registry, artifact_fetch, verification, signer, database, worker, unknown]
        code: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Redacted diagnostic; never contains credentials, private source payloads or signing-key material.
        retry_after_seconds: {type: integer, minimum: 0, maximum: 604800}
    ReleaseStatusJobFailRequest:
      type: object
      additionalProperties: false
      required: [lease_proof, retry_classification, error]
      properties:
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        retry_classification: {enum: [retryable, permanent, manual_review]}
        error: {$ref: "#/components/schemas/ReleaseStatusJobError"}
        verification_evidence_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
    ReleaseStatusJobFailureAccepted:
      type: object
      additionalProperties: false
      required: [job_id, lease_proof, retry_classification, attempt_state, recorded_at]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_proof: {$ref: "#/components/schemas/ReleaseStatusLeaseProof"}
        retry_classification: {enum: [retryable, permanent, manual_review]}
        attempt_state:
          allOf:
            - {$ref: "#/components/schemas/ReleaseStatusJobState"}
            - {enum: [retry_wait, failed_permanent, manual_review]}
        recorded_at: {type: string, format: date-time}
        next_attempt_at: {type: string, format: date-time}
    ProviderCredentialPurpose:
      type: string
      pattern: "^[a-z][a-z0-9_.:-]{1,99}$"
      description: Exact purpose from the canonical pending/current Connection; a request value never broadens that record.
    TransientOAuthCredentialMaterial:
      type: object
      additionalProperties: false
      writeOnly: true
      required: [material_format, access_token, refresh_token, token_type, expires_at, granted_scopes, provider_subject]
      properties:
        material_format: {const: oauth-token-response-v1}
        access_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        refresh_token:
          type: [string, "null"]
          minLength: 1
          maxLength: 16384
          writeOnly: true
        token_type: {type: string, minLength: 1, maxLength: 100}
        expires_at: {type: [string, "null"], format: date-time}
        granted_scopes:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 300}
        provider_subject: {type: [string, "null"], maxLength: 500}
      description: >-
        Single-RPC write-only input. It is redacted before logging/tracing/error handling,
        never persisted as plaintext, encrypted under a per-record DEK before the RPC
        returns and never echoed in a response.
    StoreOAuthCallbackCredentialRequest:
      type: object
      additionalProperties: false
      required: [connection_ref, expected_connection_version, community_id, owner_ref, purpose, callback_receipt_ref, callback_state_sha256, pkce_binding_sha256, lifecycle_idempotency_key, credential_material]
      properties:
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        expected_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        owner_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        purpose: {$ref: "#/components/schemas/ProviderCredentialPurpose"}
        callback_receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        callback_state_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        pkce_binding_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        lifecycle_idempotency_key: {type: string, minLength: 16, maxLength: 200}
        credential_material: {$ref: "#/components/schemas/TransientOAuthCredentialMaterial"}
      description: The broker independently resolves the pending Connection and verified one-time callback receipt; possession of credential material or a receipt reference is not authorization.
    StoredOAuthCredentialReceipt:
      type: object
      additionalProperties: false
      required: [operation, connection_ref, prior_connection_version, connection_version, secret_ref, credential_fingerprint_sha256, expires_at, receipt_ref, completed_at]
      properties:
        operation: {const: stored_oauth_callback_credential}
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        prior_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        secret_ref: {$ref: "#/components/schemas/OpaqueId"}
        credential_fingerprint_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        expires_at: {type: [string, "null"], format: date-time}
        receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        completed_at: {type: string, format: date-time}
      description: Redacted, idempotent receipt only; no access token, refresh token, DEK, wrapped key or reusable provider capability is returned.
    RotateConnectionCredentialRequest:
      type: object
      additionalProperties: false
      required: [connection_ref, expected_connection_version, community_id, owner_ref, purpose, rotation_intent_ref, rotation_mode, lifecycle_idempotency_key]
      properties:
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        expected_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        owner_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        purpose: {$ref: "#/components/schemas/ProviderCredentialPurpose"}
        rotation_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        rotation_mode: {enum: [provider_refresh, replace_with_verified_material]}
        lifecycle_idempotency_key: {type: string, minLength: 16, maxLength: 200}
        credential_material: {$ref: "#/components/schemas/TransientOAuthCredentialMaterial"}
      allOf:
        - if:
            properties:
              rotation_mode: {const: replace_with_verified_material}
            required: [rotation_mode]
          then:
            required: [credential_material]
          else:
            not:
              required: [credential_material]
      description: provider_refresh uses only the broker-held current refresh material; replacement mode requires a separately verified transient token set. Neither mode accepts caller-selected vault or key identifiers.
    RotatedConnectionCredentialReceipt:
      type: object
      additionalProperties: false
      required: [operation, connection_ref, prior_connection_version, connection_version, secret_ref, credential_fingerprint_sha256, prior_secret_revocation_state, expires_at, receipt_ref, completed_at]
      properties:
        operation: {const: rotated_connection_credential}
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        prior_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        secret_ref: {$ref: "#/components/schemas/OpaqueId"}
        credential_fingerprint_sha256: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        prior_secret_revocation_state: {enum: [confirmed, pending_provider_confirmation, locally_disabled, not_supported]}
        expires_at: {type: [string, "null"], format: date-time}
        receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        completed_at: {type: string, format: date-time}
      description: Redacted rotation receipt only; no old or new credential material is returned.
    RevokeConnectionCredentialRequest:
      type: object
      additionalProperties: false
      required: [connection_ref, expected_connection_version, community_id, owner_ref, purpose, revocation_intent_ref, reason_code, lifecycle_idempotency_key]
      properties:
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        expected_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        community_id: {$ref: "#/components/schemas/OpaqueId"}
        owner_ref: {$ref: "#/components/schemas/ConnectionOwnerRef"}
        purpose: {$ref: "#/components/schemas/ProviderCredentialPurpose"}
        revocation_intent_ref: {$ref: "#/components/schemas/OpaqueId"}
        reason_code: {enum: [owner_request, operator_security_action, provider_reauth_required, compromised, superseded]}
        lifecycle_idempotency_key: {type: string, minLength: 16, maxLength: 200}
      description: Contains no credential, secret reference selected by the caller, job identity or provider operation; the broker resolves and disables the current vault record from the exact Connection version.
    RevokedConnectionCredentialReceipt:
      type: object
      additionalProperties: false
      required: [operation, connection_ref, prior_connection_version, connection_version, new_capability_state, provider_revocation_state, receipt_ref, completed_at]
      properties:
        operation: {const: revoked_connection_credential}
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        prior_connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        connection_version: {$ref: "#/components/schemas/AggregateVersion"}
        new_capability_state: {const: disabled}
        provider_revocation_state: {enum: [confirmed, pending_provider_confirmation, locally_disabled, not_supported]}
        receipt_ref: {$ref: "#/components/schemas/OpaqueId"}
        completed_at: {type: string, format: date-time}
      description: Redacted revocation receipt. It never returns the former secret reference or any credential material.
    ProviderConnectionRef:
      type: object
      additionalProperties: false
      required: [provider, connection_id]
      properties:
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
      description: Generic non-authorizing reference. Commerce effects must use a purpose-tagged reference below; possession of one purpose never implies another.
    SellerCollectionConnectionRef:
      type: object
      additionalProperties: false
      required: [provider, connection_id, purpose]
      properties:
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {const: seller_collection}
      description: Seller-owned connection authorized to collect buyer payment; it does not authorize outbound transfer.
    PayerDisbursementConnectionRef:
      type: object
      additionalProperties: false
      required: [provider, connection_id, purpose]
      properties:
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {const: payer_disbursement}
      description: Purpose-tagged reference to a payer-owned connection from which an authorized settlement may be initiated. The enclosing command names the payer once; the server resolves ownership and rejects a mismatch. It does not collect buyer payment or identify a beneficiary.
    PayoutDestinationRef:
      type: object
      additionalProperties: false
      required: [provider, connection_id, purpose]
      properties:
        provider: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        connection_id: {$ref: "#/components/schemas/OpaqueId"}
        purpose: {const: beneficiary_payout_destination}
      description: Purpose-tagged reference to a verified beneficiary destination. The enclosing command names the beneficiary once; the server resolves ownership and rejects a mismatch. It grants no collection or payer-disbursement authority.
    ProviderProxyOperationRequest:
      type: object
      additionalProperties: false
      description: >-
        Typed private Credential Broker RPC input. The broker loads the stable provider
        operation key and allowed provider operation from the canonical running job;
        request_ref contains a redacted/versioned operation payload, never a credential.
      required: [job_id, lease_id, fencing_token, connection_ref, operation_name, request_ref]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
        operation_name: {type: string, pattern: "^[a-z][a-z0-9_.-]{1,99}$"}
        request_ref: {$ref: "#/components/schemas/JobArtifactRef"}
    ProviderProxyOperationResult:
      type: object
      additionalProperties: false
      description: Private proxy result containing references and provider receipts only; never stored credential material.
      required: [job_id, lease_id, fencing_token, provider_operation_key, output_refs, provider_refs]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
        provider_operation_key: {type: string, minLength: 8, maxLength: 200}
        output_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobArtifactRef"}
        provider_refs:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/JobProviderRef"}
    ProviderCredentialExchangeRequest:
      type: object
      additionalProperties: false
      description: >-
        The server must atomically verify that the lease ID and monotonic fencing
        token are current for a job already durably in running state and that
        connection_ref is authorized by that job's immutable input before issuing a capability.
      required: [job_id, lease_id, fencing_token, connection_ref]
      properties:
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        lease_id: {$ref: "#/components/schemas/OpaqueId"}
        fencing_token:
          type: string
          pattern: "^[1-9][0-9]*$"
        connection_ref: {$ref: "#/components/schemas/ProviderConnectionRef"}
    ProviderCredentialCapability:
      type: object
      additionalProperties: false
      description: >-
        A short-lived, least-privilege capability whose lifetime cannot exceed the
        current job lease. This response never contains a stored provider API key,
        refresh token, or other long-lived secret.
      required: [capability_token, token_type, aud, scopes, expires_at, credential_issuance_id]
      properties:
        capability_token:
          type: string
          minLength: 32
          maxLength: 4096
          description: Ephemeral bearer capability bound to the verified job, lease, fencing token and connection.
        token_type: {type: string, const: Bearer}
        aud:
          type: string
          minLength: 1
          maxLength: 500
          description: Exact provider adapter or proxy audience allowed to consume this capability.
        scopes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, pattern: "^[a-z][a-z0-9:._/-]{0,199}$"}
        expires_at:
          type: string
          format: date-time
          description: Short expiry no later than the current job lease expiry.
        credential_issuance_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Audit and revocation handle; not a provider credential.
    StaleJobLeaseProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, job_id, presented_lease_id, presented_fencing_token]
      properties:
        type:
          type: string
          const: https://contracts.freedom.example/problems/stale-job-lease
        title: {type: string}
        status: {type: integer, const: 409}
        code: {type: string, const: stale_job_lease}
        detail: {type: string}
        request_id: {type: string}
        job_id: {$ref: "#/components/schemas/OpaqueId"}
        presented_lease_id: {$ref: "#/components/schemas/OpaqueId"}
        presented_fencing_token: {type: string, pattern: "^[1-9][0-9]*$"}
    AmbiguousBrowserCredentialsProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 400}
            code: {const: ambiguous_browser_credentials}
    OriginRejectedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 403}
            code: {const: origin_rejected}
    PurposeTokenInvalidProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 401}
            code: {const: purpose_token_invalid}
    PurposeTokenExpiredProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 410}
            code: {enum: [purpose_token_expired, purpose_token_consumed]}
    StorefrontConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 409}
            code:
              enum: [offer_changed, listing_price_changed, supply_acceptance_changed, supply_reservation_expired, availability_changed, attribution_invalid, contract_upgrade_required]
    StorefrontValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 422}
            code:
              enum: [invalid_order_items, mixed_seller_cart, invalid_fulfillment_input, unsupported_currency, invalid_return_url]
    StorefrontPaymentUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 503}
            code: {const: payment_connection_unavailable}
    ReceiptSupersededByRetractionProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [status, code]
          properties:
            status: {const: 409}
            code: {const: receipt_superseded_by_retraction}
    ImmutableRuleRef:
      type: object
      additionalProperties: false
      required: [id, version, hash]
      properties:
        id: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
    ContentRef:
      type: object
      additionalProperties: false
      required: [id, locale, version, hash]
      properties:
        id: {type: string, minLength: 1}
        locale: {type: string, minLength: 2}
        version: {type: string, minLength: 1}
        hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
    EvaluatorRef:
      type: object
      additionalProperties: false
      required: [name, version, build_sha]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        build_sha: {type: string, minLength: 7}
    PositioningProvenance:
      type: object
      additionalProperties: false
      required: [ruleset_ref, content_ref, evaluator_ref, recommendation_policy_ref]
      properties:
        ruleset_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        content_ref: {$ref: "#/components/schemas/ContentRef"}
        evaluator_ref: {$ref: "#/components/schemas/EvaluatorRef"}
        recommendation_policy_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
    AssessmentRunCreated:
      type: object
      additionalProperties: false
      required: [run_id, access_mode, lifecycle_state, aggregate_version, definition_ref]
      oneOf:
        - properties:
            access_mode: {const: guest}
          required: [guest_access_token, claim_secret]
          not:
            required: [owner_user_id]
        - properties:
            access_mode: {const: user}
          required: [owner_user_id]
          not:
            anyOf:
              - required: [guest_access_token]
              - required: [claim_secret]
      properties:
        run_id: {$ref: "#/components/schemas/OpaqueId"}
        access_mode: {enum: [guest, user]}
        owner_user_id: {$ref: "#/components/schemas/OpaqueId"}
        lifecycle_state: {const: created}
        aggregate_version: {$ref: "#/components/schemas/AggregateVersion"}
        definition_ref: {$ref: "#/components/schemas/ImmutableRuleRef"}
        guest_access_token:
          type: string
          description: Returned only for a guest run and scoped to this run.
        claim_secret:
          type: string
          description: Returned once for a guest run; server stores only its hash.
    PositioningResult:
      type: object
      additionalProperties: false
      required: [result_id, assessment_run_id, answer_snapshot_hash, result_hash, provenance]
      properties:
        result_id: {$ref: "#/components/schemas/OpaqueId"}
        assessment_run_id: {$ref: "#/components/schemas/OpaqueId"}
        answer_snapshot_hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        result_hash: {type: string, pattern: "^sha256:[a-fA-F0-9]{64}$"}
        provenance: {$ref: "#/components/schemas/PositioningProvenance"}
    IanaTimeZone:
      type: string
      minLength: 3
      maxLength: 100
      pattern: "^(?:UTC|[A-Za-z][A-Za-z0-9._+-]*(?:/[A-Za-z0-9][A-Za-z0-9._+-]*)+)$"
      format: iana-time-zone
      description: Canonical zone name that must exist in the contract release's pinned IANA tzdb; aliases are normalized or rejected consistently before persistence.
    NonNegativeMoney:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          format: nonnegative-int64-decimal-string
          x-minimum: "0"
          x-maximum: "9223372036854775807"
          description: Nonnegative 64-bit minor-unit integer encoded as a canonical decimal string; contract CI must enforce this custom format and clients use bigint/decimal, never float.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    PositiveMoney:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          pattern: "^[1-9][0-9]*$"
          format: positive-int64-decimal-string
          x-minimum: "1"
          x-maximum: "9223372036854775807"
          description: Positive 64-bit minor-unit integer encoded as a canonical decimal string; zero is invalid for an actual refund, transfer or nonzero mandate bound.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    PositiveMinorAmount:
      type: string
      pattern: "^[1-9][0-9]*$"
      format: positive-int64-decimal-string
      x-minimum: "1"
      x-maximum: "9223372036854775807"
      description: Positive 64-bit minor-unit amount whose currency is declared exactly once by the enclosing object; contract CI must enforce the custom format.
    SignedMoneyDelta:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          pattern: "^(0|-?[1-9][0-9]*)$"
          format: signed-int64-decimal-string
          x-minimum: "-9223372036854775808"
          x-maximum: "9223372036854775807"
          description: Signed 64-bit minor-unit change encoded as a canonical decimal string; negative values reduce, positive values increase, and negative zero is invalid.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        request_id: {type: string}
  responses:
    ValidationFailed:
      description: Request is valid JSON but fails the pinned artifact schema or domain validation; no revision is created.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    VersionConflict:
      description: Optimistic-concurrency conflict
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    StateConflict:
      description: Aggregate cannot perform the command in its current state
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ReceiptSupersededByRetraction:
      description: Original review receipt was superseded by an appended retraction and cannot restore acceptance.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ReceiptSupersededByRetractionProblem"}
    ClaimExpired:
      description: One-time assessment claim secret expired; start a new assessment instead of fuzzy linking.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ExchangeCodeExpired:
      description: One-time activity exchange code expired or was already consumed; create a new code from the Portal.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    AmbiguousBrowserCredentials:
      description: Both guest and user identity credentials were presented; the server rejects the request instead of selecting one.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/AmbiguousBrowserCredentialsProblem"}
    OriginRejected:
      description: Origin is absent, malformed or not allowed for this browser surface.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/OriginRejectedProblem"}
    PurposeTokenInvalid:
      description: Storefront bearer is invalid, targets another resource, or has the wrong exact purpose.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/PurposeTokenInvalidProblem"}
    PurposeTokenExpired:
      description: Storefront purpose token expired or its one-time nonce was already consumed.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/PurposeTokenExpiredProblem"}
    StorefrontConflict:
      description: Storefront snapshot or binding changed; client must refresh the indicated resource before retrying.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/StorefrontConflictProblem"}
    StorefrontValidationFailed:
      description: Storefront request is structurally valid JSON but cannot form a canonical intent or checkout.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/StorefrontValidationProblem"}
    StorefrontPaymentUnavailable:
      description: The seller-owned payment Connection is unavailable; no paid fact or duplicate Order is created.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/StorefrontPaymentUnavailableProblem"}
    StaleJobLease:
      description: Lease expired, was superseded, or the fencing token is no longer current; late output was not applied.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/StaleJobLeaseProblem"}
security:
  - userSession: []
