      tags: [Quality]
      operationId: listMyReviewerAppointments
      description: Lists the calling member's active and historical scoped reviewer appointments.
      responses:
        "200":
          description: Reviewer appointment history; only currently active rows project qc.review scope
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: {$ref: "#/components/schemas/ReviewerAppointment"}
  /review-submissions/{submissionId}:claim:
    post:
      tags: [Quality]
      operationId: claimReviewSubmission
      description: Reviewer must be a different human principal; another role or agent owned by the author is not independent.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201": {description: ReviewAssignment claimed within product or skill scope}
        "409": {$ref: "#/components/responses/StateConflict"}
  /review-submissions/{submissionId}:decide:
    post:
      tags: [Quality]
      operationId: decideReviewSubmission
      description: >-
        Signs an exact digest as accepted or changes_requested. Community software and
        Skill QC always has zero review fee; customer-funded review belongs to a separate ServiceEngagement.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewDecisionRequest"}
      responses:
        "200": {description: Exact version verdict recorded; accepted verdict may unlock official listing eligibility}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /quality-reviews/{reviewId}:retract:
    post:
      tags: [Quality]
      operationId: retractQualityReview
      description: >-
        Appends a retraction fact without deleting the accepted review. The server derives
        retracted_by from the authenticated principal; clients cannot self-report it. The
        retractor needs an active exact-scope ReviewerAppointment, and a non-original
        reviewer also supplies a distinct second authorizer's exact authorization reference.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetractQualityReviewRequest"}
      responses:
        "200": {description: Retraction appended; original review history retained and projections invalidated}
        "403":
          description: Authenticated principal has no active ReviewerAppointment for the review's exact scope
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409": {$ref: "#/components/responses/ReceiptSupersededByRetraction"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /opportunity-stubs:
