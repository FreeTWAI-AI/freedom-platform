  /review-submissions:
    post:
      tags: [Quality]
      operationId: createReviewSubmission
      description: >-
        Anyone may submit a product, SkillVersion, commit, batch or listing candidate.
        A structurally valid, contributor-confirmed first software, Skill or code submission
        creates that human's AI Vibe Runner ProfessionMembership and starting evidence;
        physical-product, service, listing or batch submissions create only their corresponding
        profession evidence. Submission never grants a higher rank or makes an item sellable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateReviewSubmissionRequest"}
      responses:
        "201": {description: Version-scoped submission opened for independent human review}
  /guilds/{guild_id}/reviewer-appointments:
    post:
      tags: [Organization, Quality]
      operationId: createReviewerAppointment
      description: >-
        A named Guild Officeholders Council member appoints one natural-person member for
        one exact review scope through review_by. This is the only source of qc.review scope;
        XP, rank, Master office or product familiarity never creates it automatically.
      parameters:
        - name: guild_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateReviewerAppointmentRequest"}
      responses:
        "201":
          description: Scoped, revocable and review-dated appointment granted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewerAppointment"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /reviewer-appointments/{id}/revoke:
    post:
      tags: [Quality]
      operationId: revokeReviewerAppointment
      description: Revokes future review authority in the appointment scope without deleting prior review history.
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeReviewerAppointmentRequest"}
      responses:
        "200":
          description: Appointment revoked prospectively
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewerAppointment"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /me/reviewer-appointments:
