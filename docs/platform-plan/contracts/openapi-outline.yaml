        "412": {$ref: "#/components/responses/VersionConflict"}
  /service-engagements/{engagementId}/sow-versions/{sowVersionId}:sign:
    post:
      tags: [Opportunities]
      operationId: signServiceSowVersion
      description: Each required human/organization signer A4-signs the exact SOW digest; role switching or an agent cannot duplicate an independent signature.
      parameters:
        - name: engagementId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - name: sowVersionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OpaqueId"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignSowVersionRequest"}
      responses:
        "200": {description: Signature appended; SOW activates only when its required signature set is complete}
        "409": {$ref: "#/components/responses/StateConflict"}
        "412": {$ref: "#/components/responses/VersionConflict"}
  /service-engagements/{engagementId}/allocation-plans:
    post:
