      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateServiceEngagementRequest"}
      responses:
        "201":
          description: Draft ServiceEngagement opened
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceEngagementSummary"}
