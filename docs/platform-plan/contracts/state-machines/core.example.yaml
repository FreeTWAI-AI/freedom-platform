        to: expired
        effects: [release_ready_instruction_capacity_and_move_those_instructions_to_authorization_required, reconcile_executing_provider_accepted_and_result_unknown_operations, preserve_all_obligations]
      - from: active
        command: replace_with_new_signed_revision
        to: superseded
        effects: [release_ready_instruction_capacity_and_move_those_instructions_to_authorization_required, reconcile_executing_provider_accepted_and_result_unknown_operations, preserve_all_obligations]
    invariants:
      - mandate_belongs_to_payer_party_and_uses_that_partys_purpose_tagged_disbursement_connection
      - collection_disbursement_and_beneficiary_destination_authorities_are_distinct_even_when_one_provider_account_supports_more_than_one
      - each_bound_has_a_unique_bound_id_and_one_beneficiary_destination_currency_calendar_period_and_IANA_timezone
      - weeks_begin_Monday_and_period_bucket_boundaries_are_snapshotted
