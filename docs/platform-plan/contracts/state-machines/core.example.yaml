      - reservation_creation_atomically_checks_per_transfer_cap_and_reserved_plus_consumed_period_cap
      - period_bucket_start_end_timezone_and_bound_revision_are_immutable
      - provider_accepted_executing_result_unknown_and_reconciling_states_retain_capacity
      - confirmed_transfer_consumes_capacity
      - capacity_is_released_only_when_no_external_financial_effect_is_possible_or_proven

  settlement_instruction:
    initial: created
    terminal: [reversed, written_off]
    emitted_on_create: freedom.commerce.settlement_instruction.created.v1
    transitions:
      - from: created
        command: match_active_mandate_and_reserve_capacity
        guards: [payable_is_due_and_source_snapshot_is_immutable, payer_beneficiary_destination_currency_action_and_scope_match_exactly_one_active_bound, amount_within_per_transfer_cap, period_cap_capacity_is_atomically_reserved]
        to: ready
        effects: [create_system_action_intent_bound_to_usage_reservation]
      - from: created
        command: record_authorization_required
        guards: [no_exact_active_mandate_bound_matches]
        to: authorization_required
      - from: authorization_required
        command: match_new_active_mandate_and_reserve_capacity
        guards: [payable_is_due_and_source_snapshot_is_immutable, payer_beneficiary_destination_currency_action_and_scope_match_exactly_one_active_bound, amount_within_per_transfer_cap, period_cap_capacity_is_atomically_reserved]
        to: ready
        effects: [create_system_action_intent_bound_to_usage_reservation]
      - from: ready
        command: enqueue_transfer
        guards: [platform_money_movement_enabled_and_seller_mode_is_authorized_mandate_with_active_exact_mandate, mandate_still_active, usage_reservation_still_reserved, payer_disbursement_connection_still_authorized, exact_target_version_matches]
        to: executing
        effects: [create_transfer_job]
      - from: ready
        command: provider_cannot_initiate
        to: manual_required
        effects: [release_usage_capacity, supersede_system_action_intent]
      - from: ready
        command: matching_mandate_revoked_or_expired
        to: authorization_required
        effects: [release_usage_capacity, supersede_system_action_intent]
      - from: executing
        command: observe_provider_acceptance
        to: provider_accepted
        event: freedom.commerce.transfer.provider_accepted.v1
      - from: [executing, provider_accepted]
        command: observe_verified_transfer
        to: confirmed
        event: freedom.commerce.transfer.confirmed.v1
        effects: [consume_usage_capacity, command_confirm_ledger_settlement, conditionally_authorize_supply_order_fulfillment_only_for_supplier_payable]
      - from: [executing, provider_accepted]
        command: record_ambiguous_timeout
        to: result_unknown
      - from: [executing, provider_accepted, result_unknown]
        command: mandate_revoked_or_begin_reconciliation
        to: reconciling
      - from: reconciling
        command: reconcile_confirmed
        to: confirmed
        event: freedom.commerce.transfer.confirmed.v1
        effects: [consume_usage_capacity, command_confirm_ledger_settlement, conditionally_authorize_supply_order_fulfillment_only_for_supplier_payable]
      - from: reconciling
        command: reconcile_safe_to_retry
        guards: [same_mandate_is_active, same_usage_capacity_remains_reserved, stable_provider_operation_key_is_reusable]
        to: ready
      - from: reconciling
        command: reconcile_no_effect_but_authorization_is_no_longer_active
        to: authorization_required
        effects: [release_usage_capacity, supersede_system_action_intent]
      - from: reconciling
        command: require_manual_evidence
        to: manual_required
        effects: [release_usage_capacity_if_reconciliation_proves_no_external_effect]
      - from: manual_required
        command: confirm_from_verified_evidence
        guards: [authorized_human_signature, evidence_matches_instruction]
        to: confirmed
        event: freedom.commerce.settlement_instruction.manual_evidence_confirmed.v1
        effects: [consume_usage_capacity_if_still_reserved, command_confirm_ledger_settlement, conditionally_authorize_supply_order_fulfillment_only_for_supplier_payable]
      - from: [confirmed, manual_required]
        command: append_refund_or_chargeback_reverse_obligation
        to: reversed
      - from: manual_required
        command: write_off_after_authorized_resolution
        guards: [authorized_actor, reason_and_evidence_are_present]
        to: written_off
    invariants:
      - instruction_references_exactly_one_supplier_payable_commission_obligation_or_service_payable_and_its_immutable_source_version
      - supplier_payable_has_order_line_supply_order_and_order_split_snapshot_commission_has_order_line_and_service_has_accepted_milestone_and_allocation_plan
      - ready_or_later_automated_instruction_has_one_system_created_typed_action_intent_exact_signed_mandate_bound_snapshot_and_usage_reservation
      - authorization_required_may_exist_without_an_active_mandate_or_action_intent
      - transfer_uses_payer_owned_purpose_tagged_disbursement_connection_and_verified_beneficiary_destination
      - retry_uses_one_stable_provider_operation_key
      - timeout_after_possible_provider_acceptance_never_blindly_retries
      - refund_or_chargeback_appends_a_reverse_obligation_or_signed_future_netting_fact
      - only_confirmed_supplier_payable_authorizes_supply_order_fulfillment
      - no_platform_wallet_or_silent_balance_rewrite

