        guards: [original_accrual_reference_is_valid, currency_matches_original_accrual, effect_idempotency_key_is_new_or_same_request, reversal_amount_is_positive, cumulative_reversal_below_accrual]
        to: partially_reversed
        event: freedom.ledger.obligation.reversed.v1
      - from: partially_reversed
        command: append_another_partial_reversal
