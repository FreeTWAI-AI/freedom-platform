schema_version: freedom.state-machines/v1
status: planning
transition_journal_contract:
  accepted_mutation: every_accepted_state_mutation_appends_one_internal_StateTransitionRecord_and_increments_aggregate_version
  event_field: optional_published_integration_event_not_the_internal_transition_record
  public_sequence: eventsequence_is_contiguous_per_aggregate_public_event_stream_and_independent_of_aggregate_version
  aggregate_version_semantics: canonical_state_version_may_jump_between_published_events
  canonical_rebuild: owning_module_uses_internal_transition_journal_and_snapshots
  external_rebuild: consumers_use_published_events_or_authoritative_query_snapshot_and_never_wait_for_missing_aggregate_versions
projections:
  manual_settlement_detail:
    display_status: recorded
    invariant: record_only_projection_never_displays_paid_or_settled_by_platform
  review_capacity_navigation:
    enforcement: navigation
    states:
    - not_required
    - available
    - waiting_reviewer_capacity
    derive_from:
    - work_item_review_scope
    - active_exact_scope_reviewer_appointments
    interpretation: available_means_a_qualified_route_exists_not_a_response_time_promise
    support_time_source: accepted_scoped_capacity_reservation_separate_from_appointment
    on_capacity_changed:
    - recompute_navigation_and_route_only
    - upsert_or_resolve_one_scope_episode_card
    - do_not_reopen_work_item_or_emit_work_item_opened
    - do_not_set_official_true_without_exact_review_evidence
    never_changes:
    - work_item_lifecycle
    - claimability
    - membership
    - rank
    - entitlement
    - discoverability
machines:
  guild:
    initial: draft
    terminal: [archived]
    emitted_on_create: freedom.organization.guild.created.v1
    transitions:
      - {from: draft, command: activate_guild, to: active, event: freedom.organization.guild.state_changed.v1}
      - {from: active, command: mark_degraded, to: degraded, event: freedom.organization.guild.state_changed.v1}
      - {from: degraded, command: restore_active, to: active, event: freedom.organization.guild.state_changed.v1}
      - {from: draft, command: update_guild_profile, to: draft, event: freedom.organization.guild.updated.v1}
      - {from: active, command: update_guild_profile, to: active, event: freedom.organization.guild.updated.v1}
      - {from: degraded, command: update_guild_profile, to: degraded, event: freedom.organization.guild.updated.v1}
      - {from: [draft, active, degraded], command: archive_guild, to: archived, event: freedom.organization.guild.state_changed.v1}
    invariants:
      - missing_navigation_readiness_including_private_discord_never_blocks_draft_or_active
      - archived_blocks_only_new_guild_scoped_mutations_and_never_deletes_members_results_or_history
      - profession_membership_self_join_is_a_separate_runner_command_with_no_master_approval

  welcome_ritual_run:
    initial: queued
    terminal: [completed, skipped]
    emitted_on_create: freedom.organization.welcome.started.v1
    transitions:
      - {from: queued, command: automation_starts, to: running, event: freedom.organization.welcome.progressed.v1}
      - {from: running, command: record_automation_or_optional_member_step, to: running, event: freedom.organization.welcome.progressed.v1}
      - {from: [queued, running], command: member_skips_remaining_steps, to: skipped, event: freedom.organization.welcome.completed.v1}
      - {from: running, command: finish_available_steps, to: completed, event: freedom.organization.welcome.completed.v1}
    invariants:
      - every_step_and_status_has_navigation_enforcement
      - no_step_blocks_learning_submission_low_risk_claim_or_future_discoverability
      - master_or_delegate_response_is_never_a_completion_guard

  member_skill_installation:
    initial: recommended
    terminal: [removed]
    transitions:
      - {from: recommended, command: select_exact_package_version, to: equipped}
      - {from: [recommended, equipped, failed, degraded, outdated], command: start_installation_or_recheck, to: installing, event: freedom.skill.member_installation.started.v1}
      - {from: installing, command: record_passing_a1_receipt, to: verified, event: freedom.skill.member_installation.verified.v1}
      - {from: installing, command: record_failing_a1_receipt, to: failed, event: freedom.skill.member_installation.failed.v1}
      - {from: installing, command: record_degraded_a1_receipt, to: degraded, event: freedom.skill.member_installation.degraded.v1}
      - {from: verified, command: newer_recommended_version_detected, to: outdated, event: freedom.skill.member_installation.outdated.v1}
      - {from: [recommended, equipped, installing, verified, failed, degraded, outdated], command: member_removes_local_installation, to: removed}
    invariants:
      - key_is_member_plus_agent_connection_plus_package_version
      - state_and_receipt_enforcement_is_navigation
      - package_capability_readiness_equipped_selection_agent_run_and_member_installation_are_four_distinct_facts
      - failure_degraded_outdated_or_removal_never_revokes_membership_entitlement_or_discoverability

  profession_membership:
    initial: runner
    terminal: [left]
    emitted_on_create: freedom.organization.profession.confirmed.v1
    transitions:
      - from: runner
        command: request_strategist_evidence_review
        to: strategist_review
      - from: strategist_review
        command: request_more_evidence
        to: runner
      - from: strategist_review
        command: confirm_strategist_rank
        guards: [versioned_profession_criteria_met, human_review_evidence_present]
        to: strategist
        event: freedom.organization.rank.recorded.v1
      - from: strategist
        command: request_master_evidence_review
        to: master_review
      - from: master_review
        command: request_more_evidence
        to: strategist
      - from: master_review
        command: confirm_master_rank
        guards: [versioned_profession_criteria_met, human_review_evidence_present]
        to: master
        event: freedom.organization.rank.recorded.v1
      - from: runner
        command: update_membership_profile_or_equipped_skill_refs
        to: runner
        event: freedom.organization.profession_membership.updated.v1
      - from: strategist_review
        command: update_membership_profile_or_equipped_skill_refs
        to: strategist_review
        event: freedom.organization.profession_membership.updated.v1
      - from: strategist
        command: update_membership_profile_or_equipped_skill_refs
        to: strategist
        event: freedom.organization.profession_membership.updated.v1
      - from: master_review
        command: update_membership_profile_or_equipped_skill_refs
        to: master_review
        event: freedom.organization.profession_membership.updated.v1
      - from: master
        command: update_membership_profile_or_equipped_skill_refs
        to: master
        event: freedom.organization.profession_membership.updated.v1
      - from: [runner, strategist_review, strategist, master_review, master]
        command: member_leaves_guild
        to: left
    invariants:
      - rank_is_profession_specific_and_never_a_universal_member_score
      - office_entitlement_payment_and_project_role_are_separate
      - inactivity_never_auto_demotes_or_removes_the_member
      - rejected_rank_review_preserves_prior_rank_and_evidence

  work_intent:
    initial: draft
    terminal: [superseded, withdrawn]
    transitions:
      - from: draft
        command: member_confirms_professions_work_types_and_availability
        to: active
        event: freedom.organization.work_intent.confirmed.v1
      - from: active
        command: create_and_confirm_new_revision
        to: superseded
      - from: [draft, active]
        command: member_withdraws
        to: withdrawn
    invariants:
      - positioning_result_or_ai_draft_never_activates_work_intent_without_member_confirmation
      - one_member_may_select_multiple_professions_and_change_availability
      - work_intent_guides_matching_and_never_grants_office_entitlement_or_payment
      - superseding_a_revision_does_not_rewrite_prior_work_claims_or_results

  office_assignment:
    initial: proposed
    terminal: [ended, declined]
    transitions:
      - from: proposed
        command: nominee_accepts_scope_term_and_handover_duty
        to: active
        event: freedom.organization.office.assigned.v1
      - from: proposed
        command: nominee_declines
        to: declined
      - from: active
        command: begin_handover
        to: handing_over
      - from: handing_over
        command: successor_accepts_and_artifacts_transfer
        guards: [successor_office_assignment_is_accepted, required_handover_artifacts_are_transferred, replacement_module_stewardship_revisions_are_valid]
        to: ended
        event: freedom.organization.office.handed_off.v1
        effects: [atomically_activate_successor_office_and_replacement_module_stewardships_before_ending_current_office]
      - from: active
        command: end_without_ready_successor
        guards: [reason_is_present, temporary_delegate_and_open_succession_task_exist, formal_interim_stewardship_revisions_are_valid_for_every_affected_module]
        to: ended
        effects: [atomically_activate_formal_interim_stewardships_before_ending_current_office]
    invariants:
      - profession_rank_is_not_an_office_assignment
      - office_has_scope_start_end_accountabilities_and_handover_record
      - ending_office_does_not_remove_profession_membership_rank_or_results
      - an_office_cannot_end_until_successor_or_formal_interim_stewardship_is_active_for_every_affected_module

  module_stewardship:
    initial: proposed
    terminal: [superseded]
    transitions:
      - from: proposed
        command: assign_one_accountable_office_holder
        guards: [module_revision_scope_and_office_assignment_are_active]
        to: active
        event: freedom.organization.module_stewardship.assigned.v1
      - from: active
        command: add_or_change_bounded_delegate
        to: active
      - from: active
        command: begin_successor_handover
        to: handing_over
      - from: active
        command: accountable_office_begins_handover
        to: handing_over
      - from: handing_over
        command: activate_new_stewardship_revision
        to: superseded
    invariants:
      - exactly_one_active_accountable_stewardship_per_module_revision
      - delegates_must_have_action_resource_and_time_scope
      - master_is_not_required_to_review_every_routine_item
      - delegation_never_removes_accountability_or_auditability
      - no_active_stewardship_may_reference_an_ended_office_assignment
      - office_end_and_successor_or_formal_interim_stewardship_activation_are_atomic

  guided_discovery_run:
    initial: created
    terminal: [completed, abandoned, expired]
    emitted_on_create: freedom.positioning.guided_discovery.started.v1
    transitions:
      - from: created
        command: begin_conversation
        to: in_progress
      - from: in_progress
        command: save_member_words_and_ai_suggestions
        to: in_progress
      - from: in_progress
        command: create_positioning_draft
        guards: [user_words_present, unknowns_are_explicit, first_evidence_and_falsifier_present]
        to: completed
        event: freedom.positioning.guided_discovery.draft_created.v1
      - from: [created, in_progress]
        command: abandon
        to: abandoned
      - from: [created, in_progress]
        command: expire
        to: expired
    invariants:
      - ai_output_is_a_draft_until_member_confirms_a_career_profile_or_work_intent
      - draft_never_creates_paid_entitlement_or_profession_rank
      - user_words_ai_suggestions_unknowns_first_evidence_falsifier_and_fallback_remain_distinguishable
      - raw_conversation_is_not_in_an_agent_work_context_by_default
  assessment_run:
    initial: created
    terminal: [completed, abandoned, expired]
    emitted_on_create: freedom.positioning.assessment.started.v1
    transitions:
      - from: created
        command: save_answers
        to: in_progress
      - from: in_progress
        command: save_answers
        to: in_progress
      - from: [created, in_progress]
        command: submit
        guards: [answers_are_structurally_complete, server_evaluation_succeeds]
        to: completed
        event: freedom.positioning.assessment.completed.v1
      - from: [created, in_progress]
        command: abandon
        to: abandoned
      - from: [created, in_progress]
        command: expire_at_declared_time
        to: expired
    invariants:
      - completed_result_is_immutable
      - repeating_assessment_creates_new_run
      - incomplete_run_never_blocks_other_modules
  assessment_claim:
    initial: unclaimed
    terminal: [claimed, expired, manually_linked, legacy_unclaimable]
    lifecycle_relation: orthogonal_to_assessment_run
    transitions:
      - from: unclaimed
        command: claim_with_authenticated_session_and_one_time_secret
        guards: [secret_hash_matches, secret_not_expired, run_not_claimed_by_other_user]
        to: claimed
        event: freedom.positioning.assessment.claimed.v1
      - from: unclaimed
        command: expire_claim_secret
        to: expired
      - from: unclaimed
        command: classify_legacy_with_contemporaneous_identity_evidence
        guards: [evidence_is_present]
        to: legacy_resolution_required
      - from: unclaimed
        command: classify_legacy_without_contemporaneous_identity_evidence
        to: legacy_unclaimable
      - from: legacy_resolution_required
        command: link_from_contemporaneous_verified_identity_evidence
        guards: [authorized_identity_operator, evidence_is_present, reason_is_present]
        to: manually_linked
        event: freedom.positioning.assessment.claimed.v1
    invariants:
      - claim_does_not_rewrite_assessment_completion_event
      - client_cannot_supply_claimed_by_user_id
      - same_user_replay_returns_original_result
  member_connection:
    initial: requested
    terminal: [declined, cancelled, ended]
    emitted_on_create: freedom.membership.member_connection.requested.v1
    transitions:
      - from: requested
        command: recipient_accepts_contact_scope
        guards: [requester_and_recipient_are_distinct_users, no_other_requested_or_active_unordered_pair_exists]
        to: active
        event: freedom.membership.member_connection.accepted.v1
      - from: requested
        command: recipient_declines
        to: declined
      - from: requested
        command: requester_cancels
        to: cancelled
      - from: active
        command: either_member_ends_connection
        to: ended
        event: freedom.membership.member_connection.ended.v1
    invariants:
      - this_is_a_mutually_accepted_member_relationship_not_an_external_provider_connection
      - the_relationship_grants_no_private_message_contact_book_or_integration_credential_access

  entitlement:
    initial: available
    terminal: [expired]
    emitted_on_create: freedom.entitlement.granted.v1
    transitions:
      - from: available
        command: activate
        to: active
        event: freedom.entitlement.activated.v1
      - from: active
        command: pause_scoped
        guards: [authorized_actor, reason_is_present]
        to: paused
        event: freedom.entitlement.paused.v1
      - from: paused
        command: restore
        to: active
        event: freedom.entitlement.restored.v1
      - from: [available, active, paused]
        command: revoke_scoped
        guards: [authorized_actor, reason_is_present]
        to: revoked
        event: freedom.entitlement.revoked.v1
      - from: revoked
        command: restore
        guards: [authorized_actor, reason_is_present]
        to: active
        event: freedom.entitlement.restored.v1
      - from: [active, paused]
        command: expire_at_explicit_time
        to: expired
        event: freedom.entitlement.expired.v1
    invariants:
      - career_profile_is_not_authority
      - quota_exhaustion_does_not_transition_entitlement
      - transition_never_deletes_user_result_or_ledger
  order:
    initial: created
    terminal: [cancelled]
    emitted_on_create: freedom.commerce.order.created.v1
    orthogonal_projections: [payment_status, fulfillment_status]
    transitions:
      - from: created
        command: accept_order
        guards: [offer_snapshot_is_valid, exactly_one_seller_and_biller, every_line_has_active_distribution_acceptance_for_exact_actual_price_revision]
        to: accepted
        effects: [command_create_supply_orders_from_immutable_line_snapshots]
      - from: [created, accepted]
        command: cancel
        guards: [cancellation_is_allowed]
        to: cancelled
      - from: accepted
        command: complete
        guards: [payment_is_confirmed, fulfillment_is_accepted_or_not_required]
        to: completed
      - from: [accepted, completed]
        command: open_dispute
        to: disputed
      - from: disputed
        command: resolve_and_complete
        to: completed
      - from: accepted
        command: record_verified_full_refund
        guards: [new_payment_refund_fact_is_linked, cumulative_verified_refund_equals_confirmed_paid_amount]
        to: accepted
        event: freedom.commerce.order.refunded.v1
      - from: completed
        command: record_verified_full_refund
        guards: [new_payment_refund_fact_is_linked, cumulative_verified_refund_equals_confirmed_paid_amount]
        to: completed
        event: freedom.commerce.order.refunded.v1
      - from: disputed
        command: record_verified_full_refund
        guards: [new_payment_refund_fact_is_linked, cumulative_verified_refund_equals_confirmed_paid_amount]
        to: disputed
        event: freedom.commerce.order.refunded.v1
    invariants:
      - offer_split_and_responsibility_snapshots_never_change
      - payment_redirect_is_not_payment_confirmation
      - one_order_has_exactly_one_seller
      - cart_is_segmented_before_checkout_when_seller_parties_differ
      - paid_order_keeps_the_supplier_commitment_that_was_accepted_before_checkout
      - seller_controlled_coupon_or_discount_must_resolve_to_a_preaccepted_effective_item_price_revision
      - shipping_and_tax_are_separately_itemized_from_the_accepted_item_price
      - partial_refund_updates_the_orthogonal_payment_projection_without_emitting_order_refunded

  seller_listing:
    initial: draft
    terminal: [superseded, retired]
    emitted_on_create: freedom.commerce.seller_listing.created.v1
    transitions:
      - from: draft
        command: request_supplier_acceptance
        guards: [actual_price_currency_supply_terms_and_artifact_hash_are_present, qc_verdict_allows_official_listing]
        to: awaiting_supply_acceptance
        event: freedom.commerce.distribution_acceptance.requested.v1
      - from: awaiting_supply_acceptance
        command: observe_supplier_acceptance
        guards: [acceptance_is_active_and_within_its_effective_window, acceptance_binds_exact_listing_revision_and_actual_price, qc_scope_is_currently_satisfied, seller_collection_connection_is_active_and_owned_by_seller, fulfillment_path_is_ready]
        to: sellable
      - from: awaiting_supply_acceptance
        command: observe_supplier_decline
        to: changes_requested
      - from: awaiting_supply_acceptance
        command: observe_supplier_change_request
        to: changes_requested
      - from: [awaiting_supply_acceptance, changes_requested, sellable, paused]
        command: create_new_revision
        to: superseded
        event: freedom.commerce.seller_listing.revised.v1
      - from: sellable
        command: observe_distribution_acceptance_revoked
        to: paused
      - from: sellable
        command: observe_distribution_acceptance_expired
        to: paused
      - from: sellable
        command: observe_distribution_acceptance_superseded
        to: paused
      - from: awaiting_supply_acceptance
        command: observe_distribution_acceptance_expired
        to: changes_requested
      - from: awaiting_supply_acceptance
        command: observe_distribution_acceptance_superseded
        to: superseded
      - from: [draft, awaiting_supply_acceptance, changes_requested, sellable, paused]
        command: retire
        to: retired
    invariants:
      - msrp_and_recommended_floor_are_advisory_fields
      - platform_does_not_auto_block_or_revoke_supply_only_because_actual_price_is_below_an_advisory_value
      - every_actual_price_change_creates_a_new_revision_and_new_supplier_acceptance
      - every_transition_to_sellable_rechecks_current_QC_acceptance_collection_and_fulfillment_readiness
      - no_active_acceptance_means_checkout_is_disabled_before_payment
      - revocation_expiry_or_supersession_of_the_linked_acceptance_removes_sellability_without_touching_prior_reservations_or_orders
      - revocation_blocks_new_reservations_and_orders_but_preserves_preexisting_unexpired_reservations_and_their_awaiting_payment_orders_until_TTL

  distribution_acceptance:
    initial: requested
    terminal: [changes_requested, declined, revoked, expired, superseded]
    transitions:
      - from: requested
        command: supplier_accept_exact_revision
        guards: [authorized_human_signature, artifact_digest_matches, actual_price_and_supply_terms_are_visible]
        to: accepted
        event: freedom.commerce.distribution_acceptance.accepted.v1
      - from: requested
        command: supplier_decline
        to: declined
        event: freedom.commerce.distribution_acceptance.declined.v1
      - from: requested
        command: supplier_request_change
        guards: [reason_and_requested_change_are_present]
        to: changes_requested
        event: freedom.commerce.distribution_acceptance.change_requested.v1
      - from: accepted
        command: supplier_revoke_future_supply
        guards: [authorized_human_signature, reason_is_present]
        to: revoked
        event: freedom.commerce.distribution_acceptance.revoked.v1
      - from: [requested, accepted]
        command: listing_revision_is_superseded
        to: superseded
      - from: [requested, accepted]
        command: expire_at_declared_time
        to: expired
    invariants:
      - acceptance_is_supplier_choice_not_an_automatic_price_gate
      - acceptance_binds_default_actual_price_and_the_exact_effective_price_schedule_digest_if_present
      - acceptance_binds_supplier_due_fulfillment_returns_quantity_or_availability_and_effective_window
      - accepted_paid_supply_orders_and_unexpired_checkout_supply_reservations_survive_future_revocation

  supply_reservation:
    initial: active
    terminal: [consumed, released]
    emitted_on_create: freedom.commerce.supply_reservation.created.v1
    transitions:
      - from: [active, expired]
        command: consume_atomically_with_verified_payment
        guards: [provider_payment_is_verified, provider_occurred_at_not_after_reservation_expiry, exact_listing_acceptance_price_and_quantity_match]
        to: consumed
        event: freedom.commerce.supply_reservation.consumed.v1
      - from: active
        command: checkout_cancelled_or_payment_known_failed
        to: released
      - from: active
        command: expire_before_payment
        to: expired
        event: freedom.commerce.supply_reservation.expired.v1
    invariants:
      - reservation_is_created_before_provider_payment_session
      - supplier_revocation_blocks_new_reservations_but_does_not_break_an_unexpired_one
      - payment_after_reservation_expiry_is_rejected_before_charge_or_reconciled_to_refund_if_provider_raced
      - scheduler_expiry_does_not_reject_a_late_webhook_for_a_verified_payment_whose_provider_occurred_at_was_within_TTL
      - consumption_and_paid_order_link_are_idempotent

  supply_order:
    initial: awaiting_buyer_payment
    terminal: [cancelled, refunded]
    emitted_on_create: freedom.commerce.supply_order.created.v1
    transitions:
      - from: awaiting_buyer_payment
        command: observe_verified_buyer_payment
        to: settlement_due
        effects: [command_create_settlement_instruction]
      - from: settlement_due
        command: observe_confirmed_supplier_settlement
        to: fulfillment_authorized
        event: freedom.commerce.fulfillment.authorized.v1
      - from: settlement_due
        command: apply_explicit_credit_terms
        guards: [signed_credit_terms_cover_this_supply_order]
        to: fulfillment_authorized
        event: freedom.commerce.fulfillment.authorized.v1
      - from: fulfillment_authorized
        command: supplier_accept_fulfillment
        to: fulfilling
      - from: fulfilling
        command: record_fulfillment
        to: fulfilled
        event: freedom.commerce.order.fulfilled.v1
      - from: awaiting_buyer_payment
        command: cancel_unpaid
        to: cancelled
      - from: [settlement_due, fulfillment_authorized, fulfilling, fulfilled]
        command: observe_verified_full_refund
        to: refunded
    invariants:
      - supply_order_references_the_exact_precheckout_distribution_acceptance
      - supplier_cannot_decline_a_paid_order_only_for_an_already_accepted_actual_price
      - seller_payment_and_supplier_settlement_are_distinct_facts
      - fulfillment_requires_confirmed_settlement_or_explicit_signed_credit_terms
  payment:
    initial: unpaid
    terminal: [refunded, chargeback]
    transitions:
      - from: unpaid
        command: create_provider_session
        to: pending
      - from: pending
        command: append_verified_authorization_fact
        guards: [fact_is_verified, amount_and_currency_match_order]
        to: authorized
        event: freedom.commerce.payment.authorized.v1
      - from: [pending, authorized]
        command: append_verified_paid_fact
        guards: [fact_is_verified, amount_and_currency_match_order]
        to: paid
        event: freedom.commerce.payment.confirmed.v1
      - from: [pending, authorized]
        command: record_provider_failure
        to: failed
      - from: failed
        command: retry_with_same_payment_identity
        to: pending
      - from: paid
        command: append_partial_refund_fact
        guards: [fact_is_verified, refund_amount_is_positive, currency_matches_payment, cumulative_refund_remains_below_paid_amount]
        to: partially_refunded
        event: freedom.commerce.payment.refund.confirmed.v1
        effects: [command_order_record_refund, command_ledger_append_proportional_reversal]
      - from: partially_refunded
        command: append_another_partial_refund_fact
        guards: [fact_is_verified, refund_amount_is_positive, currency_matches_payment, cumulative_refund_remains_below_paid_amount]
        to: partially_refunded
        event: freedom.commerce.payment.refund.confirmed.v1
        effects: [command_order_record_refund, command_ledger_append_proportional_reversal]
      - from: [paid, partially_refunded]
        command: append_full_refund_fact
        guards: [fact_is_verified, refund_amount_is_positive, currency_matches_payment, cumulative_refund_equals_paid_amount]
        to: refunded
        event: freedom.commerce.payment.refund.confirmed.v1
        effects: [command_order_record_refund, command_ledger_append_remaining_reversal]
      - from: [paid, partially_refunded]
        command: append_chargeback_fact
        guards: [fact_is_verified, currency_matches_payment, chargeback_references_original_transaction]
        to: chargeback
        event: freedom.commerce.payment.chargeback.recorded.v1
        effects: [command_order_record_chargeback, command_ledger_append_remaining_reversal]
    invariants:
      - browser_return_is_not_a_verified_payment_fact
      - provider_connection_and_transaction_id_are_unique
      - refund_and_chargeback_append_facts_and_ledger_reversals
      - cumulative_refund_never_exceeds_refundable_confirmed_payment
      - authorization_never_accrues_a_financial_obligation
      - every_refund_fact_has_its_own_amount_and_external_or_resolution_reference
  refund_request:
    initial: requested
    terminal: [refunded, rejected, withdrawn, manually_resolved_not_refunded]
    emitted_on_create: freedom.commerce.refund.requested.v1
    transitions:
      - from: requested
        command: accept
        to: accepted
        event: freedom.commerce.refund.accepted.v1
      - from: requested
        command: reject
        to: rejected
        event: freedom.commerce.refund.rejected.v1
      - from: requested
        command: withdraw
        to: withdrawn
      - from: accepted
        command: execute_with_provider
        to: executing
      - from: executing
        command: observe_verified_refund_fact
        guards: [fact_matches_request_and_executed_amount]
        to: refunded
        effects: [link_payment_refund_fact]
      - from: executing
        command: record_provider_failure
        to: failed
      - from: failed
        command: retry_execution
        to: executing
      - from: [accepted, executing, failed]
        command: resolve_manually_as_refunded
        guards: [authorized_actor, evidence_is_present, resolved_refund_fact_is_verified, fact_matches_request_and_executed_amount]
        to: refunded
        effects: [link_payment_refund_fact]
      - from: [accepted, executing, failed]
        command: resolve_manually_as_not_refunded
        guards: [authorized_actor, evidence_is_present, resolution_explicitly_confirms_no_refund, reason_is_present]
        to: manually_resolved_not_refunded
    invariants:
      - accepted_is_not_refunded
