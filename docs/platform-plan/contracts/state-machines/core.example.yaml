    transitions:
      - from: draft
        command: payer_sign_bounded_mandate
        guards: [A4_exact_signature, payer_owned_disbursement_connection_and_beneficiary_destination_are_purpose_verified, currency_action_scope_and_amount_bounds_present, bound_ids_are_unique, no_bounds_have_overlapping_applicability]
