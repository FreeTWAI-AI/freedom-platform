schema_version: freedom.reviewer-appointment-cases/v1
status: synthetic_planning_fixtures_not_runtime
as_of: "2026-09-20T16:00:00Z"
# Pure fixture cases for projecting qc.review:<scope>. No money, network, or secrets.
cases:
  - case_id: positive_active_exact_scope
    kind: positive
    description: Active exact-scope appointment projects qc.review for that scope only
    actor_ref: person_synthetic_reviewer_002
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
      - appointment_id: ra_synthetic_active_001
        appointer_ref: person_synthetic_od10_holder_001
        subject_member_ref: person_synthetic_reviewer_002
        scope: protocol.product.field-review.v1
        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: synthetic OD-10 scoped appointment for field-review
        state: active
        aggregate_version: 1
    non_appointment_signals: {}
    expect:
      projects_qc_review: true
      entitlement_keys: ["qc.review:protocol.product.field-review.v1"]
      independent_of_author: true
      denial_reason: null

  - case_id: positive_second_scope_isolated
    kind: positive
    description: A second active appointment for another exact scope projects only that other key
    actor_ref: person_synthetic_reviewer_002
    requested_scope: protocol.product.other-skill.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
      - appointment_id: ra_synthetic_active_001
        appointer_ref: person_synthetic_od10_holder_001
        subject_member_ref: person_synthetic_reviewer_002
        scope: protocol.product.field-review.v1
        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: synthetic field-review appointment
        state: active
        aggregate_version: 1
      - appointment_id: ra_synthetic_active_002
        appointer_ref: person_synthetic_od10_holder_001
        subject_member_ref: person_synthetic_reviewer_002
        scope: protocol.product.other-skill.v1
        granted_at: "2026-09-05T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: synthetic other-skill appointment
        state: active
        aggregate_version: 1
    non_appointment_signals: {}
    expect:
      projects_qc_review: true
      entitlement_keys: ["qc.review:protocol.product.other-skill.v1"]
      all_active_keys_for_member:
        - "qc.review:protocol.product.field-review.v1"
        - "qc.review:protocol.product.other-skill.v1"
      independent_of_author: true
      denial_reason: null

  - case_id: negative_high_xp_no_appointment
    kind: negative
    description: High XP never creates qc.review without an appointment
    actor_ref: person_synthetic_high_xp_master_004
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments: []
    non_appointment_signals:
      xp_by_profession_track:
        profession_key: software-field
        track: real_delivery
        xp: 99000
    expect:
      projects_qc_review: false
      entitlement_keys: []
      denial_reason: missing_active_exact_scope_reviewer_appointment

  - case_id: negative_rank_master_no_appointment
    kind: negative
    description: Profession Master rank and Guild Master office never create qc.review
    actor_ref: person_synthetic_high_xp_master_004
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments: []
    non_appointment_signals:
      profession_rank: Master
      guild_master_office: true
      office_title: Guild Master
    expect:
