  - case_id: negative_agent_cannot_hold_appointment
    kind: negative
    description: Agent identity cannot hold ReviewerAppointment or qc.review independently
    actor_ref: agent_synthetic_006
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
      - appointment_id: ra_synthetic_agent_attempt_001
        appointer_ref: person_synthetic_od10_holder_001
        subject_member_ref: agent_synthetic_006
        subject_kind: agent
        principal_ref: person_synthetic_agent_principal_007
        scope: protocol.product.field-review.v1
        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: invalid synthetic agent subject — must be rejected by projection
        state: active
        aggregate_version: 1
    non_appointment_signals:
      actor_kind: agent
    expect:
      projects_qc_review: false
      entitlement_keys: []
      denial_reason: agent_cannot_hold_reviewer_appointment
      appointment_rejected: true

  - case_id: negative_expired_appointment
    kind: negative
    description: Expired appointment (state=expired or as_of >= review_by) projects nothing
    actor_ref: person_synthetic_reviewer_002
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
