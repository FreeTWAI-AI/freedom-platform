        state: expired
        aggregate_version: 2
    non_appointment_signals: {}
    expect:
      projects_qc_review: false
      entitlement_keys: []
      denial_reason: appointment_expired_at_review_by

  - case_id: negative_revoked_appointment
    kind: negative
    description: Revoked appointment clears future qc.review without deleting history
    actor_ref: person_synthetic_reviewer_002
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
