        scope: protocol.product.field-review.v1
        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        revoked_at: "2026-09-15T12:00:00Z"
        reason: synthetic revoke for scope cleanup
        state: revoked
        aggregate_version: 2
    non_appointment_signals: {}
    expect:
      projects_qc_review: false
      entitlement_keys: []
      denial_reason: appointment_revoked
      history_preserved: true

  - case_id: negative_mismatched_scope
    kind: negative
    description: Active appointment for a different scope does not project the requested scope
    actor_ref: person_synthetic_reviewer_002
    requested_scope: protocol.product.field-review.v1
