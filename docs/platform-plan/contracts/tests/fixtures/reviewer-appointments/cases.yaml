  - case_id: negative_familiarity_no_appointment
    kind: negative
    description: Product familiarity never creates qc.review
    actor_ref: person_synthetic_familiar_005
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments: []
