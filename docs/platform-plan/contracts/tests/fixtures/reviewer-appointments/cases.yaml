        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: synthetic appointment for a different exact scope
        state: active
        aggregate_version: 1
    non_appointment_signals: {}
    expect:
      projects_qc_review: false
      entitlement_keys: []
      denial_reason: no_active_appointment_for_requested_exact_scope
      other_scope_keys: ["qc.review:protocol.product.other-skill.v1"]

  - case_id: negative_self_review
    kind: negative
    description: Author cannot review own submission even with active exact-scope appointment
    actor_ref: person_synthetic_author_003
    requested_scope: protocol.product.field-review.v1
    submission_author_ref: person_synthetic_author_003
    appointments:
      - appointment_id: ra_synthetic_author_self_001
        appointer_ref: person_synthetic_od10_holder_001
        subject_member_ref: person_synthetic_author_003
        scope: protocol.product.field-review.v1
        granted_at: "2026-09-01T00:00:00Z"
        review_by: "2026-12-31T00:00:00Z"
        reason: synthetic appointment held by submission author
        state: active
        aggregate_version: 1
    non_appointment_signals: {}
    expect:
      # Entitlement may still project for other authors' work, but self-review is denied.
      projects_qc_review: true
      entitlement_keys: ["qc.review:protocol.product.field-review.v1"]
      independent_of_author: false
      self_review_allowed: false
      denial_reason: self_review_not_independent_natural_person

  - case_id: boundary_expire_at_exact_review_by
