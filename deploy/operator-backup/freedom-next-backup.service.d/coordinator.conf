# Install only after the exact private wrapper/adapter passes independent acceptance.
# This replaces the legacy dump and its dump-dependent offsite post-command.
# No timer configuration belongs in this drop-in.
[Service]
ExecStart=
ExecStart=%h/.local/libexec/freedom-daily-recovery-backup production
ExecStartPost=
UMask=0077
TimeoutStartSec=30min
TimeoutStopSec=120
Restart=no
